          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.13 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Pack the snap (no upload)
        env:
          APP: ${{ matrix.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          project="${RUNNER_TEMP}/snapcraft-${APP}"
          collected="${GITHUB_WORKSPACE}/apps/${APP}/build/linux/snap/${APP}.snap"
          cd "$project"
          sudo snapcraft pack --destructive-mode
          count="$(find "$project" -maxdepth 1 -type f -name '*.snap' | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "FAIL snapcraft exited 0 and left ${count} .snap file(s) in ${project}; exactly one is required." >&2
            find "$project" -maxdepth 1 -type f -name '*.snap' >&2
            exit 1
          fi
          built="$(find "$project" -maxdepth 1 -type f -name '*.snap')"
          mkdir -p "$(dirname "$collected")"
          sudo mv "$built" "$collected"
          sudo chown "$(id -u):$(id -g)" "$collected"
          ls -l "$collected"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.14 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Prepare the Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/android-signing.mjs --app ${{ matrix.app }} --channel android-play
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.15 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Resolve the app's store SDK key secret (play-billing)
        id: rc-key
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/store-key-secret.mjs --app ${{ matrix.app }} --rail play-billing >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.16 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Build android (apk — sideloadable build proof)
        env:
          RELEASE_LINE: ${{ steps.ver.outputs.release_line }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REVENUECAT_PUBLIC_KEY: ${{ secrets.REVENUECAT_PUBLIC_KEY_GOOGLE }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/flutter-release-build.mjs ${{ matrix.app }} apk android-play
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.17 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Build android (aab — the Google Play artifact)
        id: build_aab
        env:
          RELEASE_LINE: ${{ steps.ver.outputs.release_line }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REVENUECAT_PUBLIC_KEY: ${{ secrets.REVENUECAT_PUBLIC_KEY_GOOGLE }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/flutter-release-build.mjs ${{ matrix.app }} appbundle android-play
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.18 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Stamp the .aab with the channel its build compiled in
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/stamp-channel.mjs --channel android-play --build-step build_aab apps/${{ matrix.app }}/build/app/outputs/bundle/release/*.aab
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.19 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Prepare the apps.gov.in signing key (its own key, never the upload key)
        id: agi_key
        env:
          APP: ${{ matrix.app }}
          APPSGOVIN_KEYSTORE_BASE64: ${{ secrets.APPSGOVIN_KEYSTORE_BASE64 }}
          APPSGOVIN_KEYSTORE_PASSWORD: ${{ secrets.APPSGOVIN_KEYSTORE_PASSWORD }}
          APPSGOVIN_KEY_ALIAS: ${{ secrets.APPSGOVIN_KEY_ALIAS }}
          APPSGOVIN_KEY_PASSWORD: ${{ secrets.APPSGOVIN_KEY_PASSWORD }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          scratch="${RUNNER_TEMP}/apps-gov-in-signing.env"
          : > "$scratch"
          node tooling/ci/android-signing.mjs --app "$APP" --channel apps-gov-in \
            --out "${RUNNER_TEMP}/apps-gov-in-key" --github-output "$scratch"
          posture="$(sed -n 's/^ANDROID_SIGNING_POSTURE=//p' "$scratch")"
          keystore="$(sed -n 's/^ANDROID_KEYSTORE_PATH=//p' "$scratch")"
          rm -f "$scratch"
          case "$posture" in
            release-signed)
              if [ -z "$keystore" ]; then
                echo "::error title=apps.gov.in key::posture release-signed but no ANDROID_KEYSTORE_PATH was exported"
                exit 1
              fi
              echo "posture=release" >> "$GITHUB_OUTPUT" ;;
            debug-signed-build-proof)
              echo "### apps.gov.in signing: THE APPSGOVIN_* SECRETS ARE NOT SET. THE .apk BELOW IS DEBUG-SIGNED AND NAMED NOT-FOR-UPLOAD." >> "$GITHUB_STEP_SUMMARY"
              echo "posture=debug" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error title=apps.gov.in key::android-signing.mjs exported no posture (got \"${posture}\")"
              exit 1 ;;
          esac
          echo "keystore_path=${keystore}" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.20 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Set the Play .apk aside (Flutter writes every .apk to one path)
        working-directory: apps/${{ matrix.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          rm -rf build/android-play-apk-aside
          mkdir -p build/android-play-apk-aside
          mv build/app/outputs/flutter-apk/app-release.apk build/android-play-apk-aside/
          if [ -f build/app/outputs/flutter-apk/app-release.apk.sha1 ]; then mv build/app/outputs/flutter-apk/app-release.apk.sha1 build/android-play-apk-aside/; fi
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.21 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Build android (apk — apps.gov.in, its own key, sells nothing)
        id: build_apk_agi
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.agi_key.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.APPSGOVIN_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.APPSGOVIN_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.APPSGOVIN_KEY_PASSWORD }}
          RELEASE_LINE: ${{ steps.ver.outputs.release_line }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/flutter-release-build.mjs ${{ matrix.app }} apk apps-gov-in
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.22 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Take the apps.gov.in .apk out, and put the Play .apk back
        id: agi_apk
        working-directory: apps/${{ matrix.app }}
        env:
          APP: ${{ matrix.app }}
          BUILD_NAME: ${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          file="${APP}-apps-gov-in-${BUILD_NAME}.apk"
          mkdir -p build/apps-gov-in
          mv build/app/outputs/flutter-apk/app-release.apk "build/apps-gov-in/${file}"
          rm -f build/app/outputs/flutter-apk/app-release.apk.sha1
          mv build/android-play-apk-aside/* build/app/outputs/flutter-apk/
          rmdir build/android-play-apk-aside
          if cmp -s build/app/outputs/flutter-apk/app-release.apk "build/apps-gov-in/${file}"; then
            echo "::error title=apps.gov.in apk::the restored Play .apk is byte-identical to the apps.gov.in one"
            exit 1
          fi
          echo "apk=apps/${APP}/build/apps-gov-in/${file}" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.23 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Stamp the apps.gov.in .apk with the channel its build compiled in
        env:
          APK: ${{ steps.agi_apk.outputs.apk }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/stamp-channel.mjs --channel apps-gov-in --build-step build_apk_agi "$APK"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.24 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Stage symbols-${{ matrix.app }}-linux-android for this run's later jobs (generated)
        id: nikatru-stage-1
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: |
            apps/${{ matrix.app }}/build/symbols/linux
            apps/${{ matrix.app }}/build/symbols/android-apk
            apps/${{ matrix.app }}/build/symbols/android-aab
            apps/${{ matrix.app }}/build/symbols/android-apk-apps-gov-in
          NIKATRU_IF_NO_FILES: error
        run: node tooling/ci/shell-handoff.mjs stage
      - name: Hand off symbols-${{ matrix.app }}-linux-android to this run's later jobs (generated)
        if: ${{ (!cancelled()) && steps.nikatru-stage-1.outputs.has == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-handoff/x
          key: nikatru-handoff-symbols-${{ matrix.app }}-linux-android-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
      - name: The .aab must be signed by the upload key, not the debug key
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-artifact-signed.mjs apps/${{ matrix.app }}/build/app/outputs/bundle/release/app-release.aab
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.26 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Every artifact this lane claims exists, and is not empty
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-artifact-shape.mjs --app ${{ matrix.app }} --platform linux_web_android
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.27 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Every native library is aligned for a 16 KB memory page
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node --single-threaded tooling/ci/assert-elf-page-alignment.mjs apps/${{ matrix.app }}/build/app/outputs/bundle/release/app-release.aab
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.28 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Dump the .aab's merged permissions, cross-checked against the Play .apk
        id: aab_permissions
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/dump-aab-permissions.mjs --aab apps/${{ matrix.app }}/build/app/outputs/bundle/release/app-release.aab --apk apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk --out ${{ runner.temp }}/android-permissions.json --run-id ${{ github.run_id }} --commit ${{ env.NIKATRU_SHA }} --artifact store-${{ matrix.app }}-android-aab-${{ env.ANDROID_SIGNING_POSTURE }}
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.29 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The Data safety merged set equals this build's .aab
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-play-declarations.mjs --merged-dump ${{ runner.temp }}/android-permissions.json --app ${{ matrix.app }}
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.30 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The built .apk passes the static apps.gov.in VAPT items
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-android-vapt-manifest.mjs apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk --app ${{ matrix.app }}
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.32 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Install glitchtip-cli (pinned by version AND by digest)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/install-pinned-tool.mjs glitchtip-cli --out "$RUNNER_TEMP"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.33 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Upload the native debug symbols to GlitchTip
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
          APP: ${{ matrix.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          gt_org="$(node -p "require('./tooling/ops/glitchtip-project.json').org")"
          gt_project="$(node -p "require('./tooling/ops/glitchtip-project.json').project")"
          for lane in linux android-apk android-aab android-apk-apps-gov-in; do
            node tooling/ops/upload-native-symbols.mjs \
              --cli "${RUNNER_TEMP}/glitchtip-cli" \
              --dir "apps/${APP}/build/symbols/${lane}" \
              --org "$gt_org" --project "$gt_project"
          done
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.34 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The apps.gov.in .apk passes the static apps.gov.in VAPT items
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-android-vapt-manifest.mjs ${{ steps.agi_apk.outputs.apk }} --app ${{ matrix.app }}
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.39 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The apps.gov.in .apk's native libraries are aligned for a 16 KB memory page
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node --single-threaded tooling/ci/assert-elf-page-alignment.mjs ${{ steps.agi_apk.outputs.apk }}
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.linux_web_android.40 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The apps.gov.in listing media is still the derivation of the Play set
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node --single-threaded tooling/ci/assert-apps-gov-in-media.mjs
