        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Restore the apps-gov-in-${{ matrix.app }}-apk hand-off (generated)
        id: nikatru-restore-9
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-handoff/x
          key: nikatru-handoff-apps-gov-in-${{ matrix.app }}-apk-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nikatru-handoff-apps-gov-in-${{ matrix.app }}-apk-${{ github.run_id }}-
          enableCrossOsArchive: true
      - name: Place the apps-gov-in-${{ matrix.app }}-apk hand-off where download-artifact put it (generated)
        if: ${{ (success()) && steps.nikatru-restore-9.outputs.cache-matched-key != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_TO: downloads/apps-gov-in-${{ matrix.app }}-apk/apps-gov-in-${{ matrix.app }}-apk
        run: |
          mkdir -p "$NIKATRU_TO"
          cp -a .nikatru-handoff/x/. "$NIKATRU_TO/"
          rm -rf .nikatru-handoff/x
      - name: The uploadable apps.gov.in .apk, or one line naming the null pin
        env:
          AGI_DIR: downloads/apps-gov-in-${{ matrix.app }}-apk
          REF_TYPE: ${{ (startsWith(github.event.client_payload.ref || 'refs/heads/main', 'refs/tags/') && 'tag' || 'branch') }}
        run: |
          set -euo pipefail
          pin="$(node -p "require('./tooling/channel-register.json').channels.find((c) => c.id === 'apps-gov-in').signing.signingCertificate.sha256")"
          # ⏱ 2026-10-07: the pin is set (nikatru-appsgovin). The .apk is OWED by a release (a tag run) only: a scheduled or
          # dispatched branch run that uploaded nothing is the declared empty, not a missing .apk (release-nothing-owed.test.mjs).
          if [ -d "$AGI_DIR" ]; then
            echo "uploadable apps.gov.in apk downloaded into ${AGI_DIR}; --stage takes it with its stamp"
          elif [ "$pin" = "null" ]; then
            echo "no uploadable apps.gov.in apk: signingCertificate.sha256 is null"
          elif [ "$REF_TYPE" != "tag" ]; then
            echo "no uploadable apps.gov.in apk on a non-tag run: a release tag owes it (signingCertificate.sha256 is set)"
          else
            echo "::error title=apps.gov.in apk::signingCertificate.sha256 is ${pin} and this run uploaded no $(basename "$AGI_DIR") artifact"
            exit 1
          fi
      - name: Stage the installers and archive the rest
        id: stage
        env:
          APP: ${{ matrix.app }}
          REF_NAME: ${{ env.NIKATRU_REF_NAME }}
          REF_TYPE: ${{ (startsWith(github.event.client_payload.ref || 'refs/heads/main', 'refs/tags/') && 'tag' || 'branch') }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="${APP}-untagged-$(git rev-parse --short HEAD)"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          # AUTHORITATIVE, and it sits here rather than after `--stage` because
          # this is the last moment the installers still carry their build names:
          # `--stage` renames every one of them after $TAG. `set -euo pipefail`
          # above is what makes a non-zero exit fail the job.
          # UNCONDITIONAL on purpose — on a non-tag run $TAG is the
          # `<app>-untagged-<sha>` value synthesised above, which the guard treats
          # as a no-op ONLY with --ref-type branch (a pushed tag in that shape is
          # refused), so every dispatch and every scheduled run still exercises
          # the parse and proves the code loads. Gating this on
          # `ref_type == 'tag'` would leave it dead until the first real release.
          node tooling/ci/assert-app-versioning.mjs --tag "$TAG" --ref-type "$REF_TYPE" --app "apps/$APP"
          mkdir -p dist
          # ⏱ 2026-10-01: `downloads` may not exist — no upload is in the `<app>-*` namespace unless a
          # channel's row says a Release carries it (limb 1c), and a pattern matching nothing makes no directory.
          mkdir -p downloads
          # Each installer's build stamp goes to stamps/, never to dist/ (flat, and
          # published whole); the next step reads each file's channel from there.
          node tooling/ci/release-manifest.mjs --stage downloads --out dist --stamps stamps --app "$APP" --tag "$TAG" --ref-type "$REF_TYPE"
          # --stage has already refused any store-only file under downloads/, so
          # nothing this loop archives is one (docs/ci/build-platforms.md §store-only).
          for d in downloads/*/; do
            [ -d "$d" ] || continue
            n="$(basename "$d")"
            if [ -z "$(find "$d" -type f -print -quit)" ]; then
              echo "skip  ${n} — every file in it was staged as an installer"
              continue
            fi
            tar -czf "dist/${TAG}-${n}.tar.gz" -C "$d" .
            echo "archived  ${TAG}-${n}.tar.gz"
          done
          # ⏱ 2026-10-05 — THE DECLARED EMPTY, ON A NON-TAG RUN ONLY (scheduled run 37319711546). Since
          # 2026-10-01 every app format is store-only or withheld (the apps.gov.in .apk while its pin is
          # null), so `--stage` above stages nothing, says why and exits 0 — and an empty dist is reachable
          # ONLY that way: the other empty is COVERAGE LOST, exit 2, and fails this step. There is then no
          # release to describe, checksum, grade or attest, and the cron and every dispatch went red on
          # `--emit-release-json`'s refusal of an empty set after every platform built. The steps that read
          # dist/ skip on this output, with this line as their reason. A TAG never takes this branch: a tag
          # of nothing still fails at the describe step, which is the refusal a release day needs.
          # tooling/ci/test/release-nothing_owed.test.mjs runs this job's real steps over an empty download.
          if [ "$REF_TYPE" != "tag" ] && [ -z "$(find dist -type f -print -quit)" ]; then
            echo "nothing_owed=${APP}" >> "$GITHUB_OUTPUT"
            echo "::notice title=No release to describe (${APP})::--stage staged nothing and owes nothing on this non-tag run; the describe, checksum, grade, record and attest steps are skipped by design (the reason is printed above)."
          fi
      - name: Describe the release, versioned per artefact
        if: steps.stage.outputs.nothing_owed != matrix.app
        env:
          APP: ${{ matrix.app }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASES_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/tag
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # $RELEASE_TAG comes from $GITHUB_ENV two steps up; composing the notes
          # URL here rather than in `env:` keeps the one declaration of the tag.
          NOTES_URL="${RELEASES_BASE}/${RELEASE_TAG}"
          # The SAME emitter the build jobs read, run again here rather than passed
          # between jobs: a release line carried through a job output is a second
          # copy of pubspec.yaml's number, and the copy is what drifts.
          RELEASE_LINE="$(node tooling/ci/assert-app-versioning.mjs --emit "apps/${APP}" | sed -n 's/^release_line=//p')"
          # 🔴 THE ARTEFACTS DO NOT CARRY THE TAG'S NUMBER. The build jobs build
          # with `--build-name=<release line>.<run number>`, so the bytes say
          # 1.0.<run> while the tag says 1.0.0. The record states what was BUILT;
          # the guard requires only that major.minor agree with the tag.
          # ⚠️ `$?` IS NOT READ AFTER A PIPE ANYWHERE IN THIS STEP — `set -euo
          # pipefail` on line 1 is what makes a failing substitution fail the job.
          # 🔴 NO --min-supported HERE. The release line is MAJOR.MINOR ("1.0"), and
          # passing it as the floor is what failed run 35829208001's grade step:
          # `#/minSupported: "1.0" does not match ^[0-9]+\.[0-9]+\.[0-9]+$`. The
          # emitter reads the app surface's floor from the file the platform Worker
          # enforces force-update from, services/platform/src/app-config-data.json
          # (apps.<app>.min_supported_version[<channel>], else [default], else defaults), and REFUSES the flag on
          # this surface, so a second, typed copy of that number cannot come back.
          RELEASED_AT="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ "$NIKATRU_SHA")"
          node tooling/ci/release-manifest.mjs --emit-release-json dist \
            --app "$APP" --tag "$RELEASE_TAG" --sha "$NIKATRU_SHA" \
            --run-url "$RUN_URL" --notes-url "$NOTES_URL" \
            --released-at "$RELEASED_AT" \
            --version "${RELEASE_LINE}.${RUN_NUMBER}" \
            --build "$RUN_NUMBER" \
            --stamps stamps
      - name: Write the checksum manifest, naming the gated commit
        if: steps.stage.outputs.nothing_owed != matrix.app
        env:
          APP: ${{ matrix.app }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          node tooling/ci/release-manifest.mjs --write dist
          --app "$APP" --tag "$RELEASE_TAG" --sha "$NIKATRU_SHA" --run-url "$RUN_URL"
      - name: Re-verify every asset against the manifest
        if: steps.stage.outputs.nothing_owed != matrix.app
        run: >
          node tooling/ci/release-manifest.mjs --verify dist
          --expect-formats --for-workflow .github/workflows/build-platforms.yml
      - name: Grade the release record against the bytes beside it
        if: steps.stage.outputs.nothing_owed != matrix.app
        run: node tooling/ci/assert-release-json.mjs --dir dist
      - name: Stage release-dist-${{ matrix.app }} for this run's later jobs (generated)
        id: nikatru-stage-10
        if: steps.stage.outputs.nothing_owed != matrix.app
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: dist
          NIKATRU_IF_NO_FILES: error
        run: node tooling/ci/shell-handoff.mjs stage
      - name: Hand off release-dist-${{ matrix.app }} to this run's later jobs (generated)
        if: ${{ (steps.stage.outputs.nothing_owed != matrix.app) && steps.nikatru-stage-10.outputs.has == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-handoff/x
          key: nikatru-handoff-release-dist-${{ matrix.app }}-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
      - name: The register must be able to name where this ships
        env:
          APP: ${{ matrix.app }}
          REF_TYPE: ${{ (startsWith(github.event.client_payload.ref || 'refs/heads/main', 'refs/tags/') && 'tag' || 'branch') }}
        run: node tooling/ci/release-manifest.mjs --emit-environments dist --app "$APP" --ref-type "$REF_TYPE"
      - name: Publish the GitHub Release (tag pushes only)
        if: (startsWith(github.event.client_payload.ref || 'refs/heads/main', 'refs/tags/') && 'tag' || 'branch') == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "Built from commit \`${NIKATRU_SHA}\`, which passed \`ci-gate\` before any binary in this release existed."
            echo
            echo "Verify every download with a tool you already have:"
            echo
            echo "    sha256sum -c SHA256SUMS"
            echo
            echo "and check that this repository's release workflow built it (docs/release/verify-a-download.md):"
            echo
            echo "    gh attestation verify <file> --repo ${GH_REPO} --signer-workflow ${GH_REPO}/.github/workflows/build-platforms.yml --source-ref refs/tags/${RELEASE_TAG}"
            echo
            echo "Produced by ${RUN_URL}"
          } > dist-notes.md
          # 🔴 EACH SUBSTITUTION IS AN ASSIGNMENT OF ITS OWN: `set -e` never sees a `$(…)` spent as an
          # argument, so a failing --emit-assets published an EMPTY release and a failing view wrote ''.
          assets="$(node tooling/ci/release-manifest.mjs --emit-assets dist)"
          # shellcheck disable=SC2086 # one asset name per word, none holds a space
          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file dist-notes.md $assets
          release_url="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
          echo "RELEASE_URL=${release_url}" >> "$GITHUB_ENV"
      - name: The release must carry the assets this job just uploaded
        if: (startsWith(github.event.client_payload.ref || 'refs/heads/main', 'refs/tags/') && 'tag' || 'branch') == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "⬜ [14]O-7 reading back the release ${REPO}@${RELEASE_TAG}"
          node tooling/ops/post-deploy-smoke.mjs --release-repo "$REPO" --release-tag "$RELEASE_TAG" --release-manifest dist/SHA256SUMS
      - name: Record what shipped, per channel this release is the origin for
        if: (startsWith(github.event.client_payload.ref || 'refs/heads/main', 'refs/tags/') && 'tag' || 'branch') == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          # 🔴 AN ASSIGNMENT, NOT A `for` WORD LIST: `set -e` fails the step on the assignment's
          # exit and never on a word list's (O-APP-RELEASE-RECORDS-NO-DEPLOYMENT-SILENTLY).
          environments="$(node tooling/ci/release-manifest.mjs --emit-environments dist --app "$APP")"
          # apps.gov.in has no submission API: this Release is the ORIGIN of the .apk the owner uploads
          # by hand, the state record-deployment.mjs accepts on `submittable: false` store rows only
          # (O-APPS-GOV-IN-APK-HAS-NO-ORIGIN-ROW). A direct row takes no state.
          for environment in $environments; do
            state=()
            case "$environment" in
              *-apps-gov-in) state=(--state pending_manual_publish) ;;
            esac
            node tooling/ci/record-deployment.mjs "$environment" "$RELEASE_URL" "${state[@]}"
          done

