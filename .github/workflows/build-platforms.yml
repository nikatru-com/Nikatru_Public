          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name build-platforms.apple.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Patch the SDK for flutter/flutter#188060 (macOS AOT abort)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
