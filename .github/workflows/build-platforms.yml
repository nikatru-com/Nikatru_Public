        if: ${{ !((startsWith(github.event.client_payload.ref || 'refs/heads/main', 'refs/tags/') && 'tag' || 'branch') == 'tag' || needs.release.outputs.nothing_owed != matrix.app) }}
        env:
          APP: ${{ matrix.app }}
        run: echo "::notice title=Nothing to attest (${APP})::the release job staged nothing and owes nothing on this non-tag run, so it handed over no directory"
      - name: Restore the release-dist-${{ matrix.app }} hand-off (generated)
        id: nikatru-restore-5
        if: (startsWith(github.event.client_payload.ref || 'refs/heads/main', 'refs/tags/') && 'tag' || 'branch') == 'tag' || needs.release.outputs.nothing_owed != matrix.app
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-handoff/x
          key: nikatru-handoff-release-dist-${{ matrix.app }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nikatru-handoff-release-dist-${{ matrix.app }}-${{ github.run_id }}-
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Place the release-dist-${{ matrix.app }} hand-off where download-artifact put it (generated)
        if: ${{ ((startsWith(github.event.client_payload.ref || 'refs/heads/main', 'refs/tags/') && 'tag' || 'branch') == 'tag' || needs.release.outputs.nothing_owed != matrix.app) && steps.nikatru-restore-5.outputs.cache-matched-key != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_TO: dist
        run: |
          mkdir -p "$NIKATRU_TO"
          cp -a .nikatru-handoff/x/. "$NIKATRU_TO/"
          rm -rf .nikatru-handoff/x
      - name: Attest the build provenance of every release file
        if: (startsWith(github.event.client_payload.ref || 'refs/heads/main', 'refs/tags/') && 'tag' || 'branch') == 'tag' || needs.release.outputs.nothing_owed != matrix.app
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*
      - name: Verify every release file's provenance
        if: (startsWith(github.event.client_payload.ref || 'refs/heads/main', 'refs/tags/') && 'tag' || 'branch') == 'tag' || needs.release.outputs.nothing_owed != matrix.app
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: >
          node tooling/ci/verify-provenance.mjs --dir dist --repo "$REPO"
          --signer-workflow "${REPO}/.github/workflows/build-platforms.yml"
          --attestation-id "$ATTESTATION_ID" --attestation-url "$ATTESTATION_URL"
          --out "${RUNNER_TEMP}/provenance.json"

