          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ci.sites.10 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The status page passes the accessibility scan
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
