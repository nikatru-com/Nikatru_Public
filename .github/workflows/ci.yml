          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ci.sites.11 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: RED CONTROL — the scan fails an unlabeled button, a covering sticky nav and a deleted register row
