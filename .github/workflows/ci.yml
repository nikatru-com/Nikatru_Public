          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ci.guards-chassis.27 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Every app carries a done-record, and its DoD items really run
        if: ${{ !cancelled() }}
        run: |
