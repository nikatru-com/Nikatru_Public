          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-app-dod.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ci.guards-chassis.28 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The DoD keyboard row states the route counts the keyboard tests assert
        if: ${{ !cancelled() }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-dod-keyboard-row.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ci.guards-chassis.29 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Every mutation proof still addresses the code it was run against
        if: ${{ !cancelled() }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-mutation-proofs.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ci.guards-chassis.30 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: No branch carries a done-record the pre-push --refresh would rewrite
        if: ${{ !cancelled() }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-mutation-proofs.mjs --refresh --check
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ci.guards-chassis.31 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Hand this job's red detail to the report job, sealed (generated)
        id: nikatru-handoff
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_HANDOFF: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-ci.guards-chassis.${{ strategy.job-index }}
        run: |
          if [ -s "$RUNNER_TEMP/report-detail.md" ]; then
            py=python3; python3 -c '' >/dev/null 2>&1 || py=python
            "$py" -I "$GITHUB_WORKSPACE/tooling/ci/shell-report.py" handoff
          fi
      - name: Save the hand-off (generated)
        if: always() && steps.nikatru-handoff.outputs.has == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-detail
          key: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-ci.guards-chassis.${{ strategy.job-index }}
          enableCrossOsArchive: true

  security-scan:
    name: Security — secret and workflow scanners
    if: (github.event_name != 'repository_dispatch' || (github.event.client_payload.event == 'push' && github.event.client_payload.ref == 'refs/heads/main') || github.event.client_payload.event == 'pull_request') && (github.event.client_payload.draft != true)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          fetch-depth: 0
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node
      - name: Point the pinned-tool installer at the cache directory
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          echo "PINNED_TOOL_CACHE=${RUNNER_TEMP}/pinned-tool-cache" >> "$GITHUB_ENV"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ci.security-scan.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/pinned-tool-cache
          key: pinned-tools-${{ runner.os }}-${{ hashFiles('tooling/versions.json') }}
      - name: Install gitleaks (version and digest from tooling/versions.json)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          node tooling/ci/install-pinned-tool.mjs gitleaks --out "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/gitleaks" version
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ci.security-scan.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Secret scan (self-tests, then the tree, then the change's commits)
        env:
          SCAN_BASE: ${{ (github.event.client_payload.event == 'pull_request' && github.event.client_payload.base_sha || '') || (github.event.client_payload.event == 'push' && github.event.client_payload.base_sha || '') }}
          SCAN_HEAD: ${{ (github.event.client_payload.event == 'pull_request' && github.event.client_payload.sha || '') || (github.event.client_payload.event == 'push' && github.event.client_payload.sha || '') || env.NIKATRU_SHA }}
          SCAN_KIND: ${{ (github.event.client_payload.event || github.event_name) == 'pull_request' && 'pr' || 'push' }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          if [ "${NIKATRU_EVENT_NAME}" = "workflow_dispatch" ]; then SCAN_BASE="$(git rev-parse --verify "${SCAN_HEAD}^1")"; fi
          node tooling/ci/scan-secrets.mjs . --gitleaks "${RUNNER_TEMP}/gitleaks" --range "${SCAN_BASE}..${SCAN_HEAD}" --range-kind "${SCAN_KIND}"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ci.security-scan.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Every .gitleaks.toml allowlist still exempts something a scan can read
        if: ${{ !cancelled() }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-gitleaks-allowlists.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ci.security-scan.7 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Install zizmor (version and digest from tooling/versions.json)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          node tooling/ci/install-pinned-tool.mjs zizmor --out "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/zizmor" --version
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ci.security-scan.8 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Workflow static analysis (self-tests, then scans)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/scan-workflows.mjs . --zizmor "${RUNNER_TEMP}/zizmor"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ci.security-scan.9 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Install OSV-Scanner (version and digest from tooling/versions.json)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          node tooling/ci/install-pinned-tool.mjs osv-scanner --out "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/osv-scanner" --version
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ci.security-scan.10 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Known-vulnerable dependencies, INCLUDING the Dart ones (canary, floor, then the tree)
        env:
          SCAN_BASE: ${{ (github.event.client_payload.event == 'pull_request' && github.event.client_payload.base_sha || '') }}
          SCAN_HEAD: ${{ (github.event.client_payload.event == 'pull_request' && github.event.client_payload.sha || '') }}
          SCAN_KIND: ${{ (github.event.client_payload.event || github.event_name) == 'pull_request' && 'pr' || 'push' }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          if [ "$SCAN_KIND" = pr ]; then
            node tooling/ci/scan-dependencies.mjs --osv "${RUNNER_TEMP}/osv-scanner" --pr-range "${SCAN_BASE}..${SCAN_HEAD}"
          else
            node tooling/ci/scan-dependencies.mjs --osv "${RUNNER_TEMP}/osv-scanner"
          fi
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ci.security-scan.11 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Install Trivy (version and digest from tooling/versions.json)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          node tooling/ci/install-pinned-tool.mjs trivy --out "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/trivy" --version
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ci.security-scan.12 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Vulnerabilities in the filesystem (a second opinion on production dependencies)
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          "${RUNNER_TEMP}/trivy" fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress .
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ci.security-scan.13 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: This pull request's changed lines carry none of the recurring CodeQL shapes (codeql-lite)
        if: ${{ !cancelled() }}
        env:
          CODEQL_LITE_BASE: ${{ github.event.client_payload.base_ref && format('origin/{0}', github.event.client_payload.base_ref) || '' }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-codeql-lite.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ci.security-scan.14 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: This pull request adds no CodeQL alert its own dispositions do not answer
        if: ${{ !cancelled() }}
        timeout-minutes: 22
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-codeql-pr-no-new-high.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ci.security-scan.15 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Hand this job's red detail to the report job, sealed (generated)
        id: nikatru-handoff
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_HANDOFF: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-ci.security-scan.${{ strategy.job-index }}
        run: |
          if [ -s "$RUNNER_TEMP/report-detail.md" ]; then
            py=python3; python3 -c '' >/dev/null 2>&1 || py=python
            "$py" -I "$GITHUB_WORKSPACE/tooling/ci/shell-report.py" handoff
          fi
      - name: Save the hand-off (generated)
        if: always() && steps.nikatru-handoff.outputs.has == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-detail
          key: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-ci.security-scan.${{ strategy.job-index }}
          enableCrossOsArchive: true

  site-tokens:
    name: Design tokens (build + drift, all three outputs)
    if: (github.event_name != 'repository_dispatch' || (github.event.client_payload.event == 'push' && github.event.client_payload.ref == 'refs/heads/main') || github.event.client_payload.event == 'pull_request') && (github.event.client_payload.draft != true)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/tokens
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node
      - run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          npm ci
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ci.site-tokens.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Delete all three artifacts so the build has to produce them
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          rm -f ../../sites/_shared/assets/tokens.css
          rm -f ../design_system/lib/src/tokens/brand_tokens.dart
          rm -f ../../extensions/core/tokens.json
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ci.site-tokens.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
