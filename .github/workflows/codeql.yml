            node tooling/ci/codeql-detect.mjs --not-a-pull-request
          fi
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name codeql.detect.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
