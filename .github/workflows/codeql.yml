      - uses: ./.github/actions/setup-node
      - name: List every changed file, and the count the PR reports
        if: (github.event.client_payload.event || github.event_name) == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pr }}
          PRIVATE_REPO: ${{ env.NIKATRU_PRIVATE_REPO }}
          BASE_SHA: ${{ (github.event.client_payload.event == 'pull_request' && github.event.client_payload.base_sha || '') }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          if [ -n "$PRIVATE_REPO" ]; then
            git diff --name-status -M "$BASE_SHA...HEAD" | awk -F'\t' '{ if ($1 ~ /^[RC]/) print $3 "\t" $2; else print $2 "\t" }' > "$RUNNER_TEMP/files.tsv"
