env:
  NIKATRU_PRIVATE_REPO: nikatru-com/Nikatru_Private

name: CodeQL

run-name: "CodeQL · ${{ github.event.client_payload.sha }}"

on:
  repository_dispatch:
    types: [ci, main]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ (github.event.client_payload.event || github.event_name) == 'pull_request' && (github.event.client_payload.pr || github.event.client_payload.ref || github.ref) || github.run_id }}
  cancel-in-progress: ${{ (github.event.client_payload.event || github.event_name) == 'pull_request' }}

jobs:
  detect:
    name: detect
    if: (github.event_name != 'repository_dispatch' || github.event.client_payload.event == 'pull_request' || (github.event.client_payload.event == 'push' && github.event.client_payload.ref == 'refs/heads/main')) && (github.event.client_payload.draft != true)
