        run: |
          set -uo pipefail
          npm ci --ignore-scripts --prefix tooling/wrangler || { echo "::error title=Pages project::the tooling/wrangler island did not install from its lockfile."; exit 1; }
          out="$(tooling/wrangler/node_modules/.bin/wrangler pages project create "$PROJECT" --production-branch=main 2>&1)" && code=0 || code=$?
          printf '%s\n' "$out"
          if [ "$code" -eq 0 ]; then echo "Created Direct Upload Pages project \"$PROJECT\"."; exit 0; fi
          if printf '%s' "$out" | grep -qiE 'already exists|\b8000002\b'; then echo "Pages project \"$PROJECT\" already exists — nothing to create."; exit 0; fi
          echo "::error title=Pages project::could not ensure the Direct Upload Pages project \"$PROJECT\" exists (wrangler exit ${code})."
          exit 1
      - name: Put the rate-limit salt on the project
        if: steps.plan.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUBSCRIBE_RATE_LIMIT_SALT: ${{ secrets.SUBSCRIBE_RATE_LIMIT_SALT }}
        run: |
          set -euo pipefail
          if [ -z "$SUBSCRIBE_RATE_LIMIT_SALT" ]; then echo "::error title=salt::the SUBSCRIBE_RATE_LIMIT_SALT secret reached this job empty."; exit 1; fi
          printf '%s' "$SUBSCRIBE_RATE_LIMIT_SALT" | tooling/wrangler/node_modules/.bin/wrangler pages secret put SUBSCRIBE_RATE_LIMIT_SALT --project-name nikatru-apex
      - name: Put the launch-list mail key on the project
        if: steps.plan.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LAUNCH_MAIL_RESEND_KEY: ${{ secrets.LAUNCH_MAIL_RESEND_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$LAUNCH_MAIL_RESEND_KEY" ]; then echo "::error title=launch mail::the LAUNCH_MAIL_RESEND_KEY secret reached this job empty."; exit 1; fi
          printf '%s' "$LAUNCH_MAIL_RESEND_KEY" | tooling/wrangler/node_modules/.bin/wrangler pages secret put LAUNCH_MAIL_RESEND_KEY --project-name nikatru-apex
      - name: Put the feedback forward key on the project
        if: steps.plan.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FEEDBACK_FORWARD_KEY: ${{ secrets.FEEDBACK_FORWARD_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$FEEDBACK_FORWARD_KEY" ]; then echo "::error title=feedback forward key::the FEEDBACK_FORWARD_KEY secret reached this job empty."; exit 1; fi
          printf '%s' "$FEEDBACK_FORWARD_KEY" | tooling/wrangler/node_modules/.bin/wrangler pages secret put FEEDBACK_FORWARD_KEY --project-name nikatru-apex
      - name: Deploy the apex site to nikatru-apex
        if: steps.plan.outputs.deploy == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.147.0'
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: build/nikatru-apex
          command: pages deploy . --project-name=nikatru-apex --branch=main
      - name: Smoke — nikatru.com serves THIS commit, and its Function answers
        if: steps.plan.outputs.deploy == 'true'
        run: node tooling/sites/smoke-site-deploy.mjs --origin https://nikatru.com --expect-sha ${{ env.NIKATRU_SHA }}
      - name: Record the deployed SHA
        if: always() && steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_DEPLOYMENT_ID: ${{ steps.deploy.outputs.pages-deployment-id }}
        run: node tooling/ci/record-deployment.mjs nikatru-site https://nikatru.com --pages-deployment-id "$PAGES_DEPLOYMENT_ID"

  personal-site:
    name: Deploy the personal site to Cloudflare Pages (unit rajasekarselvam-site)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: deploy-web-rajasekarselvam-site
      cancel-in-progress: ${{ (github.event.client_payload.pr || github.event.client_payload.ref || 'refs/heads/main') != 'refs/heads/main' }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          fetch-depth: 0
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Refuse any ref but main
        run: node tooling/ci/assert-deploy-ref.mjs --allow main
      - name: Plan from the Deployment ledger
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/ci/plan-deploy.mjs rajasekarselvam-site
      - uses: ./.github/actions/setup-node
        if: steps.plan.outputs.deploy == 'true'
      - name: Read this unit's project, source and public origin from the register
        if: steps.plan.outputs.deploy == 'true'
        id: site
        run: node tooling/ci/site-target.mjs --emit rajasekarselvam-site >> "$GITHUB_OUTPUT"
      - name: Stage the site and stamp version.json with this commit
        if: steps.plan.outputs.deploy == 'true'
        env:
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE: ${{ steps.site.outputs.source }}
        run: |
          set -euo pipefail
          rm -rf build/personal-site
          mkdir -p build/personal-site
          cp -R "$SOURCE"/. build/personal-site/
          printf '{"sha":"%s","build_number":%s}\n' "$NIKATRU_SHA" "$RUN_NUMBER" > build/personal-site/version.json
          cat build/personal-site/version.json
      - name: Ensure the Pages project exists (Direct Upload, idempotent)
        if: steps.plan.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.site.outputs.project }}
        run: |
          set -uo pipefail
          npm ci --ignore-scripts --prefix tooling/wrangler || { echo "::error title=Pages project::the tooling/wrangler island did not install from its lockfile."; exit 1; }
          out="$(tooling/wrangler/node_modules/.bin/wrangler pages project create "$PROJECT" --production-branch=main 2>&1)" && code=0 || code=$?
          printf '%s\n' "$out"
          if [ "$code" -eq 0 ]; then echo "Created Direct Upload Pages project \"$PROJECT\"."; exit 0; fi
          if printf '%s' "$out" | grep -qiE 'already exists|\b8000002\b'; then echo "Pages project \"$PROJECT\" already exists — nothing to create."; exit 0; fi
          echo "::error title=Pages project::could not ensure the Direct Upload Pages project \"$PROJECT\" exists (wrangler exit ${code})."
          exit 1
      - name: Read the project's issued origin, and whether the public host is on it yet
        if: steps.plan.outputs.deploy == 'true'
        id: live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/ci/site-target.mjs --live rajasekarselvam-site >> "$GITHUB_OUTPUT"
      - name: Deploy the personal site
        if: steps.plan.outputs.deploy == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.147.0'
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: build/personal-site
          command: pages deploy . --project-name=${{ steps.site.outputs.project }} --branch=main
      - name: Smoke — the site serves THIS commit, and it is this site
        if: steps.plan.outputs.deploy == 'true'
        env:
          SMOKE_ORIGIN: ${{ steps.live.outputs.smoke_origin }}
          CANONICAL: ${{ steps.site.outputs.canonical }}
        run: node tooling/sites/smoke-site-deploy.mjs --origin "$SMOKE_ORIGIN" --expect-sha "$NIKATRU_SHA" --canonical "$CANONICAL"
      - name: Record the deployed SHA
        if: always() && steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_ORIGIN: ${{ steps.live.outputs.smoke_origin }}
          PAGES_DEPLOYMENT_ID: ${{ steps.deploy.outputs.pages-deployment-id }}
        run: node tooling/ci/record-deployment.mjs rajasekarselvam-site "$SMOKE_ORIGIN" --pages-deployment-id "$PAGES_DEPLOYMENT_ID"

  status-site:
    name: Deploy the status page to Cloudflare Pages (nikatru-status)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: deploy-web-status-site
      cancel-in-progress: ${{ (github.event.client_payload.pr || github.event.client_payload.ref || 'refs/heads/main') != 'refs/heads/main' }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          fetch-depth: 0
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Refuse any ref but main
        run: node tooling/ci/assert-deploy-ref.mjs --allow main
      - name: Plan from the Deployment ledger
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/ci/plan-deploy.mjs status-site
      - name: Is the status page live yet?
        id: live
        env:
          STATUS_PAGE_LIVE: ${{ vars.STATUS_PAGE_LIVE }}
        run: |
          if [ "$STATUS_PAGE_LIVE" = "true" ] && [ "${{ steps.plan.outputs.deploy }}" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=status-site::not deployed — STATUS_PAGE_LIVE is '${STATUS_PAGE_LIVE}' (the lead sets it after creating nikatru-status and its DNS record), plan deploy=${{ steps.plan.outputs.deploy }}"
          fi
      - uses: ./.github/actions/setup-node
        if: steps.live.outputs.go == 'true'
      - name: Grade the committed status site
        if: steps.live.outputs.go == 'true'
        run: |
          node tooling/ci/check-site-integrity.mjs . sites/status
          node tooling/status/build-status.mjs --check
      - name: Read the surfaces and the live document, and build the site
        if: steps.live.outputs.go == 'true'
        run: |
          set -uo pipefail
          node tooling/ops/status.mjs --json "$RUNNER_TEMP/readings.json" > "$RUNNER_TEMP/status.log" 2>&1
          code=$?
          echo "status.mjs exit: $code"
          curl -fsS --max-time 15 https://status.nikatru.com/status.json -o "$RUNNER_TEMP/prev.json" || rm -f "$RUNNER_TEMP/prev.json"
          rm -rf build/status
          mkdir -p build/status
          cp -R sites/status/. build/status/
          node tooling/status/build-status.mjs --out build/status --readings "$RUNNER_TEMP/readings.json" --prev "$RUNNER_TEMP/prev.json"
      - name: Deploy the status page to nikatru-status
        if: steps.live.outputs.go == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.147.0'
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: build/status
          command: pages deploy . --project-name=nikatru-status --branch=main
      - name: Smoke — status.nikatru.com serves THIS build
        if: steps.live.outputs.go == 'true'
        run: node tooling/status/build-status.mjs --smoke https://status.nikatru.com --built build/status/status.json
      - name: Record the deployed SHA
        if: always() && steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_DEPLOYMENT_ID: ${{ steps.deploy.outputs.pages-deployment-id }}
        run: node tooling/ci/record-deployment.mjs status-site https://status.nikatru.com --pages-deployment-id "$PAGES_DEPLOYMENT_ID"
