  app-worker:
    name: Deploy ${{ matrix.worker.worker }}
    needs: workers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      deployments: write
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.workers.outputs.workers) }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
