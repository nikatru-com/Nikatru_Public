        required: true
      SUPABASE_ANON_KEY:
        required: true
      PRIVATE_DEPLOY_KEY:
        required: true
      NIKATRU_DETAIL_KEY:
        required: true

concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  workers:
    name: The app Worker set comes from the register
    runs-on: ubuntu-24.04
    timeout-minutes: 5
