          SUPABASE_URL: ${{ ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_URL || ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'production' && secrets.SUPABASE_URL || '' }}
          SUPABASE_ANON_KEY: ${{ ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_ANON_KEY || ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'production' && secrets.SUPABASE_ANON_KEY || '' }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/captcha_posture.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name e2e.e2e.16 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Stage the fallback fonts the bootstrap points at
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/store/capture-fallback-fonts.mjs --stage apps/${{ matrix.app }}
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name e2e.e2e.17 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The app's API base, from the composer's rule
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/flutter-release-build.mjs --emit-env API_BASE_URL ${{ matrix.app }} >> "$GITHUB_ENV"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name e2e.e2e.18 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Run integration tests (headless Chrome)
        id: drive
        working-directory: apps/${{ matrix.app }}
        env:
          SUPABASE_URL: ${{ ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_URL || ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'production' && secrets.SUPABASE_URL || '' }}
          SUPABASE_ANON_KEY: ${{ ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_ANON_KEY || ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'production' && secrets.SUPABASE_ANON_KEY || '' }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          E2E_EMAIL: ${{ steps.user.outputs.email }}
          E2E_PASSWORD: ${{ steps.user.outputs.password }}
          E2E_DELETE_EMAIL: ${{ steps.delete_user.outputs.email }}
          E2E_DELETE_PASSWORD: ${{ steps.delete_user.outputs.password }}
          E2E_TOKEN_HASH: ${{ steps.user.outputs.token_hash }}
          E2E_DELETE_TOKEN_HASH: ${{ steps.delete_user.outputs.token_hash }}
          E2E_APP_ID: ${{ matrix.app }}
          E2E_PENDING_FLOWS: ${{ inputs.pending_flows || 'skip' }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          export CHROME_EXECUTABLE="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser)"
          echo "Chrome: $CHROME_EXECUTABLE"
          chromedriver --port=4444 &
          CHROMEDRIVER_PID=$!
          sleep 3
          # why: EN-08 — how the full walk signs in, decided (never defaulted):
          # the form on a stack whose Turnstile key is an always-pass TEST key
          # or that has no gate, the harness token otherwise. Graded below.
          # The step runs in apps/<app> (working-directory), so the root script is named from the workspace.
          sign_in="$(node "$GITHUB_WORKSPACE/tooling/e2e/sign_in_via.mjs" --derive)"
          export "$sign_in"
          echo "$sign_in" >> "$GITHUB_ENV"
          # tee'd, not just printed: the step below turns the assertion into a
          # GitHub annotation, and `pipefail` (set above) keeps flutter's exit
          # code as the pipeline's, so teeing cannot mask a failure.
          # 🔴 `--web-port=3000` IS LOAD-BEARING, NOT TIDINESS. [pipeline N-6 leg 6]
          #
          # `flutter drive -d web-server` otherwise serves the app on
          # http://localhost:<RANDOM port>, and every Worker call the suite makes
          # is therefore cross-origin. subscriptiontracker-api.nikatru.com tolerates that: its CORS
          # binding is scope `own-app`, which carries an explicit localhost-any-port
          # exception (services/_shared/src/cors.ts:102) added as the INC13 fix,
          # which is why legs 1-2 have always passed.
          #
          # The SHARED platform Worker (scope `every-app`) deliberately does NOT carry
          # that exception — the shared module says so in as many words: "It is a PER-APP trade: the
          # shared platform Worker deliberately does not carry it." Its allowlist
          # is exact origins only (services/platform/wrangler.jsonc:48), and the
          # one localhost entry there is the FIXED port 3000.
          #
          # Leg 6 is the first golden-path leg that calls the platform Worker
          # from the browser (`DELETE /v1/account` — the erasure entry point), so
          # it is the first thing a random port breaks. Measured 2026-08-09
          # against the deployed Worker:
          #   Origin: http://localhost:42389 -> preflight 204, NO allow-origin
          #   Origin: http://localhost:3000  -> preflight 204, allow-origin echoed,
          #                                     allow-methods GET, POST, DELETE, OPTIONS
          # The browser blocked the real request, the app never saw a status, and
          # the outcome resolved to `unknown` — "we cannot tell how much of it was
          # removed" — which is exactly what run 31290922922 printed on screen.
          #
          # Pinning the port makes the suite serve from an origin production
          # ALREADY allows, so nothing about the platform Worker's posture
          # changes. `localhost` and not `127.0.0.1`: only the former is on the
          # list (measured — 127.0.0.1:3000 gets no allow-origin), and
          # `--web-hostname` already defaults to localhost.
          #
          # 🔴 `--browser-dimension` IS THE SIZE LEVER; `--window-size` NEVER WAS.
          # From this suite's first commit (c478ef35, 2026-07-18) until
          # 2026-09-23 the drive passed `--web-browser-flag=--window-size=430,932`,
          # and flutter drive then resized the window to its own
          # `--browser-dimension` default, 1600x1024, over it. Every frame was
          # 1600x881, the desktop layout; E2E live run 35824787614 read that off
          # screenshots/00-consent.png. `WxH@dpr` is the form the store capture
          # already uses (tooling/store/capture-play-screenshots.mjs). It sets
          # the viewport exactly, 430x932 at DPR 1, which is a phone layout and
          # the size tooling/e2e-leg-register.json framesCarryText was measured at.
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_test.dart \
            -d web-server --web-port=3000 --browser-name=chrome \
            --web-browser-flag=--headless=new \
            --web-browser-flag=--disable-gpu \
            --web-browser-flag=--no-sandbox \
            --web-browser-flag=--disable-dev-shm-usage \
            --browser-dimension=430x932@1 \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_VERSION="$E2E_APP_VERSION" \
            --dart-define=E2E_EMAIL="$E2E_EMAIL" \
            --dart-define=E2E_PASSWORD="$E2E_PASSWORD" \
            --dart-define=E2E_DELETE_EMAIL="$E2E_DELETE_EMAIL" \
            --dart-define=E2E_TOKEN_HASH="$E2E_TOKEN_HASH" \
            --dart-define=E2E_DELETE_TOKEN_HASH="$E2E_DELETE_TOKEN_HASH" \
            --dart-define=TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY" \
            --dart-define=E2E_EXPECT_CAPTCHA_GATE="$E2E_EXPECT_CAPTCHA_GATE" \
            --dart-define=E2E_EXPECT_WORKERS_TRUST="$E2E_WORKERS_TRUST" \
            --dart-define=E2E_DELETE_PASSWORD="$E2E_DELETE_PASSWORD" \
            --dart-define=E2E_SIGN_IN="$E2E_SIGN_IN" \
            --dart-define=E2E_PENDING_FLOWS="$E2E_PENDING_FLOWS" \
            --dart-define=E2E_APP_ID="$E2E_APP_ID" 2>&1 | tee "${RUNNER_TEMP}/drive.log"
          kill "$CHROMEDRIVER_PID" || true
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name e2e.e2e.19 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Surface the failing assertion
        if: failure() && steps.drive.outcome == 'failure'
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -uo pipefail
          log="${RUNNER_TEMP}/drive.log"
          if [ ! -s "$log" ]; then
            echo "::error title=E2E failed before the suite ran::flutter drive produced no output — the failure is above this step (build, chromedriver or dart-define)."
            exit 0
          fi
          # One line per failing test, plus the first assertion line under it.
          # `Failure in method:` is flutter_driver's own heading for the decoded
          # blob, so this reads the human-readable half, not the JSON.
          grep -E '^(Failure in method:|Expected:|  Actual:|   Which:)' "$log" \
            | head -40 > "${RUNNER_TEMP}/why.txt" || true
          if [ ! -s "${RUNNER_TEMP}/why.txt" ]; then
            echo "::error title=E2E failed::The suite failed but no assertion heading was found in the driver output — open the 'Run integration tests' log and the e2e-screenshots artifact."
            exit 0
          fi
          while IFS= read -r line; do
            case "$line" in
              'Failure in method:'*) echo "::error title=E2E test failed::${line}" ;;
              *) echo "::error::${line}" ;;
            esac
          done < "${RUNNER_TEMP}/why.txt"
          {
            echo '### Nightly E2E — failing assertions'
            echo ''
            echo '```'
            cat "${RUNNER_TEMP}/why.txt"
            echo '```'
            echo ''
            echo 'Screenshots up to the failure are in the `e2e-screenshots` artifact on this run.'
          } >> "$GITHUB_STEP_SUMMARY"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name e2e.e2e.20 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The full walk signed in the way this run expected
        if: steps.drive.outcome == 'success'
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/sign_in_via.mjs --grade "${RUNNER_TEMP}/drive.log"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name e2e.e2e.21 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The exported CSV holds the rows the server held
        if: steps.drive.outcome == 'success' && (inputs.pending_flows || 'skip') == 'run'
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/verify_export_csv.mjs "${RUNNER_TEMP}/drive.log" "$HOME/Downloads"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name e2e.e2e.22 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Verify the row landed in live D1
        env:
          E2E_USER_ID: ${{ steps.user.outputs.user_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          E2E_APP_ID: ${{ matrix.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/verify_row.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name e2e.e2e.23 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The Workers trust exactly one issuer (positive, both targets)
        env:
          SUPABASE_URL: ${{ ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_URL || ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'production' && secrets.SUPABASE_URL || '' }}
          SUPABASE_ANON_KEY: ${{ ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_ANON_KEY || ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'production' && secrets.SUPABASE_ANON_KEY || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_SERVICE_ROLE_KEY || ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'production' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          E2E_EMAIL: ${{ steps.user.outputs.email }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/assert_one_issuer.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name e2e.e2e.24 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Erase the delete-leg account headlessly (captcha-gated stack)
        if: env.E2E_EXPECT_CAPTCHA_GATE == 'yes'
        env:
          SUPABASE_URL: ${{ ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_URL || ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'production' && secrets.SUPABASE_URL || '' }}
          SUPABASE_ANON_KEY: ${{ ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_ANON_KEY || ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'production' && secrets.SUPABASE_ANON_KEY || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_SERVICE_ROLE_KEY || ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'production' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          E2E_DELETE_EMAIL: ${{ steps.delete_user.outputs.email }}
          E2E_DELETE_USER_ID: ${{ steps.delete_user.outputs.user_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          E2E_APP_ID: ${{ matrix.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/delete_headless.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name e2e.e2e.25 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Verify the in-app deletion really purged (leg 6)
        env:
          SUPABASE_URL: ${{ ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_URL || ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'production' && secrets.SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_SERVICE_ROLE_KEY || ((github.event.client_payload.inputs.auth_target || inputs.auth_target) || 'production') == 'production' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          E2E_DELETE_USER_ID: ${{ steps.delete_user.outputs.user_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          E2E_APP_ID: ${{ matrix.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/verify_purged.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name e2e.e2e.26 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Verify the consent artifact landed in platform_db
        env:
          E2E_APP_ID: ${{ matrix.app }}
          E2E_RESPONSE_DATA: apps/${{ matrix.app }}/build/integration_response_data.json
          E2E_DRIVE_LOG: ${{ runner.temp }}/drive.log
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          PLATFORM_D1_DATABASE_ID: ${{ steps.backend.outputs.platform_db }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/verify_consent.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name e2e.e2e.27 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The captured frames carry drawn text
        if: steps.drive.outcome == 'success'
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node --single-threaded tooling/e2e/assert-frames-carry-text.mjs apps/${{ matrix.app }}/screenshots
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name e2e.e2e.28 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store e2e-screenshots-${{ matrix.app }} in the bridge's private home (generated)
        if: always() && steps.user.outcome != 'skipped'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: apps/${{ matrix.app }}/screenshots/
          NIKATRU_ARTIFACT_NAME: e2e-screenshots-${{ matrix.app }}
          NIKATRU_IF_NO_FILES: warn
