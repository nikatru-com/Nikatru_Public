  NIKATRU_GRADES_SERVED_UNITS: deploy-web deploy-workers

name: E2E live

run-name: "E2E live · ${{ github.event.client_payload.sha }}"

on:
  repository_dispatch:
    types: [e2e]
  workflow_dispatch:
    inputs:
      auth_target:
        description: 'Which secret set to run against: production (SUPABASE_*) or selfhosted (SELFHOSTED_SUPABASE_*, Box C).'
        type: choice
        required: false
        default: production
        options:
          - production
          - selfhosted
      pending_flows:
        description: 'skip (default): the parked flows are skipped and said. run: walk them (dispatch on a branch).'
        type: choice
        required: false
        default: skip
        options:
          - skip
          - run
  schedule:
    - cron: '17 3 * * *'
    - cron: '43 4 * * 0'

permissions:
  contents: read

jobs:
  prepare:
    name: Derive the app set from the pub workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.workspace.outputs.apps }}
      refusal_anchor: ${{ steps.workspace.outputs.refusal_anchor }}
