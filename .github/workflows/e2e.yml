          if [ "$TARGET" != 'production' ] && [ "$TARGET" != 'selfhosted' ]; then
            echo "::error title=E2E cannot run::auth_target \"$TARGET\" is not one of production, selfhosted."
            exit 1
          fi
          echo "auth_target=${TARGET} is one of the two declared options."
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
