            if [ -z "$HOSTED_URL" ];  then missing="${missing} SUPABASE_URL"; fi
            if [ -z "$HOSTED_ANON" ]; then missing="${missing} SUPABASE_ANON_KEY"; fi
            if [ -z "$HOSTED_KEY" ];  then missing="${missing} SUPABASE_SERVICE_ROLE_KEY"; fi
          fi
          if [ -n "$missing" ]; then
