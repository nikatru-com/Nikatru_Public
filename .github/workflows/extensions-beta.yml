          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name extensions-beta.beta.4 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: Run every suite that opts into the branded leg, on chrome-beta
        env:
          DIRS: ${{ steps.find.outputs.dirs }}
          FS_E2E_CHANNEL: chrome-beta
          HEADFUL: '1'
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node -e '
            const fs = require("fs"), path = require("path"), cp = require("child_process");
            const MARK = /\be2e-branded:([^\n]*)/;
            const SETTING = /^FS_E2E_[A-Z_]+=[A-Za-z0-9,._-]+$/;
            const dirs = process.env.DIRS.split("\n").map(s => s.trim()).filter(Boolean);
            const picked = [];
            for (const dir of dirs) {
              const files = fs.readdirSync(dir).filter(f => f.endsWith(".mjs")).sort();
              const src = new Map(files.map(f => [f, fs.readFileSync(path.join(dir, f), "utf8")]));
              /* The library rule of the e2e-suite step: a file another file imports is not a suite. */
              const suites = files.filter(g => !files.some(f => f !== g && src.get(f).includes("./" + g)));
              for (const f of suites) {
                const m = MARK.exec(src.get(f));
                if (!m) continue;
                const words = m[1].trim().split(/\s+/).filter(Boolean);
                const bad = words.filter(w => !SETTING.test(w));
                if (bad.length) {
                  console.log(`::error::${dir}/${f} carries e2e-branded: with ${bad.join(" ")}, which is not an FS_E2E_NAME=value setting.`);
                  process.exit(1);
                }
                picked.push({ dir, f, env: Object.fromEntries(words.map(w => [w.slice(0, w.indexOf("=")), w.slice(w.indexOf("=") + 1)])) });
              }
            }
            /* Zero is not a pass: a leg that ran nothing on Chrome Beta would read as Chrome Beta being fine. */
            if (!picked.length) {
              console.log(`::error::no .mjs in ${dirs.join(", ")} carries an e2e-branded: line, so this leg would run nothing on Chrome Beta and report success.`);
              process.exit(1);
            }
            const failed = [];
            for (const p of picked) {
              const t = Date.now();
              console.log(`::group::node ${p.dir}/${p.f} on chrome-beta ${JSON.stringify(p.env)}`);
              const r = cp.spawnSync(process.execPath, [p.f], { cwd: p.dir, stdio: "inherit", timeout: 15 * 60 * 1000, env: { ...process.env, ...p.env } });
              console.log("::endgroup::");
              const code = r.error ? 1 : (r.status === null ? 1 : r.status);
              console.log(`chrome-beta ${code === 0 ? "PASS" : "FAIL"}  ${p.dir}/${p.f}  exit=${code}  ${Math.round((Date.now() - t) / 1000)}s`);
              if (code !== 0) failed.push(`${p.dir}/${p.f} exit ${code}`);
            }
            if (failed.length) {
              console.log(`::error title=An extension fails on Chrome Beta::${failed.length} of ${picked.length} suite(s) failed on chrome-beta: ${failed.join("; ")}. Chrome Beta reaches stable in about four weeks; the BROWSER line in the log names the build.`);
              process.exit(1);
            }
            console.log(`${picked.length} suite(s) passed on chrome-beta.`);
          '
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name extensions-beta.beta.5 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
