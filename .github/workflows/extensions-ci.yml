  discover:
    name: Discover affected tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tools: ${{ steps.set.outputs.tools }}
      count: ${{ steps.set.outputs.count }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          fetch-depth: 0
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/heads/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node
      - name: Cross-check discovery against the filesystem
        shell: bash
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail  # 🔴 FIXED 2026-08-22, same pre-existing hole as the gate-inventory job's `set` line above and the same fix. GitHub runs an explicit `shell: bash` as `bash --noprofile --norc -eo pipefail {0}`, so `-e` IS ALREADY ON when this body starts. This line used to read `set -uo pipefail`, which added `-u` and removed nothing — and under `-e` a command whose failure this step means to REPORT kills the shell first, so the report is dead code on the runner. `-e` is spelled out here so the flag a reader sees is the flag that is running, and every reported command below carries its own `||`. Here the reported command is `discover.mjs --all`: a bare `code=$?` after it was unreachable as anything but 0, so `::error::discover.mjs exited N` never printed. MEASURED 2026-08-22 on this exact body with discover.mjs stubbed to `process.exit(3)`: runner flags EXIT 3, 20 bytes, no `::error::`; bare `bash` EXIT 1, 120 bytes, the diagnosis present.
          # templates/ carries a tool.json too — it is the thing a tool is stamped
          # FROM, not a tool: it does not ship, and it has no id a reporter could
          # name. (_skeleton/ was its location before the move recorded in
          # ref/pre-prune-2026-09-08:extensions/MIGRATION.md; the exclusion is kept because new-tool.mjs deliberately
          # keeps that path as a fallback.) private/ is gitignored and absent on a runner;
          # it is excluded anyway so this reads the same on the owner's machine.
          # toolinfo.mjs excludes the same directories, which is what makes the
          # two counts comparable at all.
          found=$(find . -mindepth 3 -maxdepth 3 -name tool.json \
                    -not -path './.git/*' -not -path './templates/*' \
                    -not -path './_skeleton/*' -not -path './private/*' \
                    -not -path './node_modules/*')
          n_find=$(printf '%s' "$found" | grep -c . || true)
          echo "tool.json on disk: $n_find"
          [ -n "$found" ] && printf '%s\n' "$found" | sed 's|^\./||'

          out="$RUNNER_TEMP/discover-all.txt"
          : > "$out"
          code=0  # ← initialised, and `|| code=$?` below rather than a bare `code=$?`; see this body's `set -euo` line.
          node scripts/discover.mjs --all --out "$out" || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::discover.mjs exited $code — the matrix cannot be trusted, so nothing below it can be either."
            exit 1
          fi
          ids=$(sed -n 's/^tools=//p' "$out" | tail -1)
          if [ -z "$ids" ]; then
            echo "::error::discover.mjs exited 0 but wrote no tools= line to --out. Its output contract changed, and every count derived from it below would be a guess."
            exit 1
          fi
          n_disc=$(node -p 'JSON.parse(process.argv[1]).length' "$ids")
          echo "discover.mjs --all sees: $n_disc  $ids"

          if [ "$n_find" -ne "$n_disc" ]; then
            echo "::error::discovery disagrees with the filesystem — $n_find tool.json file(s) on disk, $n_disc tool(s) seen by discover.mjs. One of the two is wrong, and the expensive version of being wrong is the low one: a tool that gets no CI looks exactly like a tool that passed."
            exit 1
          fi
          if [ "$n_find" -eq 0 ]; then
            echo "::notice::no tool has been onboarded to tool.json yet. That is a real state, not a search failure — the per-tool jobs below have nothing to grade, and say so rather than reporting a green run over an empty set."
          fi
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name extensions-ci.discover.3 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: Issue templates list every tool id
        working-directory: .
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/gen-issue-forms.mjs --check
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name extensions-ci.discover.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - id: set
        name: Build the matrix
        env:
          BASE_SHA: ${{ (github.event.client_payload.event == 'pull_request' && github.event.client_payload.base_sha || '') || (github.event.client_payload.event == 'push' && github.event.client_payload.base_sha || '') }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          case "${NIKATRU_EVENT_NAME} ${GITHUB_WORKFLOW_REF}" in
            "workflow_dispatch "*/.github/workflows/ci.yml@refs/heads/main) BASE_SHA="$(git rev-parse --verify HEAD^1)" ;;
          esac
          node scripts/discover.mjs --base "$BASE_SHA" --out "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name extensions-ci.discover.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Show the matrix
        env:
          TOOLS: ${{ steps.set.outputs.tools }}
          COUNT: ${{ steps.set.outputs.count }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          echo "affected tools ($COUNT): $TOOLS"
          if [ "$COUNT" = "0" ]; then
            echo "::notice::no tool was affected by this change — the per-tool jobs below are skipped on purpose, not by accident."
          fi
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name extensions-ci.discover.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Hand this job's red detail to the report job, sealed (generated)
        id: nikatru-handoff
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_HANDOFF: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-extensions-ci.discover.${{ strategy.job-index }}
        run: |
          if [ -s "$RUNNER_TEMP/report-detail.md" ]; then
            py=python3; python3 -c '' >/dev/null 2>&1 || py=python
            "$py" -I "$GITHUB_WORKSPACE/tooling/ci/shell-report.py" handoff
          fi
      - name: Save the hand-off (generated)
        if: always() && steps.nikatru-handoff.outputs.has == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-detail
          key: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-extensions-ci.discover.${{ strategy.job-index }}
          enableCrossOsArchive: true

