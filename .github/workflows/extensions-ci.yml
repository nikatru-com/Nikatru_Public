          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/heads/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node
      - name: Build package
        timeout-minutes: 2
        shell: node ../tooling/ci/quiet-step.mjs --name extensions-ci.package.3 --default-shell {0}
        run: node --single-threaded scripts/pack.mjs ${{ matrix.tool }} --target ${{ matrix.target }} --out dist
      - name: Reference integrity (inside the zip)
        timeout-minutes: 2
        shell: node ../tooling/ci/quiet-step.mjs --name extensions-ci.package.4 --default-shell {0}
        run: node --single-threaded scripts/verify-refs.mjs --zip dist/${{ matrix.tool }}-${{ matrix.target }}.zip --strict
      - name: Leak check (no test/, docs, node_modules, zips, secrets)
        timeout-minutes: 2
        shell: node ../tooling/ci/quiet-step.mjs --name extensions-ci.package.5 --default-shell {0}
        run: node --single-threaded scripts/verify-refs.mjs --zip dist/${{ matrix.tool }}-${{ matrix.target }}.zip --leaks
      - name: Determinism check (zip is byte-reproducible)
        timeout-minutes: 2
        shell: bash
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          node --single-threaded scripts/pack.mjs ${{ matrix.tool }} --target ${{ matrix.target }} --out dist2
          a=$(node scripts/sha256.mjs dist/${{ matrix.tool }}-${{ matrix.target }}.zip)
          b=$(node scripts/sha256.mjs dist2/${{ matrix.tool }}-${{ matrix.target }}.zip)
          echo "$a"; echo "$b"
          [ "$a" = "$b" ] || { echo "::error::zip is not reproducible"; exit 1; }
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name extensions-ci.package.6 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: The built package carries the right store identity
        timeout-minutes: 8
        shell: node ../tooling/ci/quiet-step.mjs --name extensions-ci.package.7 --default-shell {0}
        run: >-
          node scripts/lib/hang-guard.mjs --seconds 180 --retries 1 --report-dir diag
          -- node --single-threaded scripts/check-store-packages.mjs ${{ matrix.tool }} --dir dist
      - name: The tool's own declared store gates, on the built zip (tool.json gates, stage package)
        shell: node ../tooling/ci/quiet-step.mjs --name extensions-ci.package.9 --default-shell {0}
        run: >-
          node scripts/discover.mjs --run-gates --tool ${{ matrix.tool }} --stage package
          --target ${{ matrix.target }} --os ${{ matrix.os }}
          --zip "dist/${{ matrix.tool }}-${{ matrix.target }}.zip"
      - name: web-ext lint (Firefox only)
        if: matrix.target == 'firefox' && matrix.os == 'ubuntu-24.04'
        shell: node ../tooling/ci/quiet-step.mjs --name extensions-ci.package.10 --default-shell {0}
        run: |
          npm ci --ignore-scripts --prefix ../tooling/web-ext
          ../tooling/web-ext/node_modules/.bin/web-ext lint --source-dir dist/unpacked-firefox --warnings-as-errors
      - name: Hand this job's red detail to the report job, sealed (generated)
        id: nikatru-handoff
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_HANDOFF: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-extensions-ci.package.${{ strategy.job-index }}
        run: |
          if [ -s "$RUNNER_TEMP/report-detail.md" ]; then
            py=python3; python3 -c '' >/dev/null 2>&1 || py=python
            "$py" -I "$GITHUB_WORKSPACE/tooling/ci/shell-report.py" handoff
          fi
      - name: Save the hand-off (generated)
        if: always() && steps.nikatru-handoff.outputs.has == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-detail
          key: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-extensions-ci.package.${{ strategy.job-index }}
          enableCrossOsArchive: true

