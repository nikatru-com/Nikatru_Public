# GENERATED by tooling/ci/gen-public-shell.mjs from .github/workflows/extensions.yml of nikatru-com/Nikatru_Private.
# Do not edit: `node tooling/ci/gen-public-shell.mjs --check` re-generates it and fails on any difference.
env:
  NIKATRU_PRIVATE_REPO: nikatru-com/Nikatru_Private

name: Extensions

run-name: "Extensions · ${{ github.event.client_payload.sha }}"

on:
  repository_dispatch:
    types: [tag]
  schedule: [{ cron: '53 20 * * *' }]
  workflow_dispatch:
    inputs:
      lane:
        description: >-
          Which lane to run. `release` is a REHEARSAL unless dry_run is
          unchecked AND confirm names one store AND the dispatch runs on the
          release tag.
        type: choice
        options: [ci, e2e, release]
        default: ci
        required: true
      dry_run:
        description: >-
          Run every gate on a real build and stop before publishing. Leave it
          checked to rehearse. Unchecking it publishes ONLY with confirm typed
          and the dispatch run on the release tag; otherwise the run refuses.
        type: boolean
        required: true
        default: true
      confirm:
        description: >-
          Type SUBMIT-TO-FIREFOX-AMO, SUBMIT-TO-CHROME-WEB-STORE or
          SUBMIT-TO-EDGE-ADDONS to publish this tag to that ONE store (dry_run
          unchecked, dispatched on the tag). Anything else publishes nothing.
        type: string
        required: false
        default: ''
      tag:
        description: >-
          The tag a release rehearsal stands in for, e.g. fullshot-v1.10.1. A
          dispatch from a branch has no tag in GITHUB_REF_NAME, so the tool id and
          version are read from here. Deliberately not defaulted: a stale default
          would rehearse a version the CHANGELOG has moved past and fail in
          check-version, which reads like a defect in the tool rather than a typo
          in the dispatch. A dispatch ON a tag may leave it empty. Ignored by the
          ci and e2e lanes.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: extensions-${{ (github.event.client_payload.pr || github.event.client_payload.ref || 'refs/heads/main') }}
  cancel-in-progress: ${{ (github.event.client_payload.pr || github.event.client_payload.ref || 'refs/heads/main') != 'refs/heads/main' && !startsWith((github.event.client_payload.pr || github.event.client_payload.ref || 'refs/heads/main'), 'refs/tags/') }}

defaults:
  run:
    working-directory: extensions

jobs:
  ci:
    if: (github.event_name != 'repository_dispatch' || (github.event.client_payload.event == 'push' && startsWith(github.event.client_payload.ref, 'refs/tags/fullshot-v'))) && ((github.event.client_payload.event || github.event_name) == 'workflow_dispatch' && inputs.lane == 'ci' && !startsWith((github.event.client_payload.ref || 'refs/heads/main'), 'refs/tags/'))
    uses: ./.github/workflows/extensions-ci.yml
    permissions:
      contents: read
    secrets:
      PRIVATE_DEPLOY_KEY: ${{ secrets.PRIVATE_DEPLOY_KEY }}
      NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}

  e2e-discover:
    name: Discover e2e suites
    if: (github.event_name != 'repository_dispatch' || (github.event.client_payload.event == 'push' && startsWith(github.event.client_payload.ref, 'refs/tags/fullshot-v'))) && ((!startsWith((github.event.client_payload.ref || 'refs/heads/main'), 'refs/tags/') && ((github.event.client_payload.event || github.event_name) == 'schedule' || ((github.event.client_payload.event || github.event_name) == 'pull_request' && '' == 'run-e2e') || ((github.event.client_payload.event || github.event_name) == 'workflow_dispatch' && inputs.lane == 'e2e'))) && ((github.event.client_payload.event || github.event_name) != 'pull_request' || '' == 'run-e2e'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      suites: ${{ steps.set.outputs.suites }}
      count: ${{ steps.set.outputs.count }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - id: set
        name: Find every <Category>/<Tool>/test/e2e suite
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node -e '
            const fs = require("fs"), path = require("path");
            // templates/ is what a tool is stamped from, not a tool. (_skeleton/ was
            // its pre-move location — see ref/pre-prune-2026-09-08:extensions/MIGRATION.md — kept as new-tool.mjs fallback.)
            const SKIP = new Set(["templates", "_skeleton", "node_modules"]);
            const dirs = p => fs.readdirSync(p, { withFileTypes: true })
                                .filter(d => d.isDirectory() && !d.name.startsWith(".") && !SKIP.has(d.name))
                                .map(d => d.name);
            const out = [];
            for (const cat of dirs("."))
              for (const tool of dirs(cat))
                if (fs.existsSync(path.join(cat, tool, "test", "e2e", "package.json")))
                  out.push({ dir: `${cat}/${tool}`, slug: `${cat}-${tool}` });
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `suites=${JSON.stringify(out)}\ncount=${out.length}\n`);
            console.log(`${out.length} e2e suite(s): ${out.map(o => o.dir).join(", ") || "(none)"}`);
          '
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name extensions.e2e-discover.2 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: A run that found nothing is not a pass
        if: steps.set.outputs.count == '0'
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          echo "::error::no <Category>/<Tool>/test/e2e/package.json found — this workflow would have run nothing and reported success."
          exit 1
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name extensions.e2e-discover.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Hand this job's red detail to the report job, sealed (generated)
        id: nikatru-handoff
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_HANDOFF: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-extensions.e2e-discover.${{ strategy.job-index }}
        run: |
          if [ -s "$RUNNER_TEMP/report-detail.md" ]; then
            py=python3; python3 -c '' >/dev/null 2>&1 || py=python
            "$py" -I "$GITHUB_WORKSPACE/tooling/ci/shell-report.py" handoff
          fi
      - name: Save the hand-off (generated)
        if: always() && steps.nikatru-handoff.outputs.has == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-detail
          key: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-extensions.e2e-discover.${{ strategy.job-index }}
          enableCrossOsArchive: true

  e2e-suite:
    name: e2e · ${{ matrix.suite.dir }}
    needs: e2e-discover
    if: (github.event_name != 'repository_dispatch' || (github.event.client_payload.event == 'push' && startsWith(github.event.client_payload.ref, 'refs/tags/fullshot-v'))) && ((!startsWith((github.event.client_payload.ref || 'refs/heads/main'), 'refs/tags/') && ((github.event.client_payload.event || github.event_name) == 'schedule' || ((github.event.client_payload.event || github.event_name) == 'pull_request' && '' == 'run-e2e') || ((github.event.client_payload.event || github.event_name) == 'workflow_dispatch' && inputs.lane == 'e2e'))) && (needs.e2e-discover.result == 'success' && needs.e2e-discover.outputs.count != '0'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: ${{ (github.event.client_payload.event || github.event_name) == 'pull_request' }}
      matrix:
        suite: ${{ fromJSON(needs.e2e-discover.outputs.suites) }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
