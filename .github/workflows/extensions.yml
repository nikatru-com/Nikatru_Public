        working-directory: extensions/${{ matrix.suite.dir }}/test/e2e
        env:
          SUITE_DIR: ${{ matrix.suite.dir }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
