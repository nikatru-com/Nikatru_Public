            const registers = (body, sh) => QUOTES.some(q =>
                 body.includes(q + sh.file) || body.includes("/" + sh.file)
              || body.includes("fixture(" + q + sh.base + q)
              || body.includes("name:" + q + sh.base + q)
              || body.includes("[" + q + sh.base + q + ","));
            /* A PARENT is a fixture that LOADS this one — src= or data= only.
               href= is excluded deliberately: a link is not in the picture. An
               earlier draft matched any mention of the filename and marked
               review-tall.html graded because canvas-pii.html discusses it in a
               comment, which is the same disease as the grep — so HTML comments
               go FIRST here, the way decomment() already treats the .mjs
               sources. Leaving fixture HTML uncommented while stripping .mjs
               was an asymmetry that would have marked a child graded off a
               commented-out tag; no fixture here carries one today.
               THE VALUE IS RESOLVED, not compared as a bare filename: it is
               joined onto the directory of the fixture that loads it and ../
               is walked, so a cross-directory parent is seen. The earlier draft
               matched only a bare or ./ filename and only within ONE directory,
               so src=../fixtures/x.html would have left x.html reported
               UNGRADED — a FALSE REGRESSED rather than a missed cover. */
            const LOADS = new RegExp("(?:src|data)=([" + QUOTES.join("") + "])([^" + QUOTES.join("") + "]+)", "g");
            const uncomment = t => t.replace(/<!--[\s\S]*?-->/g, " ");
            const resolveRef = (fromDir, ref) => {
              const bare = ref.split("#")[0].split("?")[0];
              if (!bare || /^[A-Za-z][A-Za-z0-9+.-]*:/.test(bare) || bare.startsWith("/")) return null;
              const out = [];
              for (const seg of (fromDir + "/" + bare).split("/")) {
                if (!seg || seg === ".") continue;
                if (seg === "..") { if (!out.length) return null; out.pop(); continue; }
                out.push(seg);
              }
              return out.join("/");
            };
            const text = new Map(shapes.map(sh => [sh.id, uncomment(fs.readFileSync(sh.dir + "/" + sh.file, "utf8")).replace(/\s+/g, "")]));
            const loadsOf = new Map(shapes.map(sh => [sh.id, new Set(
              [...text.get(sh.id).matchAll(LOADS)].map(m => resolveRef(sh.dir, m[2])).filter(Boolean))]));
            for (const sh of shapes) {
              sh.by = all.filter(f => registers(flat.get(f), sh));
              sh.wired = sh.by.filter(f => suites.includes(f));
              sh.parents = shapes.filter(p => p !== sh && loadsOf.get(p.id).has(sh.id));
            }
            const covered = new Set(shapes.filter(s => s.wired.length).map(s => s.id));
            for (let pass = 0; pass < shapes.length; pass++) {
              let grew = false;
              for (const sh of shapes)
                if (!covered.has(sh.id) && sh.parents.some(p => covered.has(p.id))) { covered.add(sh.id); grew = true; }
              if (!grew) break;
            }
            /* A guard clause that scans nothing reports COVERAGE LOST, never ok
               — the rule the SUITE_DIR check above already follows. */
            if (!fixDirs.length || !shapes.length) {
              console.log(`::error::fixture-coverage guard COVERAGE LOST — ${fixDirs.length} fixture director(y/ies) and ${shapes.length} shape(s) found in ${here}/test/e2e. It graded nothing and must not certify anything.`);
              process.exit(1);
            }
            const ungraded = shapes.filter(s => !covered.has(s.id)).map(s => s.id);
            const known = new Set(baseline);
            const grown = ungraded.filter(id => !known.has(id));
            const shrunk = baseline.filter(id => !ungraded.includes(id));
            const phantom = baseline.filter(id => !shapes.some(s => s.id === id));
            console.log(`::group::fixture coverage — ${shapes.length} shape(s) across ${fixDirs.join(" ")}`);
            for (const sh of shapes)
              console.log(`fixture-coverage ${covered.has(sh.id) ? "GRADED  " : "UNGRADED"}  ${sh.id}  wired=[${sh.wired.join(" ") || "-"}]  registered=[${sh.by.join(" ") || "-"}]  loaded-by=[${sh.parents.map(p => p.file).join(" ") || "-"}]`);
            console.log("::endgroup::");
            console.log(`fixture-coverage ${shapes.length} shape(s), ${suites.length} wired suite(s), ${mine.length} quarantined — ${ungraded.length} reach no wired suite (baseline ${baseline.length} for ${here}, of ${UNGRADED_BASELINE.length} recorded across all directories)`);
            /* ── WHY THESE TWO REDS ARE HELD HERE AND CASHED AT THE END ──────
               EVERY OTHER pre-loop process.exit(1) in this step is a THIS STEP
               CANNOT TELL WHAT IT IS DOING condition: SUITE_DIR empty, a
               package.json script naming a file the classifier lost, nothing
               left to run, no fixture directory found at all. A guard in that
               state must not certify anything, so it stops.
               COVERAGE BOOKKEEPING IS NOT THAT CONDITION. The step can run all
               six wired suites and all four quarantine audits perfectly with
               one new ungraded fixture sitting in the tree, and an exit here
               would spend the entire test run of the product to report a stale
               list. It was measured doing exactly that: one new ungraded
               fixture dropped in, ZERO e2e-suite lines in the log, exit 1.
               So both findings are PRINTED here, where the coverage group is
               and where they are cheap to read, and CASHED at the end of the
               step beside the suite failures. The job still goes red on either
               one; nothing is downgraded to a warning. COVERAGE LOST above
               stays fatal and stays where it is, because that one really is
               the cannot-tell condition. */
            const coverageRed = [];
            if (phantom.length) {
              coverageRed.push(`the ungraded baseline for ${here} names ${phantom.join(", ")}, which is not a fixture there any more`);
              console.log(`::error::the ungraded baseline names ${phantom.join(", ")}, which is not a fixture in ${here}/test/e2e any more. Delete the entry with the fixture — a coverage note that outlives its subject is how a hole stops being visible. The suites still run; this reddens the job at the end of this step.`);
            }
            if (shrunk.length) {
              console.log(`::notice::fixture-coverage IMPROVED — ${shrunk.join(", ")} now reach a wired suite. Remove them from UNGRADED_BASELINE in the same commit that wired them, so the list keeps meaning what it says.`);
            }
            if (grown.length) {
              coverageRed.push(`fixture-coverage REGRESSED — ${grown.join(", ")} reach no wired suite and are not on the baseline for ${here}`);
              console.log(`::error::fixture-coverage REGRESSED — ${grown.join(", ")} reach no wired suite and are not on the baseline for ${here}. Either wire a suite over the shape or, if it is genuinely ungraded, add it to UNGRADED_BASELINE with its dir and the reason beside it. Adding it silently is how the last seven got there. The suites still run; this reddens the job at the end of this step.`);
            }
            /* THE AUDIT AT THE END SPENDS ONLY WHAT THE WIRED SUITES DID NOT.
               Half of the 75-minute job backstop is reserved for npm ci and the
               Chromium download — that is the basis the timeout comment on this
               job states, and it is used here in that form and not in a looser
               one — which leaves this step about 37 minutes of its own. 35 is
               taken, so the clock kept here always expires BEFORE the job
               backstop and the log ends in a named budget line instead of an
               unreadable job timeout. The wired loop below is never cut short by
               it: the deadline is read only after that loop has finished, so the
               headroom the wired suites might need on a slow runner is not
               touched, the 2.8x figure the comment above quotes is unchanged,
               and a run that leaves nothing over audits nothing and says so. */
            const STEP_BUDGET_MS = 35 * 60 * 1000;
            const AUDIT_FLOOR_MS = 2 * 60 * 1000;
            const DEADLINE = Date.now() + STEP_BUDGET_MS;
            /* A SUITE THAT NEEDS A REAL DISPLAY SAYS SO IN ITS OWN SOURCE, ADDED
               2026-09-25: `e2e-display: headful` runs it under xvfb-run -a with
               HEADFUL=1 (the switch bidi-lib.mjs and the Playwright suites read).
               Every other suite is spawned exactly as before, headless, with no
               DISPLAY. The reason is a measurement, not a preference: a headless
               Firefox clipboard holds text only (see the Xvfb step above). */
            const DISPLAY_MARK = /\be2e-display:\s*headful\b/;
            const spawnSuite = (f, timeout) => DISPLAY_MARK.test(src.get(f))
              ? cp.spawnSync("xvfb-run", ["-a", process.execPath, f], { stdio: "inherit", timeout, env: { ...process.env, HEADFUL: "1" } })
              : cp.spawnSync(process.execPath, [f], { stdio: "inherit", timeout });
            const failed = [];
            for (const s of suites) {
              const t = Date.now();
              console.log(`::group::node ${s}`);
              /* A per-suite cap, so a hung suite is a NAMED failure instead of
                 a job timeout that says only that the step ran out of wall
                 clock. Twenty minutes against a slowest suite measured at 451s
                 on the author machine: room for a much slower runner before the
                 cap, rather than the suite, is the thing that bites. */
              const r = spawnSuite(s, 20 * 60 * 1000);
              console.log("::endgroup::");
              const code = r.error ? 1 : (r.status === null ? 1 : r.status);
              const extra = r.error ? ` (${r.error.message})` : (r.signal ? ` (signal ${r.signal})` : "");
              /* `e2e-suite` prefixes the line because the suites print their
                 own PASS/FAIL at column 0 as well (run.mjs does), and a log a
                 person greps has to distinguish one assertion from a verdict
                 on a whole suite. */
              console.log(`e2e-suite ${code === 0 ? "PASS" : "FAIL"}  ${s}  exit=${code}${extra}  ${Math.round((Date.now() - t) / 1000)}s`);
              if (code !== 0) failed.push(`${s} exit ${code}${extra}`);
            }
            if (failed.length) {
              console.log(`::error::${failed.length} of ${suites.length} e2e suite(s) failed: ${failed.join("; ")}`);
            }
            /* ── QUARANTINE AUDIT — ADDED 2026-08-26 ───────────────────────────
               THE GAP THIS CLOSES is the one the comment on the array names in
               its own words: the stale-entry check above fails the job when a
               note outlives its FILE, and until today nothing at all caught a
               note that outlived its MEASUREMENT. Two of those had just been
               found BY HAND, which is the only way they could be found.
               giveup-verify.mjs sat on the list as failing and re-measured
               GREEN — 112 pass, 0 fail, 3 note — and had been green for some
               time with nobody the wiser. adversarial-claim.mjs recorded 102
               pass 65 fail 3 open and measured 106 / 61 / 3 the next day. A
               stale quarantine is worse than no quarantine, because it reads as
               a considered decision and it is read by people who were not there.

               WHAT STALE IS TAKEN TO MEAN HERE, and the whole check follows from
               this one sentence: an entry ASSERTS THAT A SUITE IS RED, and it is
               stale when that assertion is no longer true. So the audit re-runs
               each quarantined suite and grades the NOTE — red against green,
               and nothing finer than that.

               WHY NOT AN AGE CEILING, which is the obvious design and which this
               corpus already runs deliberately in assert-platform-proof-fresh.
               It is refuted by the very evidence that motivated this check: BOTH
               drifts above happened in ONE DAY, measured 2026-08-25 and
               different on 2026-08-26. No ceiling that is not absurd catches a
               one-day drift, so an age rule would have printed green through
               both of the two cases it exists for. It reddens on the calendar,
               and the calendar is not the thing that moved.

               WHY NOT RE-AFFIRMATION BY HAND — a human touching the date when
               the numbers move. That is precisely the discipline already in
               force here, and it is the discipline that failed twice in one day.
               A rule that is cheaper to satisfy by editing a date than by taking
               a measurement is not a rule.

               WHY THE NUMBERS ARE NOT COMPARED, ONLY THE VERDICT. Re-running and
               diffing the COUNTS is the strongest-sounding option and it is
               unavailable here, on a basis this file already carries the proof
               of: the recorded counts were taken on the author machine, alone,
               with nothing else driving a browser, and the paragraph above this
               step records reduction-corpus.mjs at 1196 pass 0 fail run alone
               against 612 pass 25 fail run third in this same step, on the same
               tree, the same afternoon. A CI count set beside an author-machine
               count differs for reasons that have nothing to do with staleness,
               so a count comparison would redden on the RUNNER while calling it
               a stale note — a figure quoted without its basis, which is the
               exact mistake the timeout comment on this job spends a paragraph
               on. Counts stay a human duty and this check does not pretend
               otherwise.

               WHY RUNNING A KNOWN-RED SUITE IN CI IS SAFE HERE: it is
               non-blocking in the only direction that matters. A quarantined
               suite that is still red produces a ::warning:: and CANNOT fail the
               job, so nothing currently red is made to pass and no permanently
               red weekly job is created — which is the reason the array gives
               for not wiring these, and that reason still holds unchanged. The
               job goes red on exactly one event: a suite exits 0 while the entry
               beside it says it is red. That is not bad news about a suite, it
               is good news about a suite and bad news about the note, and it is
               the event nobody was watching for.

               A RUN THAT DID NOT COMPLETE PROVES NOTHING AND MAY NOT CORROBORATE.
               A suite killed by the budget exits non-zero, which is what a
               still-red suite also looks like; counting that as agreement would
               let a suite that has quietly gone green keep its entry forever, on
               evidence that is really only evidence about the clock. Killed runs
               are UNVERIFIED and are reported by name.

               WHAT THIS CANNOT CATCH, written down so nobody has to derive it a
               second time. (1) Count drift while the verdict holds — the second
               case above, 102/65/3 to 106/61/3, would still sit here unnoticed,
               for the basis reason given above. (2) A note whose PROSE reasoning
               has been overtaken while its red is still real: adversarial-claim
               U9 grades a retired absolute, and the suite is red either way, so
               this audit would report STANDS on it. (3) An entry naming a `dir`
               that no longer has a test/e2e suite at all — no matrix leg is
               created for it, so no leg matches it, and it is invisible to the
               per-directory checks here exactly as it is invisible to the
               stale-entry check above. (4) Anything whatsoever on a run where
               the wired suites use the whole budget, which is why that case says
               COVERAGE LOST and never ok. */
            const audited = { stands: [], contradicted: [], unverified: [] };
            if (!mine.length) {
              console.log(`::notice::quarantine audit: ${here}/test/e2e has NO quarantine entries, so this audit checked NOTHING. That is the goal state for the list and it is printed rather than passed over in silence, because a check that reached nothing must not be able to certify anything.`);
            }
            for (const q of mine) {
              const c = claimOf(q);
              const left = DEADLINE - Date.now();
              if (left < AUDIT_FLOOR_MS) {
                audited.unverified.push(`${q.file} (budget spent before it started, ${Math.round(left / 1000)}s left)`);
                console.log(`e2e-quarantine UNVERIFIED  ${q.file}  not started`);
                continue;
              }
              const qt = Date.now();
              console.log(`::group::quarantine audit — node ${q.file} (recorded ${c.date}, exit ${c.exit})`);
              const qr = spawnSuite(q.file, Math.min(left, 20 * 60 * 1000));
              console.log("::endgroup::");
              const qs = Math.round((Date.now() - qt) / 1000);
              if (qr.error || qr.status === null) {
                audited.unverified.push(`${q.file} (run did not complete: ${qr.error ? qr.error.message : "signal " + qr.signal})`);
                console.log(`e2e-quarantine UNVERIFIED  ${q.file}  ${qs}s`);
              } else if (qr.status === 0) {
                audited.contradicted.push(`${q.file} (recorded exit ${c.exit} on ${c.date}, exited 0 here)`);
                console.log(`e2e-quarantine CONTRADICTED  ${q.file}  recorded=${c.exit} observed=0  ${qs}s`);
              } else {
                audited.stands.push(q.file);
                console.log(`e2e-quarantine STANDS  ${q.file}  recorded=${c.exit} observed=${qr.status}  ${qs}s`);
              }
            }
            if (audited.unverified.length) {
              console.log(`::warning::quarantine audit COVERAGE LOST — ${audited.unverified.length} of ${mine.length} entr(y/ies) in ${here} were NOT verified on this run: ${audited.unverified.join("; ")}. Those notes are unchecked, and unchecked is not confirmed.`);
            }
            if (audited.contradicted.length) {
              console.log(`::error::the quarantine is out of date: ${audited.contradicted.join("; ")}. An entry here is a MEASUREMENT saying the suite is red, and this one just passed. Re-measure it, then either wire the suite and retire the entry IN WRITING beneath the original sentence, or append the number that keeps it here. Editing the sentence above it is not one of the options.`);
            }
            if (coverageRed.length) {
              console.log(`::error::fixture coverage is red, and it is cashed HERE rather than where it was found so that finding it cost nothing but the tick: ${coverageRed.join("; ")}.`);
            }
            if (failed.length || audited.contradicted.length || coverageRed.length) process.exit(1);
            console.log(`${suites.length} e2e suite(s) ran, all green${mine.length ? ` — and ${mine.length} quarantined suite(s) were re-run but NOT graded: ${audited.stands.length} still red as recorded, ${audited.unverified.length} unverified` : ` — the quarantine list for ${here} is empty, which is the goal`}`);
          '
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name extensions.e2e-suite.7 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Hand this job's red detail to the report job, sealed (generated)
        id: nikatru-handoff
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_HANDOFF: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-extensions.e2e-suite.${{ strategy.job-index }}
        run: |
          if [ -s "$RUNNER_TEMP/report-detail.md" ]; then
            py=python3; python3 -c '' >/dev/null 2>&1 || py=python
            "$py" -I "$GITHUB_WORKSPACE/tooling/ci/shell-report.py" handoff
          fi
      - name: Save the hand-off (generated)
        if: always() && steps.nikatru-handoff.outputs.has == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-detail
          key: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-extensions.e2e-suite.${{ strategy.job-index }}
          enableCrossOsArchive: true

  e2e-branded:
    name: e2e-branded · ${{ matrix.channel }} · ${{ matrix.suite.dir }}
    needs: e2e-discover
    if: (github.event_name != 'repository_dispatch' || (github.event.client_payload.event == 'push' && startsWith(github.event.client_payload.ref, 'refs/tags/fullshot-v'))) && ((!startsWith((github.event.client_payload.ref || 'refs/heads/main'), 'refs/tags/') && ((github.event.client_payload.event || github.event_name) == 'schedule' || ((github.event.client_payload.event || github.event_name) == 'pull_request' && '' == 'run-e2e') || ((github.event.client_payload.event || github.event_name) == 'workflow_dispatch' && inputs.lane == 'e2e'))) && (needs.e2e-discover.result == 'success' && needs.e2e-discover.outputs.count != '0'))
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: extensions
    strategy:
      fail-fast: ${{ (github.event.client_payload.event || github.event_name) == 'pull_request' }}
      matrix:
        suite: ${{ fromJSON(needs.e2e-discover.outputs.suites) }}
        channel: [msedge, chrome]
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: extensions/${{ matrix.suite.dir }}/test/e2e/package-lock.json
      - name: Install e2e dependencies
        working-directory: extensions/${{ matrix.suite.dir }}/test/e2e
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          npm ci
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name extensions.e2e-branded.3 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: Run every suite that opts into the branded leg (derived, not listed)
        working-directory: extensions/${{ matrix.suite.dir }}/test/e2e
        env:
          FS_E2E_CHANNEL: ${{ matrix.channel }}
          HEADFUL: '1'
          SUITE_DIR: ${{ matrix.suite.dir }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node -e '
            const fs = require("fs"), cp = require("child_process");
            const MARK = /\be2e-branded:([^\n]*)/;
            const SETTING = /^FS_E2E_[A-Z_]+=[A-Za-z0-9,._-]+$/;
            const files = fs.readdirSync(".").filter(f => f.endsWith(".mjs")).sort();
            const src = new Map(files.map(f => [f, fs.readFileSync(f, "utf8")]));
            /* The library rule of the e2e-suite step: a file another file imports is not a suite. */
            const suites = files.filter(g => !files.some(f => f !== g && src.get(f).includes("./" + g)));
            const picked = [];
            for (const f of suites) {
              const m = MARK.exec(src.get(f));
              if (!m) continue;
              const words = m[1].trim().split(/\s+/).filter(Boolean);
              const bad = words.filter(w => !SETTING.test(w));
              if (bad.length) {
                console.log(`::error::${f} carries e2e-branded: with ${bad.join(" ")}, which is not an FS_E2E_NAME=value setting. The line would have run the suite with settings nobody can read off it.`);
                process.exit(1);
              }
              picked.push({ f, env: Object.fromEntries(words.map(w => [w.slice(0, w.indexOf("=")), w.slice(w.indexOf("=") + 1)])) });
            }
            /* Zero is not a pass: a leg that ran nothing on Edge would read as Edge being fine. */
            if (!picked.length) {
              console.log(`::error::no .mjs in ${process.env.SUITE_DIR}/test/e2e carries an e2e-branded: line, so this leg would run nothing on ${process.env.FS_E2E_CHANNEL} and report success.`);
              process.exit(1);
            }
            const failed = [];
            for (const p of picked) {
              const t = Date.now();
              console.log(`::group::node ${p.f} on ${process.env.FS_E2E_CHANNEL} ${JSON.stringify(p.env)}`);
              const r = cp.spawnSync(process.execPath, [p.f], { stdio: "inherit", timeout: 15 * 60 * 1000, env: { ...process.env, ...p.env } });
              console.log("::endgroup::");
              const code = r.error ? 1 : (r.status === null ? 1 : r.status);
              console.log(`e2e-branded ${code === 0 ? "PASS" : "FAIL"}  ${p.f}  channel=${process.env.FS_E2E_CHANNEL}  exit=${code}  ${Math.round((Date.now() - t) / 1000)}s`);
              if (code !== 0) failed.push(`${p.f} exit ${code}`);
            }
            if (failed.length) {
              console.log(`::error::${failed.length} of ${picked.length} suite(s) failed on ${process.env.FS_E2E_CHANNEL}: ${failed.join("; ")}`);
              process.exit(1);
            }
          '
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name extensions.e2e-branded.4 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: Hand this job's red detail to the report job, sealed (generated)
        id: nikatru-handoff
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_HANDOFF: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-extensions.e2e-branded.${{ strategy.job-index }}
        run: |
          if [ -s "$RUNNER_TEMP/report-detail.md" ]; then
            py=python3; python3 -c '' >/dev/null 2>&1 || py=python
            "$py" -I "$GITHUB_WORKSPACE/tooling/ci/shell-report.py" handoff
          fi
      - name: Save the hand-off (generated)
        if: always() && steps.nikatru-handoff.outputs.has == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-detail
          key: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-extensions.e2e-branded.${{ strategy.job-index }}
          enableCrossOsArchive: true

  release:
    if: (github.event_name != 'repository_dispatch' || (github.event.client_payload.event == 'push' && startsWith(github.event.client_payload.ref, 'refs/tags/fullshot-v'))) && (startsWith((github.event.client_payload.ref || 'refs/heads/main'), 'refs/tags/') || ((github.event.client_payload.event || github.event_name) == 'workflow_dispatch' && inputs.lane == 'release'))
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
      pull-requests: read
      deployments: write
    outputs:
      tool: ${{ steps.tag.outputs.id }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: A dispatch rehearses unless the owner typed one store's word, on the tag
        if: (github.event.client_payload.event || github.event_name) == 'workflow_dispatch' && inputs.dry_run != true
        env:
          CONFIRM: ${{ inputs.confirm }}
          LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          case "$CONFIRM" in
            SUBMIT-TO-FIREFOX-AMO|SUBMIT-TO-CHROME-WEB-STORE|SUBMIT-TO-EDGE-ADDONS) ;;
            *)
              echo "::error::dry_run was unchecked and confirm is '${CONFIRM}', which names no store. Publishing to a store is the owner's word alone: type SUBMIT-TO-FIREFOX-AMO, SUBMIT-TO-CHROME-WEB-STORE or SUBMIT-TO-EDGE-ADDONS to publish to that one store, or re-run with dry_run checked to rehearse every gate on real bytes."
              exit 1 ;;
          esac
          if [ "$LANE" != release ]; then
            echo "::error::confirm names a store but lane is '${LANE}'. Only lane=release builds the packages a store receives; re-dispatch with lane=release."
            exit 1
          fi
          case "$NIKATRU_REF" in
            refs/tags/*) ;;
            *)
              echo "::error::confirm names a store but this dispatch runs on ${NIKATRU_REF}, not on a release tag. A store receives the TAGGED commit's bytes and nothing else: re-dispatch with 'Use workflow from' set to the tag (gh workflow run extensions.yml --ref <tool>-v<x.y.z> ...)."
              exit 1 ;;
          esac
          echo "owner word ${CONFIRM} on ${NIKATRU_REF_NAME}: this run may publish to that one store and to no other."
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          fetch-depth: 0
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: The gate passed for this exact commit
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/ci/assert-gate-passed.mjs "$NIKATRU_SHA"
      - name: Every publishing step carries the dry-run guard
        working-directory: .
        run: node tooling/ci/assert-publish-steps-guarded.mjs --workflow .github/workflows/extensions.yml --job release --job store-publish
      - name: Preflight — every gate this release runs must exist
        shell: bash
        run: |
          set -euo pipefail  # 🔴 FIXED 2026-08-22; PRE-EXISTING HOLE, and the worst-placed copy of it in the repository. GitHub runs an explicit `shell: bash` as `bash --noprofile --norc -eo pipefail {0}`, so `-e` IS ALREADY ON when this body starts. This line used to read `set -uo pipefail`, which added `-u` and removed nothing — and under `-e` a command whose failure this step means to REPORT kills the shell first, so the report is dead code on the runner. `-e` is spelled out here so the flag a reader sees is the flag that is running, and every reported command below carries its own `||`. Here the reported command is the `called=` grep below: with no match it exits 1 and `-e` killed this step — so `::error::this preflight found no gate-script call in its own workflow`, the line whose job is to stop a release that was never inspected, could not print, and the step's only signal would be a red with no text on the one path that ships bytes to users. `grep -n 'release.yml:[0-9]' scripts/*.mjs` shows why the fix is spelled on existing lines rather than added above them.
          called=$(grep -ohE '(scripts|Extension/[A-Za-z0-9_]+/publish)/[A-Za-z0-9][A-Za-z0-9._/-]*\.(mjs|node\.js)' "$GITHUB_WORKSPACE/.github/workflows/extensions.yml" | sort -u) || true
          if [ -z "$called" ]; then
            echo "::error::this preflight found no gate-script call in its own workflow — its pattern is broken, and it was about to clear a release it never inspected."
            exit 1
          fi
          missing=0
          while IFS= read -r s; do
            if [ -f "$s" ]; then printf 'PRESENT  %s\n' "$s"
            else printf 'ABSENT   %s\n' "$s"; missing=$((missing + 1)); fi
          done <<< "$called"
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing gate script(s) above are ABSENT, so this tag cannot be released: the artifact would go out ungraded by checks this repository claims to run. Write them, or delete the tag."
            exit 1
          fi
      - name: Parse tag  (fullshot-v1.10.1 → id + version)
        id: tag
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$NIKATRU_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
            case "$NIKATRU_REF" in
              refs/tags/*)
                if [ -z "$TAG" ]; then
                  TAG="$NIKATRU_REF_NAME"
                elif [ "$TAG" != "$NIKATRU_REF_NAME" ]; then
                  echo "::error::this dispatch runs on the tag ${NIKATRU_REF_NAME} and the tag input says '${TAG}'. The bytes built here are ${NIKATRU_REF_NAME}'s, so a second name for them is refused rather than chosen between. Leave the tag input empty on a tag dispatch."
                  exit 1
                fi ;;
            esac
            if ! printf '%s' "$TAG" | grep -qE '^[a-z0-9][a-z0-9-]*-v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
              echo "::error::the tag input was '$TAG', which is not a release tag. Expected <tool-id>-v<major>.<minor>.<patch> with an optional fourth store-only component, e.g. fullshot-v1.10.1. This value is interpolated into later steps, so it is rejected here rather than passed on."
              exit 1
            fi
            if [ "${DRY_RUN:-}" = true ]; then
              echo "rehearsing $TAG (workflow_dispatch; nothing will be published)"
            else
              echo "building $TAG for the one store the confirm input names (workflow_dispatch on the tag)"
            fi
          else
            TAG="${NIKATRU_REF_NAME}"
          fi
          echo "id=${TAG%%-v*}"     >> "$GITHUB_OUTPUT"
          echo "version=${TAG#*-v}" >> "$GITHUB_OUTPUT"
      - name: This lane owns the tag
        working-directory: .
        env:
          TAG_ID: ${{ steps.tag.outputs.id }}
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: node tooling/ci/tag-owner.mjs --lane .github/workflows/extensions.yml --tag "$TAG_ID-v$TAG_VERSION"
      - name: Tag must be reachable from main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$NIKATRU_SHA" origin/main
      - name: ci graded THIS commit, so its gate results can be trusted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL_ID: ${{ steps.tag.outputs.id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # ── THE RULE, ONCE ──────────────────────────────────────────────────
          # Reads "<conclusion> <job name>" lines on stdin. Returns 0 only if the
          # per-tool legs for $1 were PRESENT and every one of them succeeded,
          # with at least one windows-2022 pack leg among them.
          grade() {
            local id="$1" c n fam g=0 s=0 p=0 w=0 bad=0
            while read -r c n; do
              fam=''
              # ⏱ 2026-09-24: the legs run in extensions-ci.yml, called by ci.yml's
              # `extensions` job and by this file's `ci` job, so their check-run names
              # carry the CALL job's name as a prefix. Exactly one KNOWN prefix is
              # stripped; any other prefix matches no family below, so a wrong table
              # fails closed (no leg found is RED), never green.
              case "$n" in
                "extensions / "*) n=${n#"extensions / "} ;;
                "ci / "*)         n=${n#"ci / "} ;;
              esac
              case "$n" in
                "gates · $id"|"gates · $id "*)     fam=gates ;;
                "sims · $id"|"sims · $id "*)       fam=sims ;;
                "package · $id"|"package · $id "*) fam=package ;;
              esac
              [ -n "$fam" ] || continue
              if [ "$c" != success ]; then
                printf '    RED  %-8s %s  (%s)\n' "$fam" "$n" "$c"
                bad=$((bad + 1))
                continue
              fi
              case "$fam" in
                gates)   g=$((g + 1)) ;;
                sims)    s=$((s + 1)) ;;
                package) p=$((p + 1))
                         case "$n" in *' · windows-2022') w=$((w + 1)) ;; esac ;;
              esac
            done
            printf '    gates=%d sims=%d package=%d (windows-2022 %d) not-success=%d\n' "$g" "$s" "$p" "$w" "$bad"
            [ "$bad" -eq 0 ] && [ "$g" -ge 1 ] && [ "$s" -ge 1 ] && [ "$p" -ge 1 ] && [ "$w" -ge 1 ]
          }

          # An empty id turns every prefix above into `gates · `, which matches
          # EVERY tool's legs — so it is refused rather than widened.
          ID="${TOOL_ID:-}"
          if [ -z "$ID" ]; then
            echo "::error::the tool id is empty, so the job-name prefixes below would match any tool's legs and any ci run would clear this tag. Parse tag produced no id."
            exit 1
          fi

          # ── THE RULE IS EXERCISED BEFORE IT IS TRUSTED ──────────────────────
          # `|| got=RED` reads the PIPELINE's status, whose last stage is grade —
          # which is the status wanted here, and is said out loud because a status
          # after a pipe usually is not the one the author meant.
          cases=0 ; bad=0
          expect() {
            local want="$1" label="$2" ; shift 2
            local got=GREEN
            printf '%s\n' "$@" | grade "$ID" >/dev/null 2>&1 || got=RED
            cases=$((cases + 1))
            if [ "$got" = "$want" ]; then
              printf '  ok    %-62s -> %s\n' "$label" "$got"
            else
              printf '  FAIL  %-62s -> %s, expected %s\n' "$label" "$got" "$want"
              bad=$((bad + 1))
            fi
          }
          G="success gates · $ID"
          S="success sims · $ID · node 24"
          PU="success package · $ID · chromium · ubuntu-24.04"
          PW="success package · $ID · firefox · windows-2022"
          OTHER="success ci-required"
          echo "built-in cases for the rule above:"
          expect GREEN '1. every per-tool leg ran and passed, windows included' "$G" "$S" "$PU" "$PW" "$OTHER"
          expect RED   '2. THE DEFECT: zero matrix, the per-tool legs are absent' "$OTHER"
          expect RED   '3. THE DEFECT, other spelling: the legs are listed skipped' "${G/success/skipped}" "${S/success/skipped}" "${PU/success/skipped}" "${PW/success/skipped}" "$OTHER"
          expect RED   '4. the legs ran, but no windows-2022 pack leg among them' "$G" "$S" "$PU" "$OTHER"
          expect RED   '5. a leg failed' "$G" "${S/success/failure}" "$PU" "$PW" "$OTHER"
          expect RED   '6. a sibling tool id ran green and this one did not' "success gates · $ID-pro" "success sims · $ID-pro · node 24" "success package · $ID-pro · firefox · windows-2022" "$OTHER"
          expect RED   '7. the jobs list held nothing this rule recognises' ''
          expect GREEN '8. the legs under the ci.yml call prefix' "success extensions / gates · $ID" "success extensions / sims · $ID · node 24" "success extensions / package · $ID · firefox · windows-2022" "$OTHER"
          expect RED   '9. an unknown call prefix grades nothing' "success foo / gates · $ID" "success foo / sims · $ID · node 24" "success foo / package · $ID · firefox · windows-2022" "$OTHER"
          if [ "$bad" -ne 0 ]; then
            echo "::error::$bad of $cases built-in case(s) above disagree with the rule this step is about to apply. The rule was weakened or the cases were; either way this run's verdict would mean nothing."
            exit 1
          fi
          echo "$cases of $cases built-in case(s) agree with the rule."
          echo

          # ── AND NOW, THIS COMMIT ────────────────────────────────────────────
          # ⏱ 2026-09-24: the per-tool legs are jobs of extensions-ci.yml, which runs
          # only as a call — from ci.yml's `extensions` job on every pull request and
          # every push to main, and from this file's `ci` job on a dispatch with
          # lane=ci. A called workflow's jobs appear inside the CALLER's run, so both
          # callers are asked. (This reverses 2026-09-22, when the legs were jobs of
          # this file and ci.yml defined none of them.)
          # tooling/ci/test/release-grades-legs.test.mjs holds each query target, one
          # call level deep, to the job names grade() reads. The SHAs asked about are
          # this commit and the head of every merged PR GitHub associates with it.
          # why: a commit's pull requests live in the CODE repository; in the public shell GITHUB_REPOSITORY names
          # the shell (NIKATRU_PRIVATE_REPO, set by the generated header, names the code).
          if ! prs=$(gh api "repos/${NIKATRU_PRIVATE_REPO:-$GITHUB_REPOSITORY}/commits/$NIKATRU_SHA/pulls" \
                --jq '.[] | select(.merged_at != null and .base.ref == "main") | .head.sha'); then
            echo "::error::could not ask GitHub which merged PR carried $NIKATRU_SHA. This step is the only thing between a tag and a gate result nobody produced, so it fails closed rather than assuming."
            exit 1
          fi
          shas=$(printf '%s\n%s\n' "$NIKATRU_SHA" "$prs" | awk 'NF && !seen[$0]++')
          runs=''
          for sha in $shas; do
            for q in "actions/workflows/ci.yml/runs?head_sha=$sha&per_page=100" \
                     "actions/workflows/extensions.yml/runs?head_sha=$sha&per_page=100"; do
              if ! r=$(gh api --paginate "repos/$GITHUB_REPOSITORY/$q" \
                    --jq '.workflow_runs[] | select(.conclusion == "success") | .id'); then
                echo "::error::could not ask GitHub which ${q%%/runs*} runs exist for $sha. This step is the only thing between a tag and a gate result nobody produced, so it fails closed rather than assuming."
                exit 1
              fi
              echo "  ${q%%/runs*} at $sha: successful run(s) [$(printf '%s' "$r" | tr '\n' ' ')]"
              runs="$runs $r"
            done
          done
          if [ -z "${runs// /}" ]; then
            echo "::error::neither ci.yml nor extensions.yml has a successful run at $NIKATRU_SHA or at the head of the PR that merged it, so no per-tool leg was graded on these bytes. Merge the change through a PR, let ci.yml finish green on it, then tag."
            exit 1
          fi

          good=''
          for run in $runs; do
            if ! jobs=$(gh api --paginate \
                  "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" \
                  --jq '.jobs[] | ((.conclusion // "null") + " " + .name)'); then
              echo "::error::could not read the jobs of run $run. Its conclusion alone does not say whether the per-tool legs ran, so this fails closed rather than falling back to it."
              exit 1
            fi
            if [ -z "$jobs" ]; then
              echo "::error::run $run reported NO jobs. An empty list grades as zero not-successes, which is the one answer this step must never read as a pass."
              exit 1
            fi
            echo "  run $run:"
            if grade "$ID" <<< "$jobs"; then good=$run ; break ; fi
          done

          if [ -n "$good" ]; then
            echo "run $good graded $NIKATRU_SHA: the gates, sims and package legs for '$ID' all RAN and passed, windows-2022 pack leg included."
            exit 0
          fi

          why="no successful ci.yml or extensions.yml run at $NIKATRU_SHA or at its merged PR's head actually ran the per-tool legs for '$ID'. A run whose discover selected zero tools concludes success with gates/sims/package SKIPPED — ci-required licenses that, and it clears nothing about these bytes. Merge a change discover selects '$ID' for, let ci.yml finish green on it, then tag."
          if [ "$NIKATRU_EVENT_NAME" = workflow_dispatch ] && [ "$NIKATRU_REF_NAME" = main ] && [ "${DRY_RUN:-}" = true ]; then
            echo "::notice::$why  This is a dry_run rehearsal dispatched from main, where a zero-matrix head is ordinary, so the rehearsal continues. On the push that publishes, all three of those conditions are false and this is a refusal."
            exit 0
          fi
          echo "::error::$why"
          exit 1
      - name: Gates (manifest == CHANGELOG == tag, policy, core sync, lint, store metadata, catalogue)
        run: |
          node scripts/check-version.mjs ${{ steps.tag.outputs.id }} --expect ${{ steps.tag.outputs.version }}
          node scripts/policy-check.mjs   ${{ steps.tag.outputs.id }} --release
          node scripts/check-core-sync.mjs ${{ steps.tag.outputs.id }}
          node scripts/lint.mjs ${{ steps.tag.outputs.id }}
          node scripts/check-store-metadata.mjs ${{ steps.tag.outputs.id }}
          node scripts/check-catalog.mjs
      - name: Secret scan (full tree)
        run: node scripts/secret-scan.mjs .
      - name: Sims
        run: node scripts/run-tests.mjs ${{ steps.tag.outputs.id }}
      - name: Build all store packages
        run: |
          node scripts/pack.mjs ${{ steps.tag.outputs.id }} --target chromium --out dist --release
          node scripts/pack.mjs ${{ steps.tag.outputs.id }} --target firefox  --out dist --release
      - name: The unpacked tree leaves the release directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          moved=0
          for d in dist/unpacked-*; do
            [ -d "$d" ] || continue
            rm -rf "build/$(basename "$d")"
            mv "$d" build/
            moved=$((moved + 1))
          done
          if [ "$moved" -eq 0 ]; then
            echo "::error::pack.mjs left no dist/unpacked-* tree. The Firefox lint and the AMO submission both read one, so a release without it cannot reach addons.mozilla.org."
            exit 1
          fi
          echo "moved $moved unpacked tree(s) into build/"
          # The release directory must now be flat, and this says so on the spot
          # rather than letting the integrity record discover it forty minutes on.
          strays=$(find dist -mindepth 1 -maxdepth 1 -type d | head -5)
          if [ -n "$strays" ]; then
            echo "::error::dist still holds directories after the move:"; printf '%s\n' "$strays"
            exit 1
          fi
      - name: The built packages are uploadable
        shell: bash
        run: |
          set -euo pipefail
          code=0
          out=$(node scripts/check-store-packages.mjs ${{ steps.tag.outputs.id }} --dir dist 2>&1) || code=$?
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error::check-store-packages.mjs exited $code on dist. These are the exact archives the release step below uploads to a public repository, and an upload cannot be taken back."
            exit "$code"
          fi
          tally=$(printf '%s\n' "$out" | grep -oE '[0-9]+ store package\(s\) opened and graded, [0-9]+ unreadable, across [0-9]+ declared target\(s\)\.' | tail -1) || true
          if [ -z "$tally" ]; then
            echo "::error::the gate exited 0 but printed no 'N store package(s) opened and graded ... across K declared target(s).' tally. That line is the verdict this step reads — the script's own output says to read it rather than the exit code — so a run without it proved nothing this step could check."
            exit 1
          fi
          graded=${tally%% *}
          declared=$(printf '%s\n' "$tally" | sed -E 's/.*across ([0-9]+) declared target\(s\)\.$/\1/')
          covered=$(printf '%s\n' "$out" | grep -cE '^  PASS  target "[^"]+".*package\(s\) graded') || true
          if [ "$covered" -ne "$declared" ]; then
            echo "::error::$tally  Every declared target must have had a built package OF ITS OWN opened and graded here; $covered of $declared declared target(s) did. The release step below uploads dist/*.zip, so an uncovered target is either an artifact this gate never opened or one the pack step never wrote. The two totals in that tally can agree while a target is missing, which is why this reads the script's per-target PASS lines instead."
            exit 1
          fi
          echo "every declared target had a built package graded: $covered of $declared target(s), $graded package(s)."
      - name: The tool's own declared store gates, on the release zip (tool.json gates, stage release)
        env:
          TOOL_ID: ${{ steps.tag.outputs.id }}
        run: node scripts/discover.mjs --run-gates --tool "$TOOL_ID" --stage release --zip "dist/${TOOL_ID}-firefox.zip"
      - name: The AMO listing payload the first submit would carry (dry run)
        run: node scripts/amo-metadata.mjs --tool "${{ steps.tag.outputs.id }}" --print
      - name: Reference integrity + leak check on every artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(dist/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::pack.mjs produced no zips — nothing to verify, so nothing to release."
            exit 1
          fi
          for z in "${zips[@]}"; do
            echo "── $z"
            node scripts/verify-refs.mjs --zip "$z" --strict --leaks
          done
      - name: web-ext lint
        run: |
          set -euo pipefail
          if [ ! -d build/unpacked-firefox ]; then
            echo "::error::build/unpacked-firefox does not exist — pack.mjs did not leave an unpacked Firefox tree for web-ext to lint, so the AMO package is going out ungraded."
            exit 1
          fi
          # why: the linter is the locked island's binary, the same web-ext that signs
          # for AMO, installed from tooling/web-ext/package-lock.json. Never fetched
          # from the registry at run time (O-WEB-EXT-FETCHED-AT-RUN-TIME).
          npm ci --ignore-scripts --prefix ../tooling/web-ext
          ../tooling/web-ext/node_modules/.bin/web-ext lint --source-dir build/unpacked-firefox --warnings-as-errors
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::dist holds no *.zip, so SHA256SUMS.txt would be published empty beside release notes that tell readers to rebuild and compare against it."
            exit 1
          fi
          sha256sum "${zips[@]}" | tee SHA256SUMS.txt
          listed=$(grep -cE '^[0-9a-f]{64} ' SHA256SUMS.txt || true)
          if [ "$listed" -ne "${#zips[@]}" ]; then
            echo "::error::SHA256SUMS.txt carries $listed digest line(s) for ${#zips[@]} zip(s) in dist. Every one of those zips is uploaded to this public release under the printed claim that a rebuild can be compared against this file, and a short list makes that claim about artifacts it does not cover."
            exit 1
          fi
          echo "SHA256SUMS.txt: $listed digest line(s) for ${#zips[@]} zip(s) in dist."
      - name: Release notes from CHANGELOG
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ env.NIKATRU_REF_NAME }}
        run: |
          node scripts/changelog-section.mjs \
            ${{ steps.tag.outputs.id }} ${{ steps.tag.outputs.version }} > notes.md
          {
            echo ''
            echo '### Install'
            echo '- Chrome Web Store / Edge Add-ons: upload `*-chromium.zip` (the identical file goes to both)'
            echo '- Firefox (AMO): upload `*-firefox.zip`'
            echo ''
            echo 'Artifacts are byte-reproducible: rebuild from this tag with'
            echo '`node scripts/pack.mjs ${{ steps.tag.outputs.id }} --target chromium --release` and compare SHA256SUMS.txt.'
            echo ''
            echo "Check that this repository's release workflow built a download, from this tag (docs/release/verify-a-download.md):"
            echo ''
            echo "    gh attestation verify <file> --repo ${GH_REPO} --signer-workflow ${GH_REPO}/.github/workflows/extensions.yml --source-ref refs/tags/${TAG}"
          } >> notes.md
      - name: Describe the release, versioned per artefact
        working-directory: .
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTES_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.NIKATRU_REF_NAME }}
          TOOL: ${{ steps.tag.outputs.id }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          RELEASED_AT="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ "$NIKATRU_SHA")"
          node tooling/ci/release-manifest.mjs --emit-release-json extensions/dist \
            --app "$TOOL" --tag "${TOOL}-v${VERSION}" --sha "$NIKATRU_SHA" \
            --run-url "$RUN_URL" --notes-url "$NOTES_URL" \
            --released-at "$RELEASED_AT" \
            --version "$VERSION"
      - name: The integrity record the platform requires of every release
        working-directory: .
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          node tooling/ci/release-manifest.mjs --write extensions/dist
          --app "${{ steps.tag.outputs.id }}"
          --tag "${{ steps.tag.outputs.id }}-v${{ steps.tag.outputs.version }}"
          --sha "$NIKATRU_SHA" --run-url "$RUN_URL"
      - name: And the integrity record is re-checked, both ways
        working-directory: .
        run: node tooling/ci/release-manifest.mjs --verify extensions/dist
      - name: Grade the release record against the bytes beside it
        working-directory: .
        run: node tooling/ci/assert-release-json.mjs --dir extensions/dist
      - name: Stage release-dist-${{ steps.tag.outputs.id }} for this run's later jobs (generated)
        id: nikatru-stage-1
        if: inputs.dry_run != true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: extensions/dist
          NIKATRU_IF_NO_FILES: error
        run: node tooling/ci/shell-handoff.mjs stage
      - name: Hand off release-dist-${{ steps.tag.outputs.id }} to this run's later jobs (generated)
        if: ${{ (inputs.dry_run != true) && steps.nikatru-stage-1.outputs.has == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-handoff/x
          key: nikatru-handoff-release-dist-${{ steps.tag.outputs.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
      - name: The register must be able to name where this ships
        if: (github.event.client_payload.event || github.event_name) == 'push'
        working-directory: .
        env:
          TOOL: ${{ steps.tag.outputs.id }}
        run: node tooling/ci/release-manifest.mjs --emit-environments extensions/dist --app "$TOOL"
      - name: Publish GitHub Release
        if: (github.event.client_payload.event || github.event_name) == 'push' && inputs.dry_run != true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 🔴 THE LIST IS EXPLICIT, SO A NEW ASSET HAS TO BE ADDED HERE TOO.
          # build-platforms.yml enumerates with `--emit-assets` and picks up a new
          # file for free; this lane does not. release.json is named because the
          # manifest published beside it CONTAINS a line for release.json — a
          # release that uploads the manifest and not the file it covers fails
          # `post-deploy-smoke.mjs --release-manifest` on the first tag, and fails
          # it as "asset missing", which reads like a build problem.
          gh release create "$NIKATRU_REF_NAME" \
            extensions/dist/*.zip extensions/dist/SHA256SUMS.txt extensions/dist/SHA256SUMS \
            extensions/dist/release.json \
            --title "${{ steps.tag.outputs.id }} v${{ steps.tag.outputs.version }}" \
            --notes-file extensions/notes.md
      - name: The release must carry the assets this job just built
        if: (github.event.client_payload.event || github.event_name) == 'push' && inputs.dry_run != true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: >
          node tooling/ops/post-deploy-smoke.mjs --release-repo "$REPO"
          --release-tag "$NIKATRU_REF_NAME" --release-manifest extensions/dist/SHA256SUMS
      - name: Record what shipped, per channel this release is the origin for
        if: (github.event.client_payload.event || github.event_name) == 'push' && inputs.dry_run != true
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ steps.tag.outputs.id }}
        run: |
          set -euo pipefail
          # 🔴 AN ASSIGNMENT, NOT A `for` WORD LIST: `set -e` fails the step on the assignment's
          # exit and never on a word list's (O-APP-RELEASE-RECORDS-NO-DEPLOYMENT-SILENTLY).
          environments="$(node tooling/ci/release-manifest.mjs --emit-environments extensions/dist --app "$TOOL")"
          for environment in $environments; do
            node tooling/ci/record-deployment.mjs "$environment" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$NIKATRU_REF_NAME" --state pending_manual_publish
          done
      - name: Store publication — what this job did and did not publish
        if: always()
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          DRY_RUN: ${{ inputs.dry_run }}
          TOOL: ${{ steps.tag.outputs.id }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$NIKATRU_EVENT_NAME" = push ]; then
            why="a tag push builds and packages and never publishes to a store"
          elif [ "${DRY_RUN:-}" = true ]; then
            why="dry_run was checked, so this dispatch was a rehearsal"
          else
            why="this job builds and verifies only; the store-publish job submits the tag's Release assets to the one store named by confirm (${CONFIRM:-none}) once its reviewer approves"
          fi
          echo "::notice::NOT PUBLISHED by the release job (${TOOL:-?} v${VERSION:-?}): ${why}. To publish, dispatch extensions.yml ON the release tag with lane=release, dry_run unchecked and confirm set to one store's word."

  attest:
    name: Attest and verify every release file
    needs: release
    if: (github.event_name != 'repository_dispatch' || (github.event.client_payload.event == 'push' && startsWith(github.event.client_payload.ref, 'refs/tags/fullshot-v'))) && (inputs.dry_run != true)
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Restore the release-dist-${{ needs.release.outputs.tool }} hand-off (generated)
        id: nikatru-restore-2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-handoff/x
          key: nikatru-handoff-release-dist-${{ needs.release.outputs.tool }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nikatru-handoff-release-dist-${{ needs.release.outputs.tool }}-${{ github.run_id }}-
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Place the release-dist-${{ needs.release.outputs.tool }} hand-off where download-artifact put it (generated)
        if: ${{ (success()) && steps.nikatru-restore-2.outputs.cache-matched-key != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_TO: extensions/dist
        run: |
          mkdir -p "$NIKATRU_TO"
          cp -a .nikatru-handoff/x/. "$NIKATRU_TO/"
          rm -rf .nikatru-handoff/x
      - name: Attest the build provenance of every release file
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: extensions/dist/*
      - name: Verify every release file's provenance
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: >
          node tooling/ci/verify-provenance.mjs --dir extensions/dist --repo "$REPO"
          --signer-workflow "${REPO}/.github/workflows/extensions.yml"
          --attestation-id "$ATTESTATION_ID" --attestation-url "$ATTESTATION_URL"
          --out "${RUNNER_TEMP}/provenance.json"

  store-publish:
    name: Store publish — the owner's word, on the tag's released bytes
    needs: release
    if: (github.event_name != 'repository_dispatch' || (github.event.client_payload.event == 'push' && startsWith(github.event.client_payload.ref, 'refs/tags/fullshot-v'))) && ((github.event.client_payload.event || github.event_name) == 'workflow_dispatch' && startsWith((github.event.client_payload.ref || 'refs/heads/main'), 'refs/tags/') && inputs.lane == 'release' && inputs.dry_run != true)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: store-publish
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Refuse any ref but a release tag
        run: node tooling/ci/assert-deploy-ref.mjs --allow trigger:.github/workflows/extensions.yml
      - uses: ./.github/actions/setup-node
      - name: The tag this run publishes (fullshot-v1.10.1 → id + version)
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="$NIKATRU_REF_NAME"
          if ! printf '%s' "$TAG" | grep -qE '^[a-z0-9][a-z0-9-]*-v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::NOT PUBLISHED: '${TAG}' is not a release tag, so there is no Release whose assets a store may receive."
            exit 1
          fi
          echo "id=${TAG%%-v*}"     >> "$GITHUB_OUTPUT"
          echo "version=${TAG#*-v}" >> "$GITHUB_OUTPUT"
      - name: Download the tag's Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf release-assets
          gh release download "$NIKATRU_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets --pattern '*.zip' --pattern 'SHA256SUMS.txt' --pattern 'SHA256SUMS'
      - name: The downloaded assets are the bytes the Release published
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c SHA256SUMS.txt
      - name: The Release still carries the bytes this job submits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: >
          node tooling/ops/post-deploy-smoke.mjs --release-repo "$REPO"
          --release-tag "$NIKATRU_REF_NAME" --release-manifest release-assets/SHA256SUMS
      - name: Unpack the released Firefox package for the AMO signer
        shell: bash
        env:
          TOOL: ${{ steps.tag.outputs.id }}
        run: |
          set -euo pipefail
          rm -rf release-assets/unpacked-firefox
          mkdir -p release-assets/unpacked-firefox
          unzip -q "release-assets/${TOOL}-firefox.zip" -d release-assets/unpacked-firefox
      - name: The AMO signer, from its locked island
        run: npm ci --ignore-scripts --prefix tooling/web-ext
      - name: Firefox (AMO) — the listing title is cleared (PROVEN-FREE or HELD)
        if: inputs.confirm == 'SUBMIT-TO-FIREFOX-AMO'
        env:
          TOOL: ${{ steps.tag.outputs.id }}
        run: node tooling/ci/assert-extension-name-clearance.mjs --tool "$TOOL" --for-submission=amo
      - name: Firefox (AMO) — credentials present, or the owner step
        id: amo_arming
        if: inputs.confirm == 'SUBMIT-TO-FIREFOX-AMO'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          TOOL: ${{ steps.tag.outputs.id }}
        run: |
          set -euo pipefail
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "one or more AMO_* repository secrets are empty; the register decides what that means."
          fi
          code=0
          out=$(node extensions/scripts/publish-arming.mjs --channel amo --tool "$TOOL" 2>&1) || code=$?
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error::NOT PUBLISHED to Firefox Add-ons: the arming preflight exited ${code} (1 = the register ARMS the amo channel and the credentials or the add-on id are refused; 2 = COVERAGE LOST, the verdict could not be read). This is a failed publish, not a skipped store."
            exit 1
          fi
          verdict=$(sed -n 's/^ARMING_VERDICT=//p' <<< "$out")
          reason=$(sed -n 's/^ARMING_REASON=//p' <<< "$out")
          if [ -z "$verdict" ]; then
            echo "::error::NOT PUBLISHED to Firefox Add-ons: the arming preflight printed no ARMING_VERDICT line, so there is no verdict to act on."
            exit 1
          fi
          echo "amo=${verdict}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          if [ "$verdict" != go ]; then
            if [ "$DRY_RUN" = true ]; then
              echo "::notice::rehearsal: Firefox Add-ons verdict is '${verdict}': ${reason}"
            else
              echo "::error::NOT PUBLISHED to Firefox Add-ons: ${reason}"
              exit 1
            fi
          fi
      - name: Submit to Firefox Add-ons (AMO)
        id: amo
        if: (github.event.client_payload.event || github.event_name) == 'workflow_dispatch' && startsWith((github.event.client_payload.ref || 'refs/heads/main'), 'refs/tags/') && inputs.dry_run != true && inputs.confirm == 'SUBMIT-TO-FIREFOX-AMO'
        shell: bash
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm }}
          TOOL: ${{ steps.tag.outputs.id }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_ACTIONS:-}" != true ] || [ -z "${GITHUB_REPOSITORY:-}" ]; then
            echo "::error::NOT PUBLISHED to Firefox Add-ons: a store publish runs only inside GitHub Actions (GITHUB_ACTIONS=true and GITHUB_REPOSITORY set)."
            exit 1
          fi
          if [ "$NIKATRU_EVENT_NAME" != workflow_dispatch ] || [ "$CONFIRM" != SUBMIT-TO-FIREFOX-AMO ]; then
            echo "::error::NOT PUBLISHED to Firefox Add-ons: reached on event '${NIKATRU_EVENT_NAME}' with confirm '${CONFIRM}'. Only a dispatch carrying SUBMIT-TO-FIREFOX-AMO may publish here, so this step's if: has been widened."
            exit 1
          fi
          code=0
          out=$(node extensions/scripts/publish-amo.mjs --tool "$TOOL" --source-dir release-assets/unpacked-firefox --artifacts-dir release-assets/amo --submit 2>&1) || code=$?
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error::NOT PUBLISHED to Firefox Add-ons: the AMO publisher exited ${code}."
            exit "$code"
          fi
          if ! grep -q '^publish-amo: SUBMITTED' <<< "$out"; then
            echo "::error::NOT PUBLISHED to Firefox Add-ons: the AMO publisher exited 0 without printing SUBMITTED, which is its answer for a channel the register does not arm. The owner asked for this store, so a run that sent nothing is a failure, not a pass."
            exit 1
          fi
          # [10]D-9: the listing was READ BACK from AMO after the sign; never typed at dispatch.
          listing=$(sed -n 's/^LISTING_URL=//p' <<< "$out" | tail -n 1)
          case "$listing" in
            https://addons.mozilla.org/*) ;;
            *)
              echo "::error::SUBMITTED to Firefox Add-ons, and no https://addons.mozilla.org/ listing URL was read back ('${listing}'). The record below cannot name the listing: record it by hand."
              exit 1 ;;
          esac
          echo "listing_url=${listing}" >> "$GITHUB_OUTPUT"
          echo "published=yes" >> "$GITHUB_OUTPUT"
      - name: Record the AMO submission in the [10]D-9 ledger
        if: always() && steps.amo.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ steps.tag.outputs.id }}
          LISTING_URL: ${{ steps.amo.outputs.listing_url }}
          RUN_NUMBER: ${{ github.run_number }}
        run: node tooling/ci/record-deployment.mjs "$TOOL-amo" --state in_review --listing-url "$LISTING_URL" --mode production --artifact "release-assets/${TOOL}-firefox.zip" --build-number "$RUN_NUMBER"
      - name: Chrome Web Store — the listing title is cleared (PROVEN-FREE or HELD)
        if: inputs.confirm == 'SUBMIT-TO-CHROME-WEB-STORE'
        env:
          TOOL: ${{ steps.tag.outputs.id }}
        run: node tooling/ci/assert-extension-name-clearance.mjs --tool "$TOOL" --for-submission=chrome-webstore
      - name: Chrome Web Store — credentials present, or the owner step
        if: inputs.confirm == 'SUBMIT-TO-CHROME-WEB-STORE'
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CWS_SERVICE_ACCOUNT_JSON" ] || [ -z "$CWS_PUBLISHER_ID" ]; then
            echo "one or more CWS_* repository secrets are empty; the register decides what that means."
          fi
          if ! node extensions/scripts/publish-arming.mjs --channel chrome-webstore --tool "${{ steps.tag.outputs.id }}"; then
            echo "::error::the register ARMS the chrome-webstore channel and its credentials are missing, so this run cannot submit to the Chrome Web Store. This is a failed publish, not a skipped store."
            exit 1
          fi
      - name: Submit to the Chrome Web Store
        id: cws
        if: (github.event.client_payload.event || github.event_name) == 'workflow_dispatch' && startsWith((github.event.client_payload.ref || 'refs/heads/main'), 'refs/tags/') && inputs.dry_run != true && inputs.confirm == 'SUBMIT-TO-CHROME-WEB-STORE'
        shell: bash
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm }}
          TOOL: ${{ steps.tag.outputs.id }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_ACTIONS:-}" != true ] || [ -z "${GITHUB_REPOSITORY:-}" ]; then
            echo "::error::NOT PUBLISHED to the Chrome Web Store: a store publish runs only inside GitHub Actions (GITHUB_ACTIONS=true and GITHUB_REPOSITORY set)."
            exit 1
          fi
          if [ "$NIKATRU_EVENT_NAME" != workflow_dispatch ] || [ "$CONFIRM" != SUBMIT-TO-CHROME-WEB-STORE ]; then
            echo "::error::NOT PUBLISHED to the Chrome Web Store: reached on event '${NIKATRU_EVENT_NAME}' with confirm '${CONFIRM}'. Only a dispatch carrying SUBMIT-TO-CHROME-WEB-STORE may publish here, so this step's if: has been widened."
            exit 1
          fi
          code=0
          out=$(node extensions/scripts/publish-cws.mjs --tool "$TOOL" --zip "release-assets/${TOOL}-chromium.zip" 2>&1) || code=$?
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error::NOT PUBLISHED to the Chrome Web Store: the Chrome publisher exited ${code}."
            exit "$code"
          fi
          if ! grep -q '^publish-cws: SUBMITTED' <<< "$out"; then
            echo "::error::NOT PUBLISHED to the Chrome Web Store: the Chrome publisher exited 0 without printing SUBMITTED, which is its answer for a channel the register does not arm. The owner asked for this store, so a run that sent nothing is a failure, not a pass."
            exit 1
          fi
          echo "listing_url=$(sed -n 's/^LISTING_URL=//p' <<< "$out" | tail -n 1)" >> "$GITHUB_OUTPUT"
          echo "published=yes" >> "$GITHUB_OUTPUT"
      - name: Record the Chrome Web Store submission in the [10]D-9 ledger
        if: always() && steps.cws.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ steps.tag.outputs.id }}
          LISTING_URL: ${{ steps.cws.outputs.listing_url }}
        run: node tooling/ci/record-deployment.mjs "$TOOL-chrome-webstore" --state in_review --listing-url "$LISTING_URL"
      - name: Edge Add-ons — the listing title is cleared (PROVEN-FREE or HELD)
        if: inputs.confirm == 'SUBMIT-TO-EDGE-ADDONS'
        env:
          TOOL: ${{ steps.tag.outputs.id }}
        run: node tooling/ci/assert-extension-name-clearance.mjs --tool "$TOOL" --for-submission=edge-addons
      - name: Edge Add-ons — credentials present, or the owner step
        if: inputs.confirm == 'SUBMIT-TO-EDGE-ADDONS'
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$EDGE_CLIENT_ID" ] || [ -z "$EDGE_API_KEY" ]; then
            echo "one or more EDGE_* repository secrets are empty; the register decides what that means."
          fi
          if ! node extensions/scripts/publish-arming.mjs --channel edge-addons --tool "${{ steps.tag.outputs.id }}"; then
            echo "::error::the register ARMS the edge-addons channel and its credentials are missing, so this run cannot submit to Microsoft Edge Add-ons. This is a failed publish, not a skipped store."
            exit 1
          fi
      - name: Submit to Microsoft Edge Add-ons
        id: edge
        if: (github.event.client_payload.event || github.event_name) == 'workflow_dispatch' && startsWith((github.event.client_payload.ref || 'refs/heads/main'), 'refs/tags/') && inputs.dry_run != true && inputs.confirm == 'SUBMIT-TO-EDGE-ADDONS'
        shell: bash
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm }}
          TOOL: ${{ steps.tag.outputs.id }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_ACTIONS:-}" != true ] || [ -z "${GITHUB_REPOSITORY:-}" ]; then
            echo "::error::NOT PUBLISHED to Microsoft Edge Add-ons: a store publish runs only inside GitHub Actions (GITHUB_ACTIONS=true and GITHUB_REPOSITORY set)."
            exit 1
          fi
          if [ "$NIKATRU_EVENT_NAME" != workflow_dispatch ] || [ "$CONFIRM" != SUBMIT-TO-EDGE-ADDONS ]; then
            echo "::error::NOT PUBLISHED to Microsoft Edge Add-ons: reached on event '${NIKATRU_EVENT_NAME}' with confirm '${CONFIRM}'. Only a dispatch carrying SUBMIT-TO-EDGE-ADDONS may publish here, so this step's if: has been widened."
            exit 1
          fi
          code=0
          out=$(node extensions/scripts/publish-edge.mjs --tool "$TOOL" --zip "release-assets/${TOOL}-chromium.zip" 2>&1) || code=$?
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error::NOT PUBLISHED to Microsoft Edge Add-ons: the Edge publisher exited ${code}."
            exit "$code"
          fi
          if ! grep -q '^publish-edge: SUBMITTED' <<< "$out"; then
            echo "::error::NOT PUBLISHED to Microsoft Edge Add-ons: the Edge publisher exited 0 without printing SUBMITTED, which is its answer for a channel the register does not arm. The owner asked for this store, so a run that sent nothing is a failure, not a pass."
            exit 1
          fi
          echo "listing_url=$(sed -n 's/^LISTING_URL=//p' <<< "$out" | tail -n 1)" >> "$GITHUB_OUTPUT"
          echo "published=yes" >> "$GITHUB_OUTPUT"
      - name: Record the Edge Add-ons submission in the [10]D-9 ledger
        if: always() && steps.edge.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ steps.tag.outputs.id }}
          LISTING_URL: ${{ steps.edge.outputs.listing_url }}
        run: node tooling/ci/record-deployment.mjs "$TOOL-edge-addons" --state in_review --listing-url "$LISTING_URL"
      - name: Store publication — what this run did and did not publish
        if: always()
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          TOOL: ${{ steps.tag.outputs.id }}
          VERSION: ${{ steps.tag.outputs.version }}
          AMO: ${{ steps.amo.outputs.published }}
          CWS: ${{ steps.cws.outputs.published }}
          EDGE: ${{ steps.edge.outputs.published }}
        run: |
          set -euo pipefail
          published=0
          for row in "Firefox Add-ons (AMO);${AMO:-};SUBMIT-TO-FIREFOX-AMO" "the Chrome Web Store;${CWS:-};SUBMIT-TO-CHROME-WEB-STORE" "Microsoft Edge Add-ons;${EDGE:-};SUBMIT-TO-EDGE-ADDONS"; do
            store="${row%%;*}"; rest="${row#*;}"; sent="${rest%%;*}"; word="${rest#*;}"
            if [ "$sent" = yes ]; then
              echo "PUBLISHED to ${store}: ${TOOL:-?} v${VERSION:-?}, on the owner's word ${word}."
              published=$((published + 1))
              continue
            fi
            if [ "${CONFIRM:-}" = "$word" ]; then
              why="the owner typed ${word} and the publish step did not complete; read its log above"
            else
              why="confirm did not name this store"
            fi
            echo "::notice::NOT PUBLISHED to ${store}: ${why}. To publish, dispatch extensions.yml ON the release tag with lane=release, dry_run unchecked and confirm=${word}."
          done
          echo "${published} store(s) published by this run."

  cws-token-keepalive:
    name: The Chrome Web Store service-account credential still mints
    if: (github.event_name != 'repository_dispatch' || (github.event.client_payload.event == 'push' && startsWith(github.event.client_payload.ref, 'refs/tags/fullshot-v'))) && ((github.event.client_payload.event || github.event_name) == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node
      - name: Mint a service-account token, or print the owner step
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          if [ -z "$CWS_SERVICE_ACCOUNT_JSON" ]; then
            echo "the CWS_SERVICE_ACCOUNT_JSON repository secret is empty; the register decides what that means."
          fi
          if ! node scripts/publish-cws-keepalive.mjs; then
            echo "::error::the Chrome Web Store credential the release lane depends on could not be exercised. The service-account key in CWS_SERVICE_ACCOUNT_JSON no longer mints a token -- disabled, deleted or rotated. A dead key is invisible until a tag push tries to use it."
            exit 1
          fi
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name extensions.cws-token-keepalive.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Hand this job's red detail to the report job, sealed (generated)
        id: nikatru-handoff
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_HANDOFF: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-extensions.cws-token-keepalive.${{ strategy.job-index }}
        run: |
          if [ -s "$RUNNER_TEMP/report-detail.md" ]; then
            py=python3; python3 -c '' >/dev/null 2>&1 || py=python
            "$py" -I "$GITHUB_WORKSPACE/tooling/ci/shell-report.py" handoff
          fi
      - name: Save the hand-off (generated)
        if: always() && steps.nikatru-handoff.outputs.has == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-detail
          key: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-extensions.cws-token-keepalive.${{ strategy.job-index }}
          enableCrossOsArchive: true

