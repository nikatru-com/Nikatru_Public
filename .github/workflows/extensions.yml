  extensions-lane-accounting:
    name: The lane that should have run, ran
    needs:
      - ci
      - e2e-suite
      - e2e-branded
      - release
      - attest
      - store-publish
      - cws-token-keepalive
      - store-key-keepalive
    if: (github.event_name != 'repository_dispatch' || (github.event.client_payload.event == 'push' && startsWith(github.event.client_payload.ref, 'refs/tags/fullshot-v'))) && (always())
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: A skipped lane is only correct if the event selected another one
        shell: bash
        env:
          CI: ${{ needs.ci.result }}
          E2E: ${{ needs.e2e-suite.result }}
          BRANDED: ${{ needs.e2e-branded.result }}
          RELEASE: ${{ needs.release.result }}
          ATTEST: ${{ needs.attest.result }}
          STORE: ${{ needs.store-publish.result }}
          KEEPALIVE: ${{ needs.cws-token-keepalive.result }}
          STORE_KEEPALIVE: ${{ needs.store-key-keepalive.result }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT: ${{ (github.event.client_payload.event || github.event_name) }}
          REF: ${{ (github.event.client_payload.ref || 'refs/heads/main') }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ '' }}
          LANE: ${{ inputs.lane }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          # 🔴 WHY THIS JOB EXISTS. Three trigger families share one file, so
          # every job below carries a lane guard, and a lane guard that is wrong
          # makes its job SKIP. GitHub reports a skipped job as Success, and a
          # required check that `needs:` it is satisfied. So the three lanes were
          # one respelled expression away from a repository whose whole extension
          # pipeline reported green while running nothing — which is exactly the
          # "a scanner that silently stopped scanning" shape this corpus names
          # first, arriving through the mechanism that was supposed to prevent it.
          #
          # So the guards are not trusted: the lane is derived here, separately,
          # from the event, and the results are required to match it.
          echo "event=$EVENT ref=$REF action=${ACTION:-none} label=${LABEL:-none} lane_input=${LANE:-none}"
          echo "ci=$CI e2e=$E2E e2e-branded=$BRANDED release=$RELEASE attest=$ATTEST store-publish=$STORE keepalive=$KEEPALIVE store-key-keepalive=$STORE_KEEPALIVE"

          # ⏱ 2026-09-24: the CI lane left this file for extensions-ci.yml, which ci.yml
          # calls on every pull request and push to main. Here it runs only on a dispatch
          # with lane=ci, through the `ci` call job, so a non-labeled pull_request and a
          # branch push are no longer events of this workflow: both map to `unknown`,
          # which is RED, rather than to a lane this file no longer runs.
          case "$REF" in
            refs/tags/*) want=release ;;
            *)
              case "$EVENT" in
                schedule)          want=e2e ;;
                workflow_dispatch) want="${LANE:-ci}" ;;
                pull_request)
                  if [ "${ACTION:-}" = labeled ]; then
                    if [ "${LABEL:-}" = run-e2e ]; then want=e2e; else want=none; fi
                  else want=unknown; fi ;;
                *)                 want=unknown ;;
              esac ;;
          esac
          echo "the event selects lane: $want"

          fail=0

          expect() {           # expect <lane-name> <result> <should-have-run?>
            local n=$1 r=$2 should=$3
            if [ "$should" = yes ]; then
              case "$r" in
                success) ;;
                skipped) echo "::error::the $want lane was selected by this event and '$n' came out SKIPPED. A skipped job reports Success and satisfies everything that needs it, so this run would have been green over a lane that did not execute. Its lane guard does not match the event."; fail=1 ;;
                *)       echo "::error::'$n' came out '$r'."; fail=1 ;;
              esac
            else
              case "$r" in
                skipped) ;;
                *) echo "::error::'$n' came out '$r' on an event that selects the '$want' lane. A lane running outside its own trigger is a guard that is too wide — at best it burns a runner, at worst a release lane runs on a pull request."; fail=1 ;;
              esac
            fi
          }

          [ "$want" = none ] || {
            expect ci          "$CI"      "$([ "$want" = ci ] && echo yes || echo no)"
            expect e2e-suite   "$E2E"     "$([ "$want" = e2e ] && echo yes || echo no)"
            expect e2e-branded "$BRANDED" "$([ "$want" = e2e ] && echo yes || echo no)"
            expect release     "$RELEASE" "$([ "$want" = release ] && echo yes || echo no)"
          }

          # The attest job is NOT a lane: it runs after every successful release job but a dry-run rehearsal's
          # (O-RELEASES-HAVE-NO-PROVENANCE (absent from open.json until the next Private pass records it)). That release must see it succeed; every other event must leave it SKIPPED.
          if [ "$RELEASE" = success ] && [ "${DRY_RUN:-}" != true ]; then
            case "$ATTEST" in
              success) ;;
              *) echo "::error::'attest' came out '$ATTEST' after a successful release job. A release whose files were not attested and verified is not done."; fail=1 ;;
            esac
          else
            case "$ATTEST" in
              skipped) ;;
              *) echo "::error::'attest' came out '$ATTEST' with no release to attest (release=$RELEASE, dry_run=${DRY_RUN:-}). A signing job running outside a release is a guard that is too wide."; fail=1 ;;
            esac
          fi

          # The store-publish job is NOT a lane either: it runs only after a successful release
          # job on a publishing dispatch (a workflow_dispatch on a tag, lane=release, dry_run
          # unchecked). Any other event must leave it SKIPPED; that dispatch must see it run.
          # (A failed release leaves it skipped too, and the release red already says so.)
          if [ "$EVENT" = workflow_dispatch ] && [ "${REF#refs/tags/}" != "$REF" ] && [ "${LANE:-}" = release ] && [ "${DRY_RUN:-}" != true ] && [ "$RELEASE" = success ]; then
            case "$STORE" in
              success) ;;
              *) echo "::error::'store-publish' came out '$STORE' on a publishing dispatch whose release job succeeded. The owner's word was typed and no store job completed."; fail=1 ;;
            esac
          else
            case "$STORE" in
              skipped) ;;
              *) echo "::error::'store-publish' came out '$STORE' on an event that is not a publishing dispatch. A store job running outside the owner's word is a guard that is too wide."; fail=1 ;;
            esac
          fi

          # The keep-alive is NOT a lane and is deliberately graded separately: it is a weekly
          # credential exercise that rides the DAILY schedule the e2e lane already uses (it was a
          # Monday-only cron until #519 widened it — ci-19: give the EVIDENCE the margin, not the
          # duty; GitHub drops most scheduled slots and a weekly one gives a 252h window one chance), so it
          # is selected by the EVENT and not by `want`. Folding it into `expect` would have made
          # it look like a fourth lane and forced a fourth arm into the derivation above, which
          # is how a lane guard ends up too wide.
          # ⏱ 2026-09-25 (EXT-6): there are two keep-alives now (store-key-keepalive exercises the
          # AMO and Edge keys), graded by one function so the two cannot be graded differently.
          grade_scheduled() {  # grade_scheduled <job> <result>
            local n=$1 r=$2
            case "$EVENT:$r" in
              schedule:success) ;;
              schedule:*)
                echo "::error::'$n' came out '$r' on the daily schedule. That job is the only thing in this repository that exercises its store credential between releases; a skipped or failed run means the credential is unexercised, and a disabled, revoked, rotated or expired key stays invisible until a tag push."
                fail=1 ;;
              *:skipped) ;;
              *)
                echo "::error::'$n' came out '$r' on event '$EVENT'. It carries \`if: github.event_name == 'schedule'\`, so on any other event it must be SKIPPED — a credential exercise running on a pull request is a guard that is too wide."
                fail=1 ;;
            esac
          }
          grade_scheduled cws-token-keepalive "$KEEPALIVE"
          grade_scheduled store-key-keepalive "$STORE_KEEPALIVE"

          if [ "$want" = unknown ]; then
            echo "::error::this job could not derive a lane from event '$EVENT' on ref '$REF'. A new trigger was added to this workflow and this accounting was not taught about it, so nothing here graded the run. Add the case."
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "lane '$want' ran; the other lanes are correctly skipped."
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name extensions.extensions-lane-accounting.1 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: Hand this job's red detail to the report job, sealed (generated)
        id: nikatru-handoff
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_HANDOFF: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-extensions.extensions-lane-accounting.${{ strategy.job-index }}
        run: |
          if [ -s "$RUNNER_TEMP/report-detail.md" ]; then
            py=python3; python3 -c '' >/dev/null 2>&1 || py=python
            "$py" -I "$GITHUB_WORKSPACE/tooling/ci/shell-report.py" handoff
          fi
      - name: Save the hand-off (generated)
        if: always() && steps.nikatru-handoff.outputs.has == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-detail
          key: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-extensions.extensions-lane-accounting.${{ strategy.job-index }}
          enableCrossOsArchive: true

