          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          sudo apt-get update
          sudo apt-get install -y xvfb
          if ! command -v xvfb-run; then
            echo "::error::xvfb is installed but xvfb-run is not on PATH; a suite that declares e2e-display: headful cannot run"
