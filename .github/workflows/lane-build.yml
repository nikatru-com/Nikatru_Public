          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name lane-build.lane-verdict.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Hand this job's red detail to the report job, sealed (generated)
        id: nikatru-handoff
