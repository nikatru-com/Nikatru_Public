      - name: An Apple privacy manifest that exists is one the build copies
        if: ${{ !cancelled() }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
