          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name lane-sites.sites.13 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Delete the feed so the generator has to produce it
        run: |
