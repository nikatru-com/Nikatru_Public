          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name lane-sites.content-gate.7 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: A pack is inert data in only the locked formats
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-pack-inert.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name lane-sites.content-gate.8 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Every produced item has an IP-clean, logged prompt
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-prompt-provenance.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name lane-sites.content-gate.9 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The human sample is deterministic, covered and checklisted
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-review-gate.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name lane-sites.content-gate.10 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Publish is a gate, and an undrilled signing key cannot sign
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-publish-gate.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name lane-sites.content-gate.11 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Hand this job's red detail to the report job, sealed (generated)
        id: nikatru-handoff
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_HANDOFF: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-lane-sites.content-gate.${{ strategy.job-index }}
        run: |
          if [ -s "$RUNNER_TEMP/report-detail.md" ]; then
            py=python3; python3 -c '' >/dev/null 2>&1 || py=python
            "$py" -I "$GITHUB_WORKSPACE/tooling/ci/shell-report.py" handoff
          fi
      - name: Save the hand-off (generated)
        if: always() && steps.nikatru-handoff.outputs.has == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-detail
          key: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-lane-sites.content-gate.${{ strategy.job-index }}
          enableCrossOsArchive: true

  sites:
    name: Static sites (functions parse + required files)
    needs: detect
    if: needs.detect.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          fetch-depth: 0
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Generate the discovery surface (the sitemap is never committed)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/sites/generate-discovery.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name lane-sites.sites.2 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Site integrity
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          sites=$(node tooling/ci/site-set.mjs --emit)
          node tooling/ci/check-site-integrity.mjs . $sites
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name lane-sites.sites.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Known issues carry no personal data
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-known-issues.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name lane-sites.sites.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The accessibility statement publishes exactly the register's gaps
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
