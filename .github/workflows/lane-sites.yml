          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          rm -f sites/_shared/_data/apps.json
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name lane-sites.sites.14 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/sites/generate-apps-data.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name lane-sites.sites.15 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The generator actually wrote the feed
        run: |
