              echo "::error title=Not live::$key is on the copy list but is not a live secret."
              fail=1
            fi
          done < <(printf '%s\n' "${!want[@]}" | sort)
          echo "live: ${#have[@]} secret name(s) across the repository and $(wc -w <<< "$envs") environment(s); copy list: ${#want[@]}"
