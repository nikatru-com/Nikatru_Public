# GENERATED by tooling/ci/gen-public-shell.mjs from .github/workflows/name-clearance.yml of nikatru-com/Nikatru_Private.
# Do not edit: `node tooling/ci/gen-public-shell.mjs --check` re-generates it and fails on any difference.
env:
  NIKATRU_PRIVATE_REPO: nikatru-com/Nikatru_Private

name: Name clearance

on:
  workflow_dispatch:
  schedule:
    - cron: '10 7 * * 1'

permissions:
  contents: read

concurrency:
  group: name-clearance
  cancel-in-progress: false

jobs:
  sweep:
    name: Re-derive every declared app's name clearance and propose the records
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node
      - name: Re-derive every declared app's clearance record
        id: sweep
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          OUT="${RUNNER_TEMP}/name-clearance"
          mkdir -p "$OUT"
          set +e
          node tooling/ops/name-clearance-sweep.mjs > "$OUT/sweep.stdout.txt" 2> "$OUT/sweep.stderr.txt"
          code=$?
          set -e
          cat "$OUT/sweep.stdout.txt"
          cat "$OUT/sweep.stderr.txt" >&2
          echo "exit=${code}" >> "$GITHUB_OUTPUT"
          echo "sweep exit: ${code}"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name name-clearance.sweep.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Decide what the sweep proposes
        id: decide
        env:
          SWEEP_EXIT: ${{ steps.sweep.outputs.exit }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          OUT="${RUNNER_TEMP}/name-clearance"

          # ── the sweep's exit decides everything, and exit 1 is two things ──
          # 1 is a FLIP only when the sweep printed its flip report; an uncaught
          # throw in node also exits 1, and must never be proposed as a flip.
          case "$SWEEP_EXIT" in
            0) ;;
            1)
              if ! grep -q 'clearance verdict(s) FLIPPED' "$OUT/sweep.stderr.txt"; then
                echo "::error title=The name-clearance sweep failed without a verdict::tooling/ops/name-clearance-sweep.mjs exited 1 and printed no flip report, so it did not finish: the step log above carries the error. Nothing was proposed."
                exit 1
              fi
              ;;
            2)
              echo "::error title=Name clearance COVERAGE LOST - nothing was proposed::The sweep could not re-derive every record: a red control failed, a store did not answer, or the catalogue or register was unreadable. It refused to overwrite the existing records with a clearance full of could-not-check, so no branch and no pull request exist for this run. REMEDY: re-run once by workflow_dispatch when the stores answer; if it stays lost, the step log names the red control that failed."
              git status --porcelain -- apps/
              exit 2
              ;;
            *)
              echo "::error title=The name-clearance sweep exited ${SWEEP_EXIT}::An exit code the sweep does not document (0 no flip, 1 flip, 2 coverage lost). Nothing was proposed; the step log above carries its output."
              exit 1
              ;;
          esac

          git add -A
          git diff --cached --no-renames --name-only > "$OUT/changed-paths.txt"

          if [ ! -s "$OUT/changed-paths.txt" ]; then
            echo 'The sweep rewrote no record that differs from main. Nothing was proposed.' > "$OUT/NO-CHANGE.txt"
            echo "::notice title=No name-clearance change::Every record the sweep rewrote is byte-identical to what main carries. There is nothing to propose."
            echo "propose=false" >> "$GITHUB_OUTPUT"
            exit "$SWEEP_EXIT"
          fi

          # ── 🔴 THE PROPOSAL CARRIES THE RECORDS AND NOTHING ELSE ──
          if grep -Ev '^apps/[^/]+/name-clearance\.json$' "$OUT/changed-paths.txt" > "$OUT/outside-scope.txt"; then
            git diff --cached > "$OUT/name-clearance.diff"
            echo '--- PATHS OUTSIDE apps/*/name-clearance.json ---'
            cat "$OUT/outside-scope.txt"
            echo '--- END ---'
            echo "::error title=The sweep changed a path it does not own - nothing was proposed::A pull request from this workflow may carry apps/*/name-clearance.json and nothing else, and this run changed the paths printed above. That is a defect in the sweep or in something it imports, not a record to merge. The full diff is kept as this run's name-clearance artifact."
            exit 1
          fi

          echo "The sweep rewrote:"
          cat "$OUT/changed-paths.txt"
          # THE RECORDS ARE PUT SOMEWHERE DURABLE BEFORE THEY ARE PROPOSED: the patch is
          # kept with this run's name-clearance artifact, whatever the proposal does.
          git diff --cached > "$OUT/name-clearance.diff"

          {
            printf '%s\n\n' 'Rows: none - an automated name-clearance refresh closes no row.'
            if [ "$SWEEP_EXIT" -eq 1 ]; then
              printf '%s\n' '```'
              cat "$OUT/sweep.stderr.txt"
              printf '%s\n\n' '```'
              printf '%s\n\n' '**A NAME THAT WAS CLEARED AND IS NOT ANY MORE IS AN OWNER DECISION.** The run that proposed this is red on purpose. File an owner item for the flip above, and merge or close this pull request only on that ruling. Merging it records the new verdict on main; it does not decide anything about the name.'
            else
              printf '%s\n\n' 'The weekly sweep re-derived every declared app'"'"'s name clearance and **no verdict flipped**. This refreshes each record'"'"'s `asOf` and evidence, so the name-clearance guard (`assert-name-clearance.mjs`) keeps reading a measurement inside its 30-day ceiling.'
              printf '%s\n\n' 'Merge it once `ci-gate` is green: the bridge that opened it never merges, and nothing arms it to merge itself.'
            fi
            printf '%s\n' 'What the sweep printed, per app (previous verdict -> this run'"'"'s):'
            printf '%s\n' '```'
            cat "$OUT/sweep.stdout.txt"
            printf '%s\n\n' '```'
            printf '%s\n\n' 'The owner'"'"'s `trademark.ruling`, `ruledBy`, `ruledOn`, `ownerItem` and `gatedUntil` are carried over from main by the probe'"'"'s `writeRecord`, never rewritten by a re-probe (cases D4 and D6 of `name-clearance.test.mjs`).'
            printf '%s\n' '**Review note.** This diff should be `apps/*/name-clearance.json` and nothing else; the workflow refuses to propose anything wider, and so does the bridge (tooling/ci/public-shell.json `proposals`). If it contains anything that is not a re-derived record, do not merge it.'
          } > "$OUT/pr-body.md"

          if [ "$SWEEP_EXIT" -eq 1 ]; then
            TITLE='apps: a name-clearance verdict FLIPPED - owner decision (weekly sweep)'
          else
            TITLE='apps: refresh the name-clearance records (weekly sweep)'
          fi
          {
            echo "propose=true"
            echo "title=${TITLE}"
            echo "paths=$(tr '\n' ' ' < "$OUT/changed-paths.txt")"
          } >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name name-clearance.sweep.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Propose the records by pull request
        if: steps.decide.outputs.propose == 'true'
        env:
          NIKATRU_PROPOSE_PATHS: ${{ steps.decide.outputs.paths }}
          NIKATRU_PROPOSE_BRANCH: chore/name-clearance-${{ github.run_id }}
          NIKATRU_PROPOSE_BASE: main
          NIKATRU_PROPOSE_TITLE: ${{ steps.decide.outputs.title }}
          NIKATRU_PROPOSE_MESSAGE: |
            apps: re-derive the name-clearance records (weekly sweep)

            Written by .github/workflows/name-clearance.yml, which runs
            tooling/ops/name-clearance-sweep.mjs every Monday. Sweep exit ${{ steps.sweep.outputs.exit }}.
          NIKATRU_PROPOSE_BODY_FILE: ${{ runner.temp }}/name-clearance/pr-body.md
          NIKATRU_PROPOSE_ARTIFACT: proposal-name-clearance.sweep
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
          NIKATRU_BRIDGE_PROPOSE_URL: https://gh-bridge.nikatru.workers.dev/propose
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ops/bridge-propose.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name name-clearance.sweep.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: A flipped verdict is an owner decision
        if: steps.decide.outputs.propose == 'true' && steps.sweep.outputs.exit == '1'
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          echo "::error title=A name-clearance verdict FLIPPED - owner decision::The refresh pull request is open on the private repository and will NOT merge itself. File an owner item for the flip printed in the sweep step, and merge or close it only on that ruling."
          exit 1
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name name-clearance.sweep.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store name-clearance in the bridge's private home (generated)
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/name-clearance/
          NIKATRU_ARTIFACT_NAME: name-clearance
          NIKATRU_IF_NO_FILES: error
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-name-clearance.sweep.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload
