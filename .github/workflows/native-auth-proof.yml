            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-flutter
        if: env.PROOF_NEEDS_DEVICE == 'true'
      - name: flutter pub get
        if: env.PROOF_NEEDS_DEVICE == 'true'
        working-directory: apps/${{ needs.gate.outputs.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          flutter pub get --enforce-lockfile
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name native-auth-proof.android-oauth-return.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The app's API base, from the composer's rule
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/flutter-release-build.mjs --emit-env API_BASE_URL "$APP" >> "$GITHUB_ENV"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name native-auth-proof.android-oauth-return.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - uses: ./.github/actions/enable-kvm
        if: env.PROOF_NEEDS_DEVICE == 'true'
      - name: Boot an emulator
        if: env.PROOF_NEEDS_DEVICE == 'true'
        env:
          API_LEVEL: '34'
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/avd"
          echo "ANDROID_AVD_HOME=${ANDROID_AVD_HOME}" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          emu_log="${RUNNER_TEMP}/emulator.log"
          image="system-images;android-${API_LEVEL};google_apis;x86_64"
          why() {
            echo "::error title=Emulator::$1"
            echo "── emulator.log (tail) ──"
            tail -n 60 "$emu_log" 2>/dev/null || echo "(no emulator.log)"
            exit 1
          }
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          timeout 600 "$sdk/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools "$image" > /dev/null
          echo no | "$sdk/cmdline-tools/latest/bin/avdmanager" create avd --force -n proof -k "$image" --device pixel_6
          "$sdk/emulator/emulator" -list-avds | grep -qx proof || why "avdmanager created no AVD the emulator can see in ANDROID_AVD_HOME=${ANDROID_AVD_HOME}"
          nohup "$sdk/emulator/emulator" -avd proof -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel on > "$emu_log" 2>&1 &
          emu_pid=$!
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          adb="$sdk/platform-tools/adb"
          "$adb" start-server
          deadline=$((SECONDS + 420))
          phase="waiting for the device to appear"
          while :; do
            kill -0 "$emu_pid" 2>/dev/null || why "the emulator process exited during: ${phase}"
            state="$("$adb" get-state 2>/dev/null | tr -d '\r' || true)"
            if [ "$state" = "device" ]; then
              phase="waiting for sys.boot_completed"
              [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = "1" ] && break
            fi
            [ "$SECONDS" -gt "$deadline" ] && why "not booted within 420 s (last phase: ${phase}; adb state: ${state:-none})"
            sleep 5
          done
          echo "emulator booted at ${SECONDS}s"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name native-auth-proof.android-oauth-return.7 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The OAuth return — adb hands the app its callback
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/native_auth_proof.mjs --app "$APP" --target android --device emulator-5554 --log native-oauth-return.log --oauth-return
          NIKATRU_QUIET_EOF
