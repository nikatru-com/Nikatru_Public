# GENERATED by tooling/ci/gen-public-shell.mjs from .github/workflows/ops-watch.yml of nikatru-com/Nikatru_Private.
# Do not edit: `node tooling/ci/gen-public-shell.mjs --check` re-generates it and fails on any difference.
env:
  NIKATRU_PRIVATE_REPO: nikatru-com/Nikatru_Private

name: Ops watch

run-name: "Ops watch · ${{ github.event.client_payload.sha }}"

on:
  workflow_dispatch:
    inputs:
      failure_ledger:
        description: 'Also run the weekly failed-run ledger (about 430 API requests cold, ceiling 600; off for post-merge dispatches)'
        type: boolean
        default: false
      renovate_backlog:
        description: 'Also read the Renovate backlog against its floors (red while the queue outruns them; off for post-merge dispatches)'
        type: boolean
        default: false
      code_scanning_age:
        description: 'Also read the open code-scanning alerts against their 7-day triage window (off for post-merge dispatches)'
        type: boolean
        default: false
      tech_currency:
        description: 'Also read what the pipeline runs on against what its vendors retire (red while a proposal stands; off for post-merge dispatches)'
        type: boolean
        default: false
      dependency_advisories:
        description: 'Also scan every tracked lockfile on main with OSV-Scanner (red while an advisory stands; off for post-merge dispatches)'
        type: boolean
        default: false
      self_review:
        description: 'Also run the weekly self-review over the last ISO week and file it to its private issue (red while partial; off for post-merge dispatches)'
        type: boolean
        default: false
      unattended:
        description: 'Set by the platform Worker cron only: nobody is watching this run, so a failure files the ops-watch issue (off for land-script and hand dispatches)'
        type: boolean
        default: false
      digest:
        description: 'Also post the weekly ops digest (off for the Worker and post-merge dispatches; the Monday slot posts it regardless)'
        type: boolean
        default: false
  schedule:
    - cron: '30 7 * * *'
    - cron: '45 7 * * 1'
    - cron: '45 7 * * 4'
    - cron: '50 8 * * *'
    - cron: '30 19 * * *'
    - cron: '30 0 * * *'
    - cron: '30 2 * * *'
    - cron: '30 4 * * *'
    - cron: '0 11 * * *'
    - cron: '30 12 * * *'
    - cron: '30 15 * * *'
    - cron: '30 17 * * *'
    - cron: '30 22 * * *'

permissions:
  contents: read

concurrency:
  group: ops-watch-${{ (github.event.client_payload.event || github.event_name) }}
  cancel-in-progress: false

jobs:
  heartbeats:
    name: Every declared duty is fresh — the heartbeat rail AND the register
    needs: [status, supabase-drift, prod-provenance, pages-deployments, runner-budget, glitchtip, config-drift, edge-shield, failure-ledger, renovate-backlog, code-scanning-age, tech-currency, self-review, digest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          fetch-depth: 0
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node
      - name: The whole ops register — every duty, not just the heartbeat-backed ones
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPS_HOST_RUN_NEEDS: ${{ toJSON(needs) }}
          BRIDGE_READ_SECRET: ${{ secrets.BRIDGE_READ_SECRET }}
          NIKATRU_BRIDGE_OPS_URL: https://gh-bridge.nikatru.workers.dev/ops
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-ops-register.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.heartbeats.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Read the heartbeat table from OUTSIDE Cloudflare
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-heartbeats.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Heartbeats are UNKNOWN — the table was not read::check-heartbeats could not reach D1, could not read its schema, or found a job it has no expectation for. NOTHING was judged, so no job is known to be late; the step log names what could not be read."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A scheduled job has stopped beating::The heartbeat table was read and a job is missing or late past its window. The step log names the job, its newest beat and its window."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.heartbeats.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Live D1 still runs every statement the Workers send it
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-d1-accepts-live-sql.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            # NO BACKTICKS ANYWHERE IN THESE STRINGS: they are double-quoted, so
            # a backtick opens a command substitution and the annotation would
            # silently execute part of itself.
            echo "::error title=D1 statement acceptance is UNKNOWN — nothing was executed::The check could not reach D1, could not read a schema, or a database did not refuse the known-bad control statement. NOTHING was judged. A negative control that comes back accepted means the harness is not talking to a real authorizer, and a sweep in that state waves every statement through — which is indistinguishable from a healthy one."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=Live D1 REFUSES a statement the Workers deploy::A statement in services/*/src is rejected by D1's authorizer at runtime, or a write guarded by an unmatched key changed a row. The last time the first was true, every in-app account deletion had been failing with 503 for months while every check was green. The failing statement, its file and its line are in the step log."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.heartbeats.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Judge whether the analytics rail's silence is a FAULT
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-analytics-liveness.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            # NO BACKTICKS ANYWHERE IN THESE STRINGS: they are double-quoted, so
            # a backtick opens a command substitution and the annotation would
            # silently execute part of itself.
            echo "::error title=Analytics liveness is UNKNOWN — the duty did not run::The reader could not reach D1, found no (portfolio) heartbeat row, or the row's detail did not carry the structured tokens it parses. NOTHING judged the rail. This fails on purpose: 'I could not tell' must never read as 'it is fine' — an empty events table already looks exactly like a quiet week."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=The analytics rail is SILENT while users CONSENTED::Consent artifacts landed inside the same window and zero events did. Consent arrives on POST /v1/consent — a different route, transport and table — so reach is PROVEN and arrivals are ZERO. Check, in order: the client event queue flushing at all; POST /v1/events answering 2xx from the app origin (CORS); and the ingest dedup, which drops a duplicate event_id silently by design."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.heartbeats.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Each box's live config is the vendored config
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-box-config-drift.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            # NO BACKTICKS ANYWHERE IN THESE STRINGS (see the step above).
            echo "::error title=Box config drift is UNKNOWN — nothing was compared::The box_config_manifest table could not be read, or tooling/ops/box-config-vendored.json carries an entry with no vendored hash. NOTHING was judged, and that is never a pass. The step log names what could not be read."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A box's live config is not the vendored config, or the box stopped reporting::A hash differs, a declared file is missing or undeclared, or a box has not posted inside its window. The step log names the box and the file. Re-vendor the live file (and refresh the register) or put the vendored file back on the box; the box cron is tooling/ops/boxes/post-config-manifest.sh."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.heartbeats.7 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Every name-clearance record is inside its 30-day ceiling
        if: ${{ !cancelled() }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ci/assert-name-clearance.mjs --execute
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Name clearance is UNKNOWN - nothing was graded::The register, the catalogue, the schema or a record could not be read, so NO record was judged. That is never a pass: an unread record could be any age."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A name-clearance record is past its ceiling, or another finding stands::The step log names the record and the finding. Past 30 days, name-clearance.yml has not landed a refresh: read its newest scheduled run, which is red or absent, and what it says to do."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.heartbeats.8 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Is the daily OSV scan of main due on this run
        id: osvdue
        if: ${{ !cancelled() && (github.event.client_payload.event || github.event_name) == 'schedule' }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ops/osv-scan-due.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.heartbeats.9 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Install OSV-Scanner (version and digest from tooling/versions.json)
        id: osv
        if: ${{ !cancelled() && (steps.osvdue.outputs.due == 'true' || inputs.dependency_advisories) }}
        timeout-minutes: 3
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/install-pinned-tool.mjs osv-scanner --out "${RUNNER_TEMP}"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.heartbeats.10 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Known-vulnerable dependencies on main (canary, floor, then the tree)
        if: ${{ !cancelled() && steps.osv.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ci/scan-dependencies.mjs --osv "${RUNNER_TEMP}/osv-scanner"
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The dependency scan is UNKNOWN - nothing was graded::OSV did not flag its canary lockfile, did not read every tracked lockfile, could not reach its database, or answered in a shape the script cannot read. NOTHING about main's dependencies is known from this run, and that is never a pass. The step log names which."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A known advisory stands against a lockfile on main::The step log names each vulnerable package, its lockfile and its advisory ids. Move it to a fixed version in a pull request; one that cannot be fixed yet is acknowledged in osv-scanner.toml with a dated ignoreUntil. THIS job owns it: a pull request's security-scan fails on it only when that pull request changes its lockfile (or osv-scanner.toml), and prints it otherwise."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.heartbeats.11 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-ops-watch.heartbeats.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  status:
    name: Every enumerated surface produced its expected output
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
