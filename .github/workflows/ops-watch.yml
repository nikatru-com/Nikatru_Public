          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node
      - name: The app's federated-provider declaration matches the live project
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ops/verify-auth-providers.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.glitchtip.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The store service account is still powerless on GCP
        if: always()
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ops/verify-free-api-scope.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.glitchtip.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The zone itself still holds no wildcard record
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-wildcard-dns.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The wildcard state is UNKNOWN — the Cloudflare zone was not read::No token, the API refused, the zone did not resolve to exactly one id, or the record list came back in a shape this script cannot read. NOTHING about the wildcard is known from this run, and that is never a pass."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A wildcard DNS record exists, and ADR 080 section 4 deleted it::Every retired hostname goes on resolving while it stands, so a name nobody serves answers instead of failing. The step log names the record and its id."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.glitchtip.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Turnstile still allows every host the apps are served from
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-turnstile-hosts.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The Turnstile hostname list is UNKNOWN - the widget was not read::No token, no sitekey, or the API refused. An unreadable console is not a passing one: the list could say anything, including the retired subdomain that took sign-in offline on 2026-09-12."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=Turnstile does not allow a host the apps are served from - SIGN-IN IS DEAD THERE::The challenge cannot render on a host the widget does not allow, and the failure is silent: the page loads, the form draws, and only the challenge refuses. Add the host on the widget carrying this sitekey, under Turnstile in the Cloudflare dashboard."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.glitchtip.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: No retired name is still a live resource in the account
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PADDLE_API_KEY: ${{ secrets.PADDLE_READ_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_READ_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_READ_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_READ_PRIVATE_KEY }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_READ_SERVICE_ACCOUNT_JSON }}
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_READ_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_READ_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_READ_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-retired-names-live.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=A live inventory is UNKNOWN - a catalogue was not read::The step log names each limb that could not look (an unset credential, a refused read, or an empty answer). An unread catalogue is not a clean one: printing ok over the limbs that happened to be readable would make this check's coverage depend on which secrets exist that day."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A retired name is still live - ADR 079, or a pending read key outlived its declaration::The tree stopped naming it, so the source guard is green and will stay green. The step log names the limb and the record: a Cloudflare resource, a vendor product, price, entitlement or listing, or a GitHub environment. Rename or delete it in that console. A line naming an expired pending-provisioning declaration means the owner's read key is still unminted past its 14 days: mint it, or re-decide the declaration."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.glitchtip.7 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: No sandbox Worker holds the service-role key
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-sandbox-service-role.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The sandbox Workers were NOT read::No token, or a read that did not answer. An unread sandbox is not a clean one."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A sandbox Worker holds SUPABASE_SERVICE_ROLE_KEY - ADR no.NNN::The sandbox shares production's identity project and that bearer makes GoTrue skip its captcha. Run wrangler secret delete SUPABASE_SERVICE_ROLE_KEY --env sandbox in that Worker's directory."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.glitchtip.8 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-ops-watch.glitchtip.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  config-drift:
    name: The live config still matches what the repo records
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node
      - name: Compare the live Supabase auth config against tooling/mail-transport.json
        if: ${{ !cancelled() }}
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/verify-supabase-templates.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Supabase drift is UNKNOWN — nothing was compared::The script found no SUPABASE_PAT / SUPABASE_PROJECT_REF, or could not read the live auth config from the Management API (the log above says which), so NOTHING compared the live auth config against tooling/mail-transport.json or the DR templates in docs/platform/supabase/email-templates/. This fails on purpose: 'I could not look' must never read as 'I looked and it was fine'. OWNER ACTION — add SUPABASE_PAT and SUPABASE_PROJECT_REF as repository secrets. Until then this duty is unperformed, and on 2026-08-04 a one-field PATCH wiped the live SMTP block and reverted all three branded templates, recovering byte-for-byte only because those files happened to still match."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=Supabase auth config has DRIFTED::The live project no longer matches what the repo recorded. Decide which side is wrong before editing either — the log above names every field and file that differs."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.config-drift.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The register still matches the live GlitchTip monitors
        if: ${{ !cancelled() }}
        env:
          GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/verify-monitors.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Monitor reconciliation is UNKNOWN — GlitchTip was not read::The token is missing or refused, the instance did not answer, or the monitor list came back in a shape this script cannot read. NOTHING was reconciled, so nothing is known to have drifted."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=The monitor register and live GlitchTip disagree::A declared host has no live monitor, a live monitor matches no row, or the register disagrees with the app catalogue. The step log names each one."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.config-drift.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: …and every monitor can still reach a mailbox
        if: always()
        env:
          GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/verify-alarm-chains.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Alarm chains are UNKNOWN — GlitchTip was not read::The monitor list, the project list or a project's alerts could not be read. NOTHING about those chains was judged."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=An alarm chain no longer reaches a mailbox::A monitor has no project, a project has no alert with a recipient, or a chain has never been watched delivering. The step log names each one."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.config-drift.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The mail-auth DNS records still say what the register declares
        if: always()
        timeout-minutes: 3
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-mail-auth-dns.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The mail-auth DNS records are UNKNOWN - they were not judged::Neither DoH resolver answered for a record, the two disagree (a SPLIT, which is what a record mid-change looks like), or the register's authRecords block is missing or malformed. NOTHING about those records is known from this run, and that is never a pass."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A mail-auth DNS record no longer says what the register declares::A missing or changed SPF, DKIM, DMARC or bounce-MX record makes receivers junk mail that still reports sent. If the DNS changed on purpose, change authRecords in tooling/mail-transport.json the same hour. This red PAGES (the ops-watch issue) and does not block merges (duty.drift.live-config is page-only), so that pull request can land. The step log names the record."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.config-drift.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The Apple signing certificates and profiles in register.json still match App Store Connect
        if: always()
        timeout-minutes: 3
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_READONLY_PRIVATE_KEY && secrets.APP_STORE_CONNECT_READONLY_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_READONLY_KEY_ID && secrets.APP_STORE_CONNECT_READONLY_PRIVATE_KEY || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-apple-signing-expiry.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The Apple signing dates are UNKNOWN - App Store Connect was not read::A credential is missing, the key was refused (401 or 403), a read outlived the bounded retry, or an answer came back in a shape the checker cannot read. NOTHING about the certificates or profiles is known from this run, and that is never a pass."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=An Apple certificate or profile no longer matches register.json::A date differs from App Store Connect, a row is missing, an id answered 404, or a profile is not ACTIVE. For a date or a missing row: cut a branch from main, dispatch apple-expiry-write.yml on it, open the pull request. A 404 or an INVALID profile is a re-mint first, by provision-apple on the laptop. This red PAGES (the ops-watch issue) and does not block merges (duty.drift.live-config is page-only), so the apple-expiry-write pull request can land. The step log names the row."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.config-drift.7 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: CLOUDFLARE_READ_TOKEN is minted, and the read steps no longer fall back to the deploy token
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-cloudflare-read-token.mjs --page-from 2026-10-14
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The Cloudflare read-token state is UNKNOWN::The workflow file or the page-from date could not be read. NOTHING was judged."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=CLOUDFLARE_READ_TOKEN is not minted, or the deploy token still reaches a read step::Mint a read-only Cloudflare token (the step log lists the permissions) as the CLOUDFLARE_READ_TOKEN secret of the CI repository; once it is set, drop every fallback to the deploy token from ops-watch.yml. Until then the token-only limbs of three readers are NOT JUDGED. This pages and does not block merges."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.config-drift.8 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-ops-watch.config-drift.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  edge-shield:
    name: The edge shield is still in front of Box B and Box C
    if: github.event.schedule == '45 7 * * 1' || (github.event.client_payload.event || github.event_name) == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node
      - name: The edge shield is still in front of Box B and Box C
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-edge-shield.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The edge shield is UNKNOWN - a probe never answered, or the probes do not cover its routes::Nothing about whether services/edge-shield is in front of Box B and Box C is known from this run, and that is never a pass. The step log names the probe or the route."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=Shield not in path - Box B or Box C is taking traffic with no edge limit::A probe answered without x-nikatru-shield (the deployed SHA, or 1). Check the Worker routes on the nikatru.com zone (auth-api.nikatru.com/auth/v1/* and glitchtip.nikatru.com/api/*) and the edge-shield Worker's logs for exceptions; redeploy it from main. The step log names the probe."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.edge-shield.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The zone's per-IP credential rule is the declared one
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/edge-ratelimit-rule.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The zone's per-IP credential rule is UNKNOWN::The nikatru.com http_ratelimit phase could not be read, so nothing is known about the per-IP limit on the credential endpoints from this run, and that is never a pass. The step log names the reason."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=The zone's per-IP credential rule differs from tooling/edge-ratelimit-rule.json::The live rate-limiting rule on nikatru.com is not the declared one (the step log names each field). Redeploy edge-shield from main to restore it, or change the file in a PR if the live rule is right."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.edge-shield.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: www.nikatru.com is the declared 301 to the apex
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/www-redirect-rule.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The www redirect is UNKNOWN::The nikatru.com redirect phase or the www record could not be read, or the www probe never answered, so nothing is known about www.nikatru.com from this run, and that is never a pass. The step log names the reason."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=www.nikatru.com is not the declared 301 to the apex::The Single Redirect rule is missing or changed, the www record is not the declared one, or GET https://www.nikatru.com/x?y=1 does not answer 301 to https://nikatru.com/x?y=1 (the step log names each). Redeploy edge-shield from main to restore it, or change tooling/edge/zone.json in a PR if the live state is right."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.edge-shield.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The edge zone is the one tooling/edge/zone.json declares
        if: always()
        env:
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-edge-zone.mjs --cloudflare-read-paged
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The edge zone is UNKNOWN::The declaration did not validate, a Cloudflare read was refused, an Access-gate probe never answered, or CLOUDFLARE_READ_TOKEN is still unset past its pending-until date. Nothing about those parts is known from this run, and that is never a pass. The step log names each one."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=The edge zone drifted from tooling/edge/zone.json::A proxiable record is DNS-only outside the declared list, a declared record or Access app is gone, an undeclared Access app or WAF rule appeared, or a gated host no longer answers the Access 302. The step log names each finding. Restore it in the dashboard, or change the file in a reviewed PR if the live zone is right."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.edge-shield.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Clients get the JWKS as a 5xx on at most 1% of reads a day
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-jwks-error-rate.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The JWKS error rate is UNKNOWN::The nikatru.com zone analytics could not be read, or no day had enough client reads to judge, so nothing is known about JWKS failures from this run, and that is never a pass. The step log names the reason (a token without Zone Analytics Read is named as such)."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=Clients got the JWKS as a 5xx on over 1% of reads in a day, or the shield served it STALE after more than 5 failed origin reads::Every token verification rests on this read, and a stale 200 hides a Box C outage from monitor 17 for up to an hour. The step log names the day and which bound it crossed. Read Box C's envoy and cloudflared logs for that day (runbooks/boxes/boxc.md) and the edge-shield Worker's logs for shield_jwks_stale."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.edge-shield.7 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Both sites' edge traffic is read and no Web Analytics beacon is injected
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-site-analytics.mjs --cloudflare-read-paged
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The sites' analytics are UNKNOWN::The Web Analytics site list or a zone's page views could not be read. The step log names which; a token without Account Analytics Read or Zone Analytics Read on both zones is named as such. Unread is never a pass."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=Web Analytics injects a browser beacon - ADR 103 section 2.2::Its automatic setup is on for a hostname of nikatru.com or rajasekarselvam.com, so the edge adds the beacon script to every HTML answer. Turn the automatic setup off for that hostname under Web Analytics in the Cloudflare dashboard."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.edge-shield.8 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-ops-watch.edge-shield.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  failure-ledger:
    name: Failed-run ledger and guard yield (weekly; red pages the ops-watch issue)
    if: github.event.schedule == '45 7 * * 1' || ((github.event.client_payload.event || github.event_name) == 'workflow_dispatch' && inputs.failure_ledger)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      exit: ${{ steps.ledger.outputs.exit }}
      unexplained: ${{ steps.ledger.outputs.unexplained }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          fetch-depth: 0
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node
      - name: The ISO week the log cache is keyed by, and the week before it
        id: week
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "prev=$(date -u -d '7 days ago' +%G-W%V)" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.failure-ledger.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Restore this ISO week's ledger cache, else the previous week's
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/triage
          key: failure-ledger-${{ steps.week.outputs.week }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            failure-ledger-${{ steps.week.outputs.week }}-
            failure-ledger-${{ steps.week.outputs.prev }}-
      - name: Every failed run of the last eight days, and the recorded cause it maps to
        id: ledger
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          since="$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          if [ -d .cache/triage ]; then find .cache/triage -type f -mtime +8 -delete; fi
          set +e
          node tooling/ops/triage-failed-runs.mjs --since "$since" --no-prs --branch main --cache-dir .cache/triage --max-requests 600 > "${RUNNER_TEMP}/ledger.txt" 2>&1
          code=$?
          set -e
          cat "${RUNNER_TEMP}/ledger.txt"
          unexplained="$(sed -n -E 's/^UNEXPLAINED: ([0-9]+)$/\1/p' "${RUNNER_TEMP}/ledger.txt" | tail -n 1)"
          echo "exit=${code}" >> "$GITHUB_OUTPUT"
          echo "unexplained=${unexplained:-none printed}" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "::error title=The failed-run ledger is UNKNOWN - nothing was graded::The quota floor refused to start, the request ceiling was reached, a 403, a capped run list, an unreadable log, a malformed causes register, or a clone that cannot answer the merge-base check. The count above, if any, is over a SUBSET. The step log names which."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A failed run has no recorded cause, a recurring cause cannot be ranked, or a recorded fix is not on main::The step log lists each unexplained run with its signature, each cause matched by two or more runs with no firstSeen/lastSeen and no guard/row, or each cause whose merge commit is not an ancestor of origin/main. Add or complete the cause in tooling/ops/failed-run-causes.json, or fix the run."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.failure-ledger.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Save this run's ledger cache, read in full or not
        if: always() && steps.week.outputs.week != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/triage
          key: failure-ledger-${{ steps.week.outputs.week }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: The guard yield is fresh, attributed, and every zero-catch guard is dispositioned
        if: always()
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/guard-yield.mjs --check
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The guard yield is UNKNOWN::tooling/guard-yield.json, tooling/enforcement-index.json or a test file tooling/ci/test/coverage-manifest.json keys could not be read, so nothing about guard yield is known from this run. The step log names which."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=The guard yield is stale, blind, or not acted on::asOf is past MAX_AGE_DAYS (re-fetch with triage-failed-runs.mjs --yield), the unattributed share is over its limit (give the signatures a guard, then guard-yield.mjs --reattribute), or a zero-catch guard has no KEEP/MERGE/RETIRE, or a KEEP's mutationTest does not resolve in the test file it names (guard-yield.mjs --reattribute re-derives an exposure KEEP's). The step log names each."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name ops-watch.failure-ledger.7 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-ops-watch.failure-ledger.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  renovate-backlog:
    name: The Renovate queue drains at least as fast as it fills
    if: github.event.schedule == '45 7 * * 1' || github.event.schedule == '45 7 * * 4' || ((github.event.client_payload.event || github.event_name) == 'workflow_dispatch' && inputs.renovate_backlog)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
