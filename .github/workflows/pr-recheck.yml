# GENERATED by tooling/ci/gen-public-shell.mjs: no source workflow; the bridge's gate-only re-run of ci.yml's ci-gate.
# Do not edit: `node tooling/ci/gen-public-shell.mjs --check` re-generates it and fails on any difference.

name: PR recheck

run-name: "PR recheck · ${{ github.event.client_payload.head_sha }}"

on:
  repository_dispatch:
    types: [nikatru-pr-recheck]

concurrency:
  group: pr-recheck-${{ github.event.client_payload.pr }}
  cancel-in-progress: true

permissions:
  actions: write

jobs:
  nikatru-recheck:
    name: Re-run only ci-gate of the run that judged the PR's head (generated)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Re-run only ci-gate (generated)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_READ_SECRET: ${{ secrets.BRIDGE_READ_SECRET }}
          NIKATRU_BRIDGE_READ_URL: https://gh-bridge.nikatru.workers.dev/pr-meta
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          NIKATRU_GATE_JOB: ci-gate
          NIKATRU_ROOT: ci.yml
          NIKATRU_RUN_NAME: CI
          NIKATRU_WAIT_S: 900
          NIKATRU_POLL_S: 20
        run: |
          set -euo pipefail
          if ! [[ "$NIKATRU_P_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$NIKATRU_P_PR" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::the recheck dispatch names no PR number and head sha"
            exit 1
          fi
          unknown() {
            echo "::error::UNKNOWN — the PR's gate run could not be identified: $1"
            exit 1
          }
          [ -n "${BRIDGE_READ_SECRET:-}" ] || unknown "BRIDGE_READ_SECRET is not set: the bridge read cannot be signed"
          [[ "$NIKATRU_BRIDGE_READ_URL" =~ ^https://[A-Za-z0-9.-]+/pr-meta$ ]] || [[ "$NIKATRU_BRIDGE_READ_URL" =~ ^http://127\.0\.0\.1:[0-9]+/pr-meta$ ]] || unknown "NIKATRU_BRIDGE_READ_URL is not the bridge's https /pr-meta URL"
          # One signed live read of the private PR (POST /pr-meta): its head NOW, its state, and the
          # newest ci-gate status on that head. Sets live_head, live_state and gate_url.
          read_live() {
            local ts sig meta line
            ts=$(date +%s)
            sig=$(python3 -c 'import hashlib, hmac, os, sys; print(hmac.new(os.environ["BRIDGE_READ_SECRET"].encode(), sys.argv[1].encode(), hashlib.sha256).hexdigest())' "$NIKATRU_P_PR.$NIKATRU_P_HEAD_SHA.$ts")
            meta=$(curl -sS --fail --max-time 30 --max-redirs 0 -X POST -H 'content-type: application/json' -H "x-bridge-signature: sha256=$sig" --data "{\"number\":$NIKATRU_P_PR,\"sha\":\"$NIKATRU_P_HEAD_SHA\",\"ts\":$ts}" "$NIKATRU_BRIDGE_READ_URL") || unknown "the bridge's live read of PR #$NIKATRU_P_PR failed"
            line=$(jq -r --argjson n "$NIKATRU_P_PR" 'try (if .number == $n and (.head_sha | test("^[0-9a-f]{40}$")) and (.state | type) == "string" and (.ci_gate == null or (.ci_gate.target_url | type) == "string" or .ci_gate.target_url == null) then "\(.head_sha) \(.state) \(.ci_gate.target_url // "-")" else "" end) catch ""' <<<"$meta")
            [ -n "$line" ] || unknown "the bridge's answer for PR #$NIKATRU_P_PR is not the /pr-meta shape"
            read -r live_head live_state gate_url <<<"$line"
          }
          # (a), and (c) before a re-run: a head that moved, or a PR that is not open, is not this recheck's.
          still_ours() {
            if [ "$live_head" != "$NIKATRU_P_HEAD_SHA" ]; then
              echo "PR #$NIKATRU_P_PR's head is now $live_head, not $NIKATRU_P_HEAD_SHA: that head's own run reads the body live; nothing re-run"
              exit 0
            fi
            if [ "$live_state" != open ]; then
              echo "PR #$NIKATRU_P_PR is $live_state, not open: nothing re-run"
              exit 0
            fi
          }
          prefix="${GITHUB_SERVER_URL:-https://github.com}/$GITHUB_REPOSITORY/actions/runs/"
          deadline=$(( $(date +%s) + NIKATRU_WAIT_S ))
          pinned=""
          while :; do
            read_live
            still_ours
            if [ "$gate_url" = - ]; then
              # (d) no gate status yet: the bridge writes a head's statuses only when its run ENDS (report.ts), so this is
              # normally the head's own run still building. Name it by its title, as (e) does, and judge ITS gate job.
              own=""
              for st in queued in_progress waiting pending requested; do
                runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$NIKATRU_ROOT" --status "$st" --limit 100 --json databaseId,displayTitle,status) || unknown "the $NIKATRU_ROOT runs that are $st could not be listed"
                found=$(jq -r --arg t "$NIKATRU_RUN_NAME · $NIKATRU_P_HEAD_SHA (PR #$NIKATRU_P_PR)" 'try ([.[] | select(.displayTitle == $t and .status != "completed" and (.databaseId | type) == "number") | .databaseId] | max // "" | tostring) catch "?"' <<<"$runs")
                [ "$found" != "?" ] || unknown "the $NIKATRU_ROOT runs that are $st are not a run list"
                if [ -n "$found" ] && { [ -z "$own" ] || [ "$found" -gt "$own" ]; }; then own="$found"; fi
              done
              if [ -n "$own" ]; then
                oview=$(gh run view "$own" --repo "$GITHUB_REPOSITORY" --json status,jobs) || unknown "run $own could not be read"
                ogate=$(jq -r --arg n "$NIKATRU_GATE_JOB" 'try ([.jobs[] | select(.name == $n)] as $g | if ($g | length) == 0 then "absent" elif ($g | length) == 1 and ($g[0].status | type) == "string" then $g[0].status else "" end) catch ""' <<<"$oview")
                [ -n "$ogate" ] || unknown "run $own has more than one $NIKATRU_GATE_JOB job, or is not a run"
                case "$ogate" in
                  absent | queued | waiting | pending | requested)
                    echo "run $own of $NIKATRU_P_HEAD_SHA (PR #$NIKATRU_P_PR) has not reached $NIKATRU_GATE_JOB ($ogate): it reads the body live; nothing re-run"
                    exit 0
                    ;;
                esac
                # its gate has started and may have read the old body: act on that run exactly as (b)/(c)/(e) do.
                [ -n "$pinned" ] || deadline=$(( $(date +%s) + NIKATRU_WAIT_S ))
                pinned="$own"
                gate_url="$prefix$own"
              elif [ -n "$pinned" ]; then
                # the run pinned here has just completed; its status is on its way: judge that run itself.
                gate_url="$prefix$pinned"
              else
                # neither a status nor a running run of this head: truly not found, so it stays fail-closed (r3).
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  unknown "no $NIKATRU_GATE_JOB status and no running $NIKATRU_ROOT run of $NIKATRU_P_HEAD_SHA after ${NIKATRU_WAIT_S}s"
                fi
                sleep "$NIKATRU_POLL_S"
                continue
              fi
            fi
            case "$gate_url" in
              "$prefix"*) rest="${gate_url#"$prefix"}" ;;
              *) unknown "the $NIKATRU_GATE_JOB status names no run of this repository" ;;
            esac
            id="${rest%%/*}"
            [[ "$id" =~ ^[1-9][0-9]{0,19}$ ]] || unknown "the $NIKATRU_GATE_JOB status names no run id"
            # (e) named a newer run of this PR's head whose gate may hold the old body's verdict: act on it.
            if [ -n "$pinned" ] && [ "$pinned" -gt "$id" ]; then id="$pinned"; fi
            view=$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json status,jobs) || unknown "run $id could not be read"
            gate=$(jq -r --arg n "$NIKATRU_GATE_JOB" 'try ([.jobs[] | select(.name == $n)] as $g | if ($g | length) == 1 then "\(.status) \($g[0].databaseId) \($g[0].status) \(if ($g[0].startedAt | type) == "string" and ($g[0].startedAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")) then $g[0].startedAt else "-" end)" else "" end) catch ""' <<<"$view")
            [ -n "$gate" ] || unknown "run $id has no single $NIKATRU_GATE_JOB job"
            read -r run_status job_id job_status job_started <<<"$gate"
            case "$job_status" in
              queued | waiting | pending | requested)
                echo "$NIKATRU_GATE_JOB of run $id is $job_status: it has not read the body yet, and reads it live; nothing re-run"
                exit 0
                ;;
            esac
            if [ "$run_status" = completed ] && [ "$job_status" = completed ]; then
              read_live
              still_ours
              # (e) a NEWER ci.yml run of this PR's head that has not completed: re-running run $id would
              # cancel it through the root's per-PR group. The newest such run is read, never trusted from the list.
              other=""
              for st in queued in_progress waiting pending requested; do
                runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$NIKATRU_ROOT" --status "$st" --limit 100 --json databaseId,displayTitle,status) || unknown "the $NIKATRU_ROOT runs that are $st could not be listed"
                found=$(jq -r --arg t "$NIKATRU_RUN_NAME · $NIKATRU_P_HEAD_SHA (PR #$NIKATRU_P_PR)" --arg id "$id" 'try ([.[] | select(.displayTitle == $t and .status != "completed" and (.databaseId | type) == "number" and .databaseId > ($id | tonumber)) | .databaseId] | max // "" | tostring) catch "?"' <<<"$runs")
                [ "$found" != "?" ] || unknown "the $NIKATRU_ROOT runs that are $st are not a run list"
                if [ -n "$found" ] && { [ -z "$other" ] || [ "$found" -gt "$other" ]; }; then other="$found"; fi
              done
              if [ -n "$other" ]; then
                oview=$(gh run view "$other" --repo "$GITHUB_REPOSITORY" --json status,jobs) || unknown "run $other could not be read"
                ogate=$(jq -r --arg n "$NIKATRU_GATE_JOB" 'try ([.jobs[] | select(.name == $n)] as $g | if ($g | length) == 0 then "absent" elif ($g | length) == 1 and ($g[0].status | type) == "string" then $g[0].status else "" end) catch ""' <<<"$oview")
                [ -n "$ogate" ] || unknown "run $other has more than one $NIKATRU_GATE_JOB job, or is not a run"
                case "$ogate" in
                  absent | queued | waiting | pending | requested)
                    echo "run $other of $NIKATRU_P_HEAD_SHA (PR #$NIKATRU_P_PR) is newer and its $NIKATRU_GATE_JOB has not read the body yet ($ogate): it reads it live, and re-running run $id would cancel it through the per-PR group; nothing re-run"
                    exit 0
                    ;;
                esac
                echo "run $other of $NIKATRU_P_HEAD_SHA (PR #$NIKATRU_P_PR) is newer and its $NIKATRU_GATE_JOB is $ogate: it may hold the old body's verdict; acting on run $other, not run $id"
                pinned="$other"
                continue
              fi
              # (f) its gate started at or after this recheck was dispatched: it read the body as it is now.
              if [ "$job_started" != - ]; then
                self=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${GITHUB_RUN_ID:-}" --jq .created_at) || self=""
                if [[ "$self" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] && ! [[ "$job_started" < "$self" ]]; then
                  echo "$NIKATRU_GATE_JOB of run $id started at $job_started, after this recheck was dispatched ($self): its gate started after the edit and read the body as it is now; nothing re-run"
                  exit 0
                fi
              fi
              gh run rerun "$id" --job "$job_id" --repo "$GITHUB_REPOSITORY"
              echo "re-ran $NIKATRU_GATE_JOB of run $id for $NIKATRU_P_HEAD_SHA: it reads the body as it is now"
              exit 0
            fi
            # (b) in progress: it may already have read the old body; wait for the run to complete, bounded.
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::run $id is still $run_status ($NIKATRU_GATE_JOB $job_status) after ${NIKATRU_WAIT_S}s: re-run its $NIKATRU_GATE_JOB once it completes"
              exit 1
            fi
            sleep "$NIKATRU_POLL_S"
          done
