env:
  NIKATRU_PRIVATE_REPO: nikatru-com/Nikatru_Private

name: Rollback

run-name: "Rollback · ${{ github.event.client_payload.sha }}"

on:
  workflow_dispatch:
    inputs:
      unit:
        description: 'Ledger environment: <app>-web, nikatru-site, rajasekarselvam-site, subscriptiontracker-api, platform or edge-shield. Never a database.'
        required: true
        type: string
      deployment:
        description: 'Id of the ledger Deployment whose Pages deployment or Worker version goes back live.'
        required: true
        type: string
      dry_run:
        description: 'Print the exact command and change nothing. Untick to re-promote.'
        required: true
        type: boolean
        default: true

concurrency:
  group: rollback
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    name: Re-promote a recorded Pages deployment or Worker version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: The dispatch ref is main
        run: node tooling/ci/assert-deploy-ref.mjs --allow main
      - uses: ./.github/actions/setup-node
      - name: Install the wrangler island
        if: ${{ !inputs.dry_run }}
        run: npm ci --ignore-scripts --prefix tooling/wrangler
      - name: Re-promote the recorded Pages deployment or Worker version
        id: rollback
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UNIT: ${{ inputs.unit }}
          DEPLOYMENT: ${{ inputs.deployment }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          dry=()
          if [ "$DRY_RUN" = true ]; then dry=(--dry-run); fi
          node tooling/ops/rollback.mjs --unit "$UNIT" --deployment "$DEPLOYMENT" "${dry[@]}"
      - name: Smoke — the live surface serves the re-promoted build
        if: steps.rollback.outputs.dry_run == 'false'
        env:
          SMOKE_SCRIPT: ${{ steps.rollback.outputs.smoke_script }}
          SMOKE_ARGS: ${{ steps.rollback.outputs.smoke_args }}
        run: node tooling/ops/rollback.mjs --run-smoke
      - name: Record the re-promotion
        if: always() && steps.rollback.outcome == 'success' && steps.rollback.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          UNIT: ${{ steps.rollback.outputs.unit }}
          DEPLOYMENT: ${{ inputs.deployment }}
          ENVIRONMENT_URL: ${{ steps.rollback.outputs.environment_url }}
          SHA: ${{ steps.rollback.outputs.sha }}
          ID_FLAG: ${{ steps.rollback.outputs.id_flag }}
          ID: ${{ steps.rollback.outputs.id }}
        run: node tooling/ci/record-deployment.mjs "$UNIT" "$ENVIRONMENT_URL" --rollback-of "$DEPLOYMENT" --ref "$SHA" "$ID_FLAG" "$ID"
