name: Store screenshots

run-name: "Store screenshots · ${{ github.event.client_payload.sha }}"

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'The app whose listing to capture: one id of the workspace app set (tooling/ci/assert-release-lane-generic.mjs --emit-apps). The gate job refuses any other value.'
        required: true
        type: string
      channel:
        description: "Which store listing to capture"
        required: false
        default: android-play
        type: choice
        options:
          - android-play
          - linux-snap
          - windows-store
          - macos-appstore
          - ios-appstore
      dry_run:
        description: 'Capture and check the set, upload it as the run artifact dry-run-<channel>-<app>, and open no pull request.'
        required: false
        default: false
        type: boolean

