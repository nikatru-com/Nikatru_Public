          NIKATRU_ARTIFACT_NAME: play-screenshots-${{ needs.gate.outputs.app }}
          NIKATRU_IF_NO_FILES: error
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload
      - name: Store dry-run-android-play-${{ needs.gate.outputs.app }} in the bridge's private home (generated)
        if: ${{ inputs.dry_run }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: |
            apps/${{ needs.gate.outputs.app }}/store/android-play/screenshots/
            apps/${{ needs.gate.outputs.app }}/store/android-play/screenshots-tablet/
            sites/nikatru/apps/shots/
            sites/nikatru/apps/*.html
            tooling/site-shots.json
          NIKATRU_ARTIFACT_NAME: dry-run-android-play-${{ needs.gate.outputs.app }}
          NIKATRU_IF_NO_FILES: error
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload
      - name: Propose the set for human review (pull request)
        if: ${{ !inputs.dry_run }}
        env:
          NIKATRU_PROPOSE_PATHS: apps/${{ needs.gate.outputs.app }}/store/android-play/screenshots apps/${{ needs.gate.outputs.app }}/store/android-play/screenshots-tablet ${{ steps.finish.outputs.paths }} ${{ steps.site.outputs.paths }}
          NIKATRU_PROPOSE_BRANCH: chore/play-screenshots-${{ github.run_id }}
          NIKATRU_PROPOSE_BASE: main
          NIKATRU_PROPOSE_TITLE: 'chore(play): the captured screenshot set, for review'
          NIKATRU_PROPOSE_MESSAGE: |
            chore(play): the captured screenshot set, for review

            Captured live by .github/workflows/store-screenshots.yml against a
            build with the real backend defines, so no "Demo data" banner and none
            of the twelve third-party trademarks the demo seed carries.

            CAPTURE.json records the posture; tooling/ci/assert-listing-assets.mjs
            proves size, count, aspect, format and the ABSENCE OF THE DEMO BANNER
            in pixels, and refuses a set whose provenance nobody wrote down.

            What it cannot prove is whether these are the screens worth showing.
            That is the reason this arrives as a pull request: look at the images
            in the diff before merging.
          NIKATRU_PROPOSE_BODY: |
            Rows: none — automated store screenshot capture, reviewed by eye

            Captured by run `${{ github.run_id }}`. **Look at the images in the Files changed tab** — the guard proves size, count, format, aspect and that no demo banner is present in the pixels; it cannot judge whether these are the screens worth showing, and Google requires screenshots to demonstrate the actual in-app experience. Merging is the human decision this PR exists to ask for.
          NIKATRU_PROPOSE_ARTIFACT: proposal-store-screenshots.capture
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
          NIKATRU_BRIDGE_PROPOSE_URL: https://gh-bridge.nikatru.workers.dev/propose
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ops/bridge-propose.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture.23 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Purge the throwaway user
        if: always()
        env:
          E2E_USER_ID: ${{ steps.user.outputs.user_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_APP_ID: ${{ needs.gate.outputs.app }}
          E2E_CONSENT_LEDGER: ${{ runner.temp }}/store-capture-consent.json
          PLATFORM_D1_DATABASE_ID: ${{ steps.backend.outputs.platform_db }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/purge.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture.24 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-store-screenshots.capture.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  capture-linux:
    name: Capture the Snap Store desktop screenshot set (live)
    if: ${{ inputs.channel == 'linux-snap' }}
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      APP: ${{ needs.gate.outputs.app }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Precheck — this app has the suite, the driver and the listing directory the capture needs
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/store/capture-precheck.mjs --app "$APP" --channel linux-snap
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-linux.2 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Preflight — every secret the live capture needs must be present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          missing=""
          for k in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            eval "v=\$$k"
            [ -z "$v" ] && missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Capture cannot run::Missing secret(s):$missing. Without them the app builds in DEMO posture, whose every screen carries a 'Demo data' banner and whose board is twelve third-party trademarks. This is a failed run, not a skipped one."
            exit 1
          fi
          echo "All three secrets present — the build will be LIVE."
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-linux.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - uses: ./.github/actions/setup-node
      - name: Preflight — both sandbox Workers answer healthy
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          for w in platform "${APP}-api"; do
            host="$(node tooling/store/capture-backend.mjs --print-host "$w")"
            body="$(curl --max-time 10 -fsS "$host/v1/health")" || body=""
            case "$body" in
              *'"ok":true'*) echo "$w sandbox is healthy at $host" ;;
              *) echo "::error title=Capture cannot run::the sandbox is not deployed: dispatch deploy-sandbox.yml. $w at $host/v1/health answered: ${body:-nothing}"; exit 1 ;;
            esac
          done
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-linux.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Resolve this app's sandbox databases from its Worker's wrangler file
        id: backend
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/backend.mjs --app "$APP" --env sandbox --emit-output
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-linux.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - uses: ./.github/actions/setup-flutter
      - name: Linux build deps
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev \
            xvfb
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-linux.8 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Enable the Linux desktop target
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          flutter config --enable-linux-desktop
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-linux.9 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: flutter pub get
        working-directory: apps/${{ needs.gate.outputs.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          flutter pub get --enforce-lockfile
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-linux.10 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Where the register says this channel's frames go
        id: reg
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("tooling/channel-register.json", "utf8"));
            const s = r.storeMetadataContract.perChannel["linux-snap"].graphicAssets.screenshots;
            const dirs = [...new Set(Object.values(s.deviceTypeCoverage.sets).map((v) => v.dir))];
            if (dirs.length !== 1) {
              console.error("::error title=This job captures one directory::the register declares " + dirs.length + " distinct set director(ies) for linux-snap (" + dirs.join(", ") + "). The upload and the pull request below are written for one. Extend them in the same change that declares the second set.");
              process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "dir=apps/" + process.env.APP + "/store/linux-snap/" + dirs[0] + "\n");
          '
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-linux.11 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Provision throwaway confirmed user
        id: user
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/provision_user.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-linux.12 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Capture the set
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ steps.user.outputs.email }}
          E2E_PASSWORD: ${{ steps.user.outputs.password }}
          E2E_TOKEN_HASH: ${{ steps.user.outputs.token_hash }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_CONSENT_LEDGER: ${{ runner.temp }}/store-capture-consent.json
          GDK_SCALE: '2'
          GDK_DPI_SCALE: '1'
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          xvfb-run -a -s "-screen 0 2560x1600x24" \
            node tooling/store/capture-deadline.mjs --minutes 20 -- \
            node tooling/store/capture-play-screenshots.mjs --app "$APP" --channel linux-snap
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-linux.13 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The captured set satisfies the listing-asset guard
        id: listing
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node --single-threaded tooling/ci/assert-listing-assets.mjs --for-submission --channel linux-snap
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-linux.14 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The captured set satisfies the device-coverage guard
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node --single-threaded tooling/ci/assert-play-device-coverage.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-linux.15 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Re-derive every set the register derives from this capture
        id: finish
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          node --single-threaded tooling/store/finish-capture.mjs --app "$APP" --channel linux-snap > "${RUNNER_TEMP}/finish-capture.txt"
          cat "${RUNNER_TEMP}/finish-capture.txt"
          echo "paths=$(tr '\n' ' ' < "${RUNNER_TEMP}/finish-capture.txt")" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-linux.16 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Every derived set was derived from the files in this tree
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-derived-sets.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-linux.17 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store FAILED-not-a-listing-set-${{ github.run_id }} in the bridge's private home (generated)
        if: failure() && steps.reg.outputs.dir != ''
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: |
            ${{ steps.reg.outputs.dir }}/
            ${{ runner.temp }}/capture-evidence/
          NIKATRU_ARTIFACT_NAME: FAILED-not-a-listing-set-${{ github.run_id }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload
      - name: Print the ink reading of a FAILED run, for diagnosis only
        if: failure() && steps.listing.outcome == 'failure'
        env:
          FRAMES_DIR: ${{ steps.reg.outputs.dir }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node --single-threaded tooling/store/measure-frame-ink.mjs "$FRAMES_DIR"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-linux.19 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store snap-screenshots-${{ needs.gate.outputs.app }} in the bridge's private home (generated)
        if: ${{ !inputs.dry_run }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ steps.reg.outputs.dir }}/
          NIKATRU_ARTIFACT_NAME: snap-screenshots-${{ needs.gate.outputs.app }}
          NIKATRU_IF_NO_FILES: error
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload
      - name: Store dry-run-linux-snap-${{ needs.gate.outputs.app }} in the bridge's private home (generated)
        if: ${{ inputs.dry_run }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ steps.reg.outputs.dir }}/
          NIKATRU_ARTIFACT_NAME: dry-run-linux-snap-${{ needs.gate.outputs.app }}
          NIKATRU_IF_NO_FILES: error
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload
      - name: Propose the set for human review (pull request)
        if: ${{ !inputs.dry_run }}
        env:
          NIKATRU_PROPOSE_PATHS: ${{ steps.reg.outputs.dir }} ${{ steps.finish.outputs.paths }}
          NIKATRU_PROPOSE_BRANCH: chore/linux-snap-screenshots-${{ github.run_id }}
          NIKATRU_PROPOSE_BASE: main
          NIKATRU_PROPOSE_TITLE: 'chore(snap): the captured screenshot set, for review'
          NIKATRU_PROPOSE_MESSAGE: |
            chore(snap): the captured screenshot set, for review

            Captured live by .github/workflows/store-screenshots.yml against the
            REAL Linux binary with the real backend defines — no "Demo data"
            banner and none of the twelve third-party trademarks the demo seed
            carries.

            CAPTURE.json records the posture; tooling/ci/assert-listing-assets.mjs
            proves size, count, aspect, format and the ABSENCE OF THE DEMO BANNER
            in pixels, and refuses a set whose provenance nobody wrote down.

            What it cannot prove is whether these are the screens worth showing.
            That is the reason this arrives as a pull request: look at the images
            in the diff before merging.
          NIKATRU_PROPOSE_BODY: |
            Rows: none — automated store screenshot capture, reviewed by eye

            Captured by run `${{ github.run_id }}` from the real Linux binary. **Look at the images in the Files changed tab** — the guard proves size, count, format, aspect and that no demo banner is present in the pixels; it cannot judge whether these are the screens worth showing. Merging is the human decision this PR exists to ask for.
          NIKATRU_PROPOSE_ARTIFACT: proposal-store-screenshots.capture-linux
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
          NIKATRU_BRIDGE_PROPOSE_URL: https://gh-bridge.nikatru.workers.dev/propose
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ops/bridge-propose.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-linux.22 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Purge the throwaway user
        if: always()
        env:
          E2E_USER_ID: ${{ steps.user.outputs.user_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_APP_ID: ${{ needs.gate.outputs.app }}
          E2E_CONSENT_LEDGER: ${{ runner.temp }}/store-capture-consent.json
          PLATFORM_D1_DATABASE_ID: ${{ steps.backend.outputs.platform_db }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/purge.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-linux.23 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-store-screenshots.capture-linux.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  capture-desktop-native:
    name: Capture the native desktop screenshot set (live)
    if: ${{ inputs.channel == 'windows-store' || inputs.channel == 'macos-appstore' }}
    needs: gate
    runs-on: ${{ inputs.channel == 'windows-store' && 'windows-2025' || 'macos-26' }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      STORE_CHANNEL: ${{ inputs.channel }}
      APP: ${{ needs.gate.outputs.app }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Precheck — this app has the suite, the driver and the listing directory the capture needs
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/store/capture-precheck.mjs --app "$APP" --channel "$STORE_CHANNEL"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-desktop-native.2 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: Preflight — every secret the live capture needs must be present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          missing=""
          for k in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            eval "v=\$$k"
            [ -z "$v" ] && missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Capture cannot run::Missing secret(s):$missing. Without them the app builds in DEMO posture, whose every screen carries a 'Demo data' banner and whose board is twelve third-party trademarks. This is a failed run, not a skipped one."
            exit 1
          fi
          echo "All three secrets present — the build will be LIVE."
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-desktop-native.3 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - uses: ./.github/actions/setup-node
      - name: Preflight — both sandbox Workers answer healthy
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          for w in platform "${APP}-api"; do
            host="$(node tooling/store/capture-backend.mjs --print-host "$w")"
            body="$(curl --max-time 10 -fsS "$host/v1/health")" || body=""
            case "$body" in
              *'"ok":true'*) echo "$w sandbox is healthy at $host" ;;
              *) echo "::error title=Capture cannot run::the sandbox is not deployed: dispatch deploy-sandbox.yml. $w at $host/v1/health answered: ${body:-nothing}"; exit 1 ;;
            esac
          done
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-desktop-native.5 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: Resolve this app's sandbox databases from its Worker's wrangler file
        id: backend
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/backend.mjs --app "$APP" --env sandbox --emit-output
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-desktop-native.6 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - uses: ./.github/actions/setup-flutter
      - name: What the register says this channel captures
        id: reg
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const channel = process.env.STORE_CHANNEL;
            const r = JSON.parse(fs.readFileSync("tooling/channel-register.json", "utf8"));
            const s = r.storeMetadataContract.perChannel[channel].graphicAssets.screenshots;
            const sets = Object.entries(s.deviceTypeCoverage.sets);
            const dirs = [...new Set(sets.map(([, v]) => v.dir))];
            if (dirs.length !== 1) {
              console.error("::error title=This job captures one directory::the register declares " + dirs.length + " distinct set director(ies) for " + channel + " (" + dirs.join(", ") + "). The upload and the pull request below are written for one. Extend them in the same change that declares the second set.");
              process.exit(1);
            }
            const caps = sets.map(([, v]) => v.capture).filter(Boolean);
            if (caps.length !== 1) {
              console.error("::error title=No capture geometry::the register declares " + caps.length + " `capture` limb(s) for " + channel + ". tooling/store/capture-play-screenshots.mjs reads its viewport from that limb, and with none it has nothing to open a window at.");
              process.exit(1);
            }
            const c = caps[0];
            const want = String(c.runner || "");
            const got = String(process.env.RUNNER_LABEL || "");
            if (want !== got) {
              console.error("::error title=The runner and the register disagree::the register names `" + want + "` for " + channel + " and this job is running on `" + got + "`. `runs-on` cannot be read from a file — GitHub resolves it before any step runs — so the expression at the top of this job and the register have to be changed together. One of the two is now wrong.");
              process.exit(1);
            }
            const out = [
              "dir=apps/" + process.env.APP + "/store/" + channel + "/" + dirs[0],
              "device=" + c.flutterDevice,
            ];
            fs.appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
            console.log(out.join("\n"));
          '
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-desktop-native.8 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
        env:
          RUNNER_LABEL: ${{ inputs.channel == 'windows-store' && 'windows-2025' || 'macos-26' }}
      - name: Enable the desktop target the register names
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          flutter config --enable-${{ steps.reg.outputs.device }}-desktop
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-desktop-native.9 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: flutter pub get
        working-directory: apps/${{ needs.gate.outputs.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          flutter pub get --enforce-lockfile
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-desktop-native.10 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: Provision throwaway confirmed user
        id: user
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/provision_user.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-desktop-native.11 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: Capture the set
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ steps.user.outputs.email }}
          E2E_PASSWORD: ${{ steps.user.outputs.password }}
          E2E_TOKEN_HASH: ${{ steps.user.outputs.token_hash }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_CONSENT_LEDGER: ${{ runner.temp }}/store-capture-consent.json
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/store/capture-deadline.mjs --minutes 30 -- node tooling/store/capture-play-screenshots.mjs --app "$APP" --channel "$STORE_CHANNEL"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-desktop-native.12 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: The captured set satisfies the listing-asset guard
        id: listing
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node --single-threaded tooling/ci/assert-listing-assets.mjs --for-submission --channel "$STORE_CHANNEL"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-desktop-native.13 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: The captured set satisfies the device-coverage guard
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node --single-threaded tooling/ci/assert-play-device-coverage.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-desktop-native.14 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: Re-derive every set the register derives from this capture
        id: finish
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          node --single-threaded tooling/store/finish-capture.mjs --app "$APP" --channel "$STORE_CHANNEL" > "${RUNNER_TEMP}/finish-capture.txt"
          cat "${RUNNER_TEMP}/finish-capture.txt"
          echo "paths=$(tr '\n' ' ' < "${RUNNER_TEMP}/finish-capture.txt")" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-desktop-native.15 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: Every derived set was derived from the files in this tree
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-derived-sets.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-desktop-native.16 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: Store FAILED-not-a-listing-set-${{ github.run_id }} in the bridge's private home (generated)
        if: failure() && steps.reg.outputs.dir != ''
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: |
            ${{ steps.reg.outputs.dir }}/
            ${{ runner.temp }}/capture-evidence/
          NIKATRU_ARTIFACT_NAME: FAILED-not-a-listing-set-${{ github.run_id }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload
      - name: Print the ink reading of a FAILED run, for diagnosis only
        if: failure() && steps.listing.outcome == 'failure'
        env:
          FRAMES_DIR: ${{ steps.reg.outputs.dir }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node --single-threaded tooling/store/measure-frame-ink.mjs "$FRAMES_DIR"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-desktop-native.18 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: Store ${{ inputs.channel }}-screenshots-${{ needs.gate.outputs.app }} in the bridge's private home (generated)
        if: ${{ !inputs.dry_run }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ steps.reg.outputs.dir }}/
          NIKATRU_ARTIFACT_NAME: ${{ inputs.channel }}-screenshots-${{ needs.gate.outputs.app }}
          NIKATRU_IF_NO_FILES: error
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload
      - name: Store dry-run-${{ inputs.channel }}-${{ needs.gate.outputs.app }} in the bridge's private home (generated)
        if: ${{ inputs.dry_run }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ steps.reg.outputs.dir }}/
          NIKATRU_ARTIFACT_NAME: dry-run-${{ inputs.channel }}-${{ needs.gate.outputs.app }}
          NIKATRU_IF_NO_FILES: error
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload
      - name: Propose the set for human review (pull request)
        if: ${{ !inputs.dry_run }}
        env:
          NIKATRU_PROPOSE_PATHS: ${{ steps.reg.outputs.dir }} ${{ steps.finish.outputs.paths }}
          NIKATRU_PROPOSE_BRANCH: chore/${{ inputs.channel }}-screenshots-${{ github.run_id }}
          NIKATRU_PROPOSE_BASE: main
          NIKATRU_PROPOSE_TITLE: 'chore(${{ inputs.channel }}): the captured screenshot set, for review'
          NIKATRU_PROPOSE_MESSAGE: |
            chore(${{ inputs.channel }}): the captured screenshot set, for review

            Captured live by .github/workflows/store-screenshots.yml against the
            REAL native desktop binary with the real backend defines — no "Demo
            data" banner and none of the twelve third-party trademarks the demo
            seed carries.

            CAPTURE.json records the posture; tooling/ci/assert-listing-assets.mjs
            proves size, count, aspect, format and the ABSENCE OF THE DEMO BANNER
            in pixels, and refuses a set whose provenance nobody wrote down.

            What it cannot prove is whether these are the screens worth showing.
            That is the reason this arrives as a pull request: look at the images
            in the diff before merging.
          NIKATRU_PROPOSE_BODY: |
            Rows: none — automated store screenshot capture, reviewed by eye

            Captured by run `${{ github.run_id }}` from the real native desktop binary. **Look at the images in the Files changed tab** — the guard proves size, count, format, aspect and that no demo banner is present in the pixels; it cannot judge whether these are the screens worth showing. Merging is the human decision this PR exists to ask for.
          NIKATRU_PROPOSE_ARTIFACT: proposal-store-screenshots.capture-desktop-native
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
          NIKATRU_BRIDGE_PROPOSE_URL: https://gh-bridge.nikatru.workers.dev/propose
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ops/bridge-propose.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-desktop-native.21 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: Purge the throwaway user
        if: always()
        env:
          E2E_USER_ID: ${{ steps.user.outputs.user_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_APP_ID: ${{ needs.gate.outputs.app }}
          E2E_CONSENT_LEDGER: ${{ runner.temp }}/store-capture-consent.json
          PLATFORM_D1_DATABASE_ID: ${{ steps.backend.outputs.platform_db }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/purge.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-desktop-native.22 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-store-screenshots.capture-desktop-native.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  capture-ios:
    name: Capture the iOS screenshot sets — iPhone and iPad (live)
    if: ${{ inputs.channel == 'ios-appstore' }}
    needs: gate
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      APP: ${{ needs.gate.outputs.app }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Precheck — this app has the suite, the driver and the listing directory the capture needs
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/store/capture-precheck.mjs --app "$APP" --channel ios-appstore
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-ios.2 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Preflight — every secret the live capture needs must be present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          missing=""
          for k in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            eval "v=\$$k"
            [ -z "$v" ] && missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Capture cannot run::Missing secret(s):$missing. Without them the app builds in DEMO posture, whose every screen carries a 'Demo data' banner and whose board is twelve third-party trademarks. This is a failed run, not a skipped one."
            exit 1
          fi
          echo "All three secrets present — the build will be LIVE."
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-ios.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - uses: ./.github/actions/setup-node
      - name: Preflight — both sandbox Workers answer healthy
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          for w in platform "${APP}-api"; do
            host="$(node tooling/store/capture-backend.mjs --print-host "$w")"
            body="$(curl --max-time 10 -fsS "$host/v1/health")" || body=""
            case "$body" in
              *'"ok":true'*) echo "$w sandbox is healthy at $host" ;;
              *) echo "::error title=Capture cannot run::the sandbox is not deployed: dispatch deploy-sandbox.yml. $w at $host/v1/health answered: ${body:-nothing}"; exit 1 ;;
            esac
          done
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-ios.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Resolve this app's sandbox databases from its Worker's wrangler file
        id: backend
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/backend.mjs --app "$APP" --env sandbox --emit-output
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-ios.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - uses: ./.github/actions/setup-flutter
      - name: flutter pub get
        working-directory: apps/${{ needs.gate.outputs.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          flutter pub get --enforce-lockfile
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-ios.8 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: What the register says this channel captures
        id: reg
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("tooling/channel-register.json", "utf8"));
            const s = r.storeMetadataContract.perChannel["ios-appstore"].graphicAssets.screenshots;
            const sets = Object.entries(s.deviceTypeCoverage.sets);
            const bad = sets.filter(([, v]) => !v.capture || !v.capture.flutterDevice);
            if (bad.length) {
              console.error("::error title=No capture geometry::set(s) " + bad.map(([k]) => k).join(", ") + " declare no `capture.flutterDevice`. tooling/store/capture-play-screenshots.mjs reads the device and the viewport from that limb, and with none it has nothing to open.");
              process.exit(1);
            }
            const wrong = sets.filter(([, v]) => v.capture.runner !== "macos-26");
            if (wrong.length) {
              console.error("::error title=The runner and the register disagree::set(s) " + wrong.map(([k]) => k).join(", ") + " name a runner other than `macos-26`, and this job is pinned to macos-26. `runs-on` cannot be read from a file — GitHub resolves it before any step runs — so the two have to be changed together.");
              process.exit(1);
            }
            const dirs = sets.map(([, v]) => "apps/" + process.env.APP + "/store/ios-appstore/" + v.dir);
            const devices = [...new Set(sets.map(([, v]) => v.capture.flutterDevice))];
            // why `;` and not a newline: a step output is one KEY=VALUE line
            // unless it is written with a heredoc delimiter, and a simulator
            // name contains spaces, so neither a raw newline nor whitespace can
            // separate them. The boot loop below splits on `;`.
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "dirs=" + dirs.join(" ") + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "devices=" + devices.join(";") + "\n");
            console.log("dirs: " + dirs.join(" "));
            console.log("devices: " + devices.join(" | "));
          '
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-ios.9 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Boot the simulators the register names
        id: boot
        env:
          DEVICES: ${{ steps.reg.outputs.devices }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -uo pipefail
          xcrun simctl list devices available
          rc=0
          while IFS= read -r -d ';' d || [ -n "$d" ]; do
            [ -z "$d" ] && continue
            echo "booting: $d"
            if ! xcrun simctl boot "$d"; then
              echo "::error title=No such simulator::The register names \"$d\" and this runner image has no available simulator by that name. Apple's required screenshot size classes move with the hardware line-up, so either the device name in tooling/channel-register.json has aged out, or this runner image ships a different Xcode. Fix the register (with the size the new class requires, and its source), not this workflow."
              rc=1
            fi
          done < <(printf '%s' "$DEVICES")
          [ "$rc" -eq 0 ] || exit 1
          xcrun simctl list devices booted
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-ios.10 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Build the iOS app once (warm, bounded)
        id: warm
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/store/capture-deadline.mjs --minutes 21 --evidence-dir "${RUNNER_TEMP}/capture-evidence/warm" -- node tooling/store/warm-native-build.mjs --app "$APP" --platform ios
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-ios.11 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Provision throwaway confirmed user
        id: user
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/provision_user.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-ios.12 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Capture both sets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ steps.user.outputs.email }}
          E2E_PASSWORD: ${{ steps.user.outputs.password }}
          E2E_TOKEN_HASH: ${{ steps.user.outputs.token_hash }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_CONSENT_LEDGER: ${{ runner.temp }}/store-capture-consent.json
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/store/capture-deadline.mjs --minutes 19 -- node tooling/store/capture-play-screenshots.mjs --app "$APP" --channel ios-appstore
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-ios.13 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The captured sets satisfy the listing-asset guard
        id: listing
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node --single-threaded tooling/ci/assert-listing-assets.mjs --for-submission --channel ios-appstore
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-ios.14 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The captured sets satisfy the device-coverage guard
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node --single-threaded tooling/ci/assert-play-device-coverage.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-ios.15 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Re-derive every set the register derives from this capture
        id: finish
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          node --single-threaded tooling/store/finish-capture.mjs --app "$APP" --channel ios-appstore > "${RUNNER_TEMP}/finish-capture.txt"
          cat "${RUNNER_TEMP}/finish-capture.txt"
          echo "paths=$(tr '\n' ' ' < "${RUNNER_TEMP}/finish-capture.txt")" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-ios.16 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Every derived set was derived from the files in this tree
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-derived-sets.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-ios.17 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Capture the IAP review screenshots (one per auto-renewable product)
        id: iap
        if: ${{ !cancelled() && steps.boot.outcome == 'success' && steps.warm.outcome == 'success' }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/store/capture-deadline.mjs --minutes 8 --evidence-dir "${RUNNER_TEMP}/capture-evidence/iap" -- node tooling/store/capture-iap-review.mjs --app "$APP"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name store-screenshots.capture-ios.18 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The review screenshots satisfy their guard (--for-submission)
        if: ${{ !cancelled() && steps.iap.outcome == 'success' }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-iap-review-screenshots.mjs --for-submission
          NIKATRU_QUIET_EOF
