          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name submit-play.dry-run.20 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Every target this channel ships to has its golden-path legs graded (android-play)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-e2e-legs.mjs --for-submission=android-play
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name submit-play.dry-run.21 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Hand the submit job this bundle's name and sha256
        id: bytes
        env:
          AAB: apps/${{ needs.gate.outputs.app }}/build/app/outputs/bundle/release/app-release.aab
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          sum="$(sha256sum "$AAB" | cut -d ' ' -f 1)"
          echo "artifact=${APP}-android-play-aab-${ANDROID_SIGNING_POSTURE:?android-signing.mjs exported no posture}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sum}" >> "$GITHUB_OUTPUT"
          echo "${sum}  ${AAB}"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name submit-play.dry-run.22 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Stage ${{ steps.bytes.outputs.artifact }} for this run's later jobs (generated)
        id: nikatru-stage-2
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: apps/${{ needs.gate.outputs.app }}/build/app/outputs/bundle/release/app-release.aab
          NIKATRU_IF_NO_FILES: error
        run: node tooling/ci/shell-handoff.mjs stage
      - name: Hand off ${{ steps.bytes.outputs.artifact }} to this run's later jobs (generated)
        if: ${{ (success()) && steps.nikatru-stage-2.outputs.has == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-handoff/x
          key: nikatru-handoff-${{ steps.bytes.outputs.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
      - name: Record the dry run in the [10]D-9 ledger (mode dry-run)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/record-deployment.mjs "${APP}-android-play" --mode dry-run
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name submit-play.dry-run.24 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-submit-play.dry-run.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  submit:
    name: Upload to Google Play (owner-approved)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [gate, dry-run]
    if: (github.event.client_payload.event || github.event_name) == 'workflow_dispatch' && inputs.confirm == 'SUBMIT-TO-PLAY'
    environment: store-publish
    permissions:
      contents: read
      checks: read
      deployments: write
    env:
      APP: ${{ needs.gate.outputs.app }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Refuse any ref but main
        run: node tooling/ci/assert-deploy-ref.mjs --allow main
      - name: A real submission must name the listing it will be recorded against
        env:
          LISTING_URL: ${{ inputs.listing_url }}
        run: |
          set -euo pipefail
          case "${LISTING_URL}" in
            https://*)
              echo "⬜ [10]D-9 the submission will be recorded against ${LISTING_URL}"
              ;;
            '')
              echo "FAIL the \`listing_url\` dispatch input is EMPTY, and this job is a REAL upload." >&2
              echo "     [10]D-9: a store record whose listing nobody can open says something shipped and" >&2
              echo "     gives no way to look at it. The [10]D-9 recorder refuses a store environment with" >&2
              echo "     no --listing-url, so this run could upload and then be unable to record what it did." >&2
              echo "     Re-dispatch with listing_url set, e.g." >&2
              echo "       https://play.google.com/store/apps/details?id=<applicationId>" >&2
              exit 1
              ;;
            *)
              echo "FAIL \`listing_url\` is ${LISTING_URL}, which is not an https URL." >&2
              echo "     The ledger row is the ONLY address anybody will have for this submission once the" >&2
              echo "     console is behind an account nobody can open. A value that does not resolve is a" >&2
              echo "     second source of truth, not a record." >&2
              exit 1
              ;;
          esac
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare the Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node tooling/ci/android-signing.mjs --app "$APP"
      - name: Name clearance holds for android-play (owner HELD or PROVEN-FREE)
        run: node tooling/ci/assert-name-clearance.mjs --for-submission=android-play
      - name: The app's Play declarations are sworn, not preview (--for-submission)
        env:
          PLAY_TRACK: ${{ inputs.track }}
        run: node tooling/ci/assert-sworn-store-files.mjs --for-submission=android-play --app "$APP" --real-submission
      - name: A pending in-app purchase declaration is not submitted (android-play)
        run: node tooling/ci/assert-app-yaml.mjs --for-submission=android-play --app "$APP"
      - name: A build that cannot sign in reaches no public track (android-play)
        env:
          PLAY_TRACK: ${{ inputs.track }}
        run: node tooling/ci/assert-channel-register.mjs --for-submission=android-play --real-submission
      - name: Every target this channel ships to has its golden-path legs graded (android-play)
        run: node tooling/ci/assert-e2e-legs.mjs --for-submission=android-play
      - name: The versionCode lies above what Play consumed
        env:
          RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          RECORDED="$(node tooling/ci/read-ledger-version-code.mjs "${APP}-android-play")"
          node tooling/ci/assert-app-versioning.mjs --play-floor "$RUN_NUMBER" --app "$APP" --recorded-upload "$RECORDED"
      - name: Restore the ${{ needs.dry-run.outputs.artifact }} hand-off (generated)
        id: nikatru-restore-3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-handoff/x
          key: nikatru-handoff-${{ needs.dry-run.outputs.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nikatru-handoff-${{ needs.dry-run.outputs.artifact }}-${{ github.run_id }}-
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Place the ${{ needs.dry-run.outputs.artifact }} hand-off where download-artifact put it (generated)
        if: ${{ (success()) && steps.nikatru-restore-3.outputs.cache-matched-key != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_TO: apps/${{ needs.gate.outputs.app }}/build/app/outputs/bundle/release
        run: |
          mkdir -p "$NIKATRU_TO"
          cp -a .nikatru-handoff/x/. "$NIKATRU_TO/"
          rm -rf .nikatru-handoff/x
      - name: The bundle is the one the dry-run job hashed (sha256)
        env:
          EXPECTED_SHA256: ${{ needs.dry-run.outputs.sha256 }}
          AAB: apps/${{ needs.gate.outputs.app }}/build/app/outputs/bundle/release/app-release.aab
        run: |
          set -euo pipefail
          if ! printf '%s' "$EXPECTED_SHA256" | grep -Eqx '[0-9a-f]{64}'; then
            echo "FAIL the dry-run job's sha256 output is '${EXPECTED_SHA256}', not 64 hex digits: nothing to check the download against." >&2
            exit 1
          fi
          printf '%s  %s\n' "$EXPECTED_SHA256" "$AAB" | sha256sum --check --strict -
      - name: The .aab must be signed by the upload key, not the debug key
        run: >
          node tooling/ci/assert-artifact-signed.mjs
          "apps/${APP}/build/app/outputs/bundle/release/app-release.aab"
      - name: The Play screenshot set spans enough device types
        run: node tooling/ci/assert-play-device-coverage.mjs --for-submission=android-play
      - name: Every native library is aligned for a 16 KB memory page
        run: >
          node --single-threaded tooling/ci/assert-elf-page-alignment.mjs
          "apps/${APP}/build/app/outputs/bundle/release/app-release.aab"
      - name: Restore the symbols-${{ needs.gate.outputs.app }}-android-play-dry-run hand-off (generated)
        id: nikatru-restore-4
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-handoff/x
          key: nikatru-handoff-symbols-${{ needs.gate.outputs.app }}-android-play-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nikatru-handoff-symbols-${{ needs.gate.outputs.app }}-android-play-dry-run-${{ github.run_id }}-
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Place the symbols-${{ needs.gate.outputs.app }}-android-play-dry-run hand-off where download-artifact put it (generated)
        if: ${{ (success()) && steps.nikatru-restore-4.outputs.cache-matched-key != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_TO: apps/${{ needs.gate.outputs.app }}/build/symbols/android-aab
        run: |
          mkdir -p "$NIKATRU_TO"
          cp -a .nikatru-handoff/x/. "$NIKATRU_TO/"
          rm -rf .nikatru-handoff/x
      - name: Copy this build's symbols to the release store (R2), before the upload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASE_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          R2_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
          VERSION_CODE: ${{ needs.dry-run.outputs.version_code }}
        run: |
          set -euo pipefail
          release_line="$(node tooling/ci/assert-app-versioning.mjs --emit "apps/${APP}" | sed -n 's/^release_line=//p')"
          node tooling/ci/r2-durable-copy.mjs --kind symbols --app "$APP" --channel android-play \
            --version "${release_line}.${RUN_NUMBER}" --build "$VERSION_CODE" \
            --dir "apps/${APP}/build/symbols/android-aab" --out "${RUNNER_TEMP}/symbols-record.json"
      - name: The android-play artifact is within its store's size limit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AAB: apps/${{ needs.gate.outputs.app }}/build/app/outputs/bundle/release/app-release.aab
        run: node tooling/ci/assert-artifact-size.mjs --app "$APP" --channel android-play "$AAB"
      - name: Upload to Google Play
        id: upload
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ inputs.track }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          CONFIRM: ${{ inputs.confirm }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          node tooling/release/submit-play.mjs --submit --app "$APP"
          --confirm "$CONFIRM" --status "$RELEASE_STATUS"
      - name: The Play track must carry the bundle this job just uploaded
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ needs.dry-run.outputs.version_code }}
        run: |
          set -euo pipefail
          case "${VERSION_CODE}" in
            ''|*[!0-9]*)
              echo "FAIL the dry-run job's version_code is '${VERSION_CODE}', not a positive integer; the versionCode" >&2
              echo "     this job uploaded cannot be known, so the probe refuses to guess." >&2
              exit 1
              ;;
          esac
          APPLICATION_ID="$(node --input-type=module -e '
          import { readFileSync } from "node:fs";
          import { readGradleApplicationId } from "./tooling/ci/read-identity.mjs";
          const rel = "apps/" + process.env.APP + "/android/app/build.gradle.kts";
          const id = readGradleApplicationId(readFileSync(rel, "utf8"), rel);
          if (!id.value) { console.error(id.missing ?? id.lost); process.exit(1); }
          process.stdout.write(id.value);
          ')"
          echo "⬜ [14]O-7 reading the Play track state for ${APPLICATION_ID}, expecting versionCode ${VERSION_CODE}"
          node tooling/ops/post-deploy-smoke.mjs --play-package "${APPLICATION_ID}" --expect "${VERSION_CODE}"
          echo "::notice title=Play versionCode high-water::versionCode ${VERSION_CODE} is consumed. Record it in tooling/channel-register.json android-play.versionCodeHighWater.consumed.${APP}, and the ledger now holds it: the next dispatch stops until consumed is raised to it"
      - name: Record the submission in the [10]D-9 ledger
        if: always() && steps.upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LISTING_URL: ${{ inputs.listing_url }}
          VERSION_CODE: ${{ needs.dry-run.outputs.version_code }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          AAB: apps/${{ needs.gate.outputs.app }}/build/app/outputs/bundle/release/app-release.aab
        run: |
          set -euo pipefail
          if [ "$RELEASE_STATUS" = draft ]; then
            node tooling/ci/record-deployment.mjs "${APP}-android-play" --state draft_staged --listing-url "$LISTING_URL" --version-code "$VERSION_CODE" --mode production --artifact "$AAB" --build-number "$VERSION_CODE" --symbols-record "${RUNNER_TEMP}/symbols-record.json"
          else
            node tooling/ci/record-deployment.mjs "${APP}-android-play" --state in_review --listing-url "$LISTING_URL" --version-code "$VERSION_CODE" --mode production --artifact "$AAB" --build-number "$VERSION_CODE" --symbols-record "${RUNNER_TEMP}/symbols-record.json"
          fi
