          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          flutter build linux --release --obfuscate --split-debug-info="$SYMBOLS_DIR" -t "$PROBE_SOURCE" --dart-define=GLITCHTIP_DSN="$GLITCHTIP_DSN"
