        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          flutter build apk --release --obfuscate --split-debug-info="$SYMBOLS_DIR" --target-platform android-x64 -t "$PROBE_SOURCE" --dart-define=GLITCHTIP_DSN="$GLITCHTIP_DSN"
