        working-directory: apps/${{ needs.gate.outputs.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node ../../tooling/ops/symbolication-proof.mjs expect --source "$PROBE_SOURCE"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name symbolication-proof.prove.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Build the crash probe (obfuscated release apk)
        if: ${{ matrix.target == 'android-x64' }}
        working-directory: apps/${{ needs.gate.outputs.app }}
        env:
