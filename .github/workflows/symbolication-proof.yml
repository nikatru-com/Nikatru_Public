    env:
      APP: ${{ needs.gate.outputs.app }}
      TARGET: ${{ matrix.target }}
      PROBE_SOURCE: live_probe/symbolication_crash_probe.dart
      SYMBOLS_DIR: build/symbols/probe-${{ matrix.target }}
