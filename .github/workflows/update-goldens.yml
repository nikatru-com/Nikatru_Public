# GENERATED by tooling/ci/gen-public-shell.mjs from .github/workflows/update-goldens.yml of nikatru-com/Nikatru_Private.
# Do not edit: `node tooling/ci/gen-public-shell.mjs --check` re-generates it and fails on any difference.
env:
  NIKATRU_PRIVATE_REPO: nikatru-com/Nikatru_Private

name: Update goldens

run-name: "Update goldens · ${{ github.event.client_payload.sha }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The branch to regenerate on and push to. Never main.
        required: true
        type: string
      tests:
        description: Space-separated test files, relative to the repository root (apps/<id>/test/x_test.dart).
        required: true
        type: string
      mode:
        description: artifact keeps the PNGs in the bridge's private home for tooling/ops/apply-goldens.mjs; commit is refused.
        required: true
        default: artifact
        type: choice
        options:
          - artifact
          - commit

concurrency:
  group: update-goldens-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  regenerate:
    name: Re-render the goldens on Linux, then pass without --update-goldens
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      count: ${{ steps.delta.outputs.count }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n 's/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::refs/pull/$NIKATRU_P_PR/merge is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); GitHub recomputes it after a push — re-run this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Refuse main and a ref that is not a plain branch name
        timeout-minutes: 1
        env:
          REF: ${{ inputs.ref }}
          MODE: ${{ inputs.mode }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          if [ "$REF" = "main" ] || [ "$REF" = "refs/heads/main" ]; then
            echo "::error title=Refused::ref is main. Goldens land on a branch and reach main through a pull request and ci-gate."
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*$' || ! git check-ref-format --branch "$REF" > /dev/null; then
            echo "::error title=Refused::ref '$REF' is not a plain branch name."
            exit 1
          fi
          if [ "$MODE" != "artifact" ]; then
            echo "::error title=Refused: mode=$MODE cannot push from the public shell::The shell holds no credential that writes the private repository (its GITHUB_TOKEN writes only the shell; the deploy key is read-only). Dispatch again with mode=artifact, then on Box A run: node tooling/ops/apply-goldens.mjs --run <that run's id> --ref $REF"
            exit 1
          fi
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name update-goldens.regenerate.1 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/${{ inputs.ref }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
        timeout-minutes: 5
      - name: Resolve the test files to their packages
        id: plan
        timeout-minutes: 1
        env:
          REF: ${{ inputs.ref }}
          TESTS: ${{ inputs.tests }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          # The ref must be a BRANCH at exactly what was checked out: the tip the
          # checkout fetched for refs/heads/$REF, on a local branch of that name.
          # apply-goldens.mjs re-reads the live tip before it pushes, so a branch
          # that moves after this point is refused there, never overwritten.
          tip="$(git rev-parse --verify --quiet "refs/remotes/origin/$REF^{commit}" || true)"
          head="$(git rev-parse HEAD)"
          branch="$(git symbolic-ref --quiet --short HEAD || true)"
          if [ -z "$tip" ] || [ "$tip" != "$head" ] || [ "$branch" != "$REF" ]; then
            echo "::error title=Refused::'$REF' is not a branch checked out at its fetched tip (HEAD $head on '${branch:-a detached HEAD}'; origin/$REF is '${tip:-nothing}')."
            exit 1
          fi
          # The shell's private upload runs the BRANCH's tooling/ops/bridge-artifact.mjs
          # (gen-public-shell.mjs); a branch cut before it existed is refused now,
          # not after thirty minutes of Flutter.
          if [ -n "${NIKATRU_PRIVATE_REPO:-}" ] && [ ! -f tooling/ops/bridge-artifact.mjs ]; then
            echo "::error title=Refused::'$REF' has no tooling/ops/bridge-artifact.mjs, which stores the PNGs in the bridge's private home. Merge main into the branch, then dispatch again."
            exit 1
          fi
          read -r -a tests <<< "$TESTS"
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error title=Refused::tests is empty."
            exit 1
          fi
          : > "$RUNNER_TEMP/plan.tsv"
          for t in "${tests[@]}"; do
            if ! printf '%s' "$t" | grep -Eq '^(apps|packages)/[a-z][a-z0-9_]*/test/([A-Za-z0-9_]+/)*[A-Za-z0-9_]+_test\.dart$'; then
              echo "::error title=Refused::'$t' is not apps/<id>/test/..._test.dart or packages/<name>/test/..._test.dart."
              exit 1
            fi
            if [ ! -f "$t" ]; then
              echo "::error title=Refused::'$t' does not exist on $REF."
              exit 1
            fi
            pkg="$(printf '%s' "$t" | cut -d/ -f1,2)"
            printf '%s\t%s\n' "$pkg" "${t#"$pkg"/}" >> "$RUNNER_TEMP/plan.tsv"
          done
          cut -f1 "$RUNNER_TEMP/plan.tsv" | sort -u > "$RUNNER_TEMP/packages.txt"
          echo "Packages:"
          cat "$RUNNER_TEMP/packages.txt"
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name update-goldens.regenerate.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - uses: ./.github/actions/setup-flutter
        timeout-minutes: 10
      - name: Resolve the workspace
        timeout-minutes: 5
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          flutter pub get --enforce-lockfile
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name update-goldens.regenerate.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Record the tree before the goldens are re-rendered
        timeout-minutes: 2
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          git ls-files -z --modified --others --exclude-standard | sort -zu | while IFS= read -r -d '' f; do
            if [ -e "$f" ]; then printf '%s %s\n' "$(sha256sum < "$f" | cut -c1-64)" "$f"; else printf 'deleted %s\n' "$f"; fi
          done > "$RUNNER_TEMP/before.txt"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name update-goldens.regenerate.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: flutter test --update-goldens
        timeout-minutes: 15
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          while IFS= read -r pkg; do
            mapfile -t files < <(awk -F'\t' -v p="$pkg" '$1 == p { print $2 }' "$RUNNER_TEMP/plan.tsv")
            echo "::group::$pkg: flutter test --update-goldens ${files[*]}"
            (cd "$pkg" && flutter test --update-goldens "${files[@]}")
            echo "::endgroup::"
          done < "$RUNNER_TEMP/packages.txt"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name update-goldens.regenerate.7 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Only golden PNGs of the tested packages changed
        id: delta
        timeout-minutes: 2
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          git ls-files -z --modified --others --exclude-standard | sort -zu | while IFS= read -r -d '' f; do
            if [ -e "$f" ]; then printf '%s %s\n' "$(sha256sum < "$f" | cut -c1-64)" "$f"; else printf 'deleted %s\n' "$f"; fi
          done > "$RUNNER_TEMP/after.txt"
          comm -13 <(sort "$RUNNER_TEMP/before.txt") <(sort "$RUNNER_TEMP/after.txt") | cut -d' ' -f2- | sort -u > "$RUNNER_TEMP/changed.txt"
          bad=0
          while IFS= read -r f; do
            ok=0
            if [ -f "$f" ]; then
              while IFS= read -r pkg; do
                case "$f" in
                  "$pkg"/test/*goldens/*.png)
                    if printf '%s' "${f#"$pkg"/test/}" | grep -Eq '^([A-Za-z0-9_]+/)*goldens/[^/]+\.png$'; then ok=1; fi ;;
                esac
              done < "$RUNNER_TEMP/packages.txt"
            fi
            if [ "$ok" -eq 0 ]; then
              echo "::error title=Refused: not a golden PNG of a tested package::$f"
              bad=1
            fi
          done < "$RUNNER_TEMP/changed.txt"
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi
          count="$(grep -c . "$RUNNER_TEMP/changed.txt" || true)"
          echo "Changed golden PNGs: $count"
          cat "$RUNNER_TEMP/changed.txt"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name update-goldens.regenerate.8 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The same tests pass WITHOUT --update-goldens
        timeout-minutes: 15
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          while IFS= read -r pkg; do
            mapfile -t files < <(awk -F'\t' -v p="$pkg" '$1 == p { print $2 }' "$RUNNER_TEMP/plan.tsv")
            echo "::group::$pkg: flutter test ${files[*]}"
            (cd "$pkg" && flutter test "${files[@]}")
            echo "::endgroup::"
          done < "$RUNNER_TEMP/packages.txt"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name update-goldens.regenerate.9 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Stage the changed PNGs at their repository paths
        if: steps.delta.outputs.count != '0'
        timeout-minutes: 2
        env:
          REF: ${{ inputs.ref }}
          TESTS: ${{ inputs.tests }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/goldens"
          while IFS= read -r f; do
            mkdir -p "$RUNNER_TEMP/goldens/$(dirname "$f")"
            cp -- "$f" "$RUNNER_TEMP/goldens/$f"
          done < "$RUNNER_TEMP/changed.txt"
          read -r -a tests <<< "$TESTS"
          {
            printf 'run %s\n' "$GITHUB_RUN_ID"
            printf 'attempt %s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'ref %s\n' "$REF"
            printf 'sha %s\n' "$SHA"
            for t in "${tests[@]}"; do printf 'test %s\n' "$t"; done
            while IFS= read -r f; do printf 'file %s %s\n' "$(sha256sum < "$f" | cut -c1-64)" "$f"; done < "$RUNNER_TEMP/changed.txt"
          } > "$RUNNER_TEMP/goldens/goldens-run.txt"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name update-goldens.regenerate.10 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store goldens-${{ github.run_id }} in the bridge's private home (generated)
        if: steps.delta.outputs.count != '0'
        timeout-minutes: 5
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/goldens
          NIKATRU_ARTIFACT_NAME: goldens-${{ github.run_id }}
          NIKATRU_IF_NO_FILES: error
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload
      - name: Nothing changed
        if: steps.delta.outputs.count == '0'
        timeout-minutes: 1
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          echo "::notice title=No golden changed::The re-render on Linux produced the committed PNGs byte for byte, and the tests pass. Nothing to upload or apply."
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name update-goldens.regenerate.12 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-update-goldens.regenerate.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload
