          # NIKATRU_PRIVATE_REPO and GITHUB_REPOSITORY names the PUBLIC shell, so a push must never take it there.
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${NIKATRU_PRIVATE_REPO:-$GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${REF}"
          echo "::notice title=Goldens pushed to ${REF}::A push by GITHUB_TOKEN starts no workflow, so CI does not re-run by itself. Re-trigger it on the pull request: push any commit, or close and reopen it (ci.yml no longer runs on a body edit)."
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/tooling/ci/quiet-step.mjs" --name update-goldens.commit.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Hand this job's red detail to the report job, sealed (generated)
        id: nikatru-handoff
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_HANDOFF: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-update-goldens.commit.${{ strategy.job-index }}
        run: |
          if [ -s "$RUNNER_TEMP/report-detail.md" ]; then
            py=python3; python3 -c '' >/dev/null 2>&1 || py=python
            "$py" -I "$GITHUB_WORKSPACE/tooling/ci/shell-report.py" handoff
          fi
      - name: Save the hand-off (generated)
        if: always() && steps.nikatru-handoff.outputs.has == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-detail
          key: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-update-goldens.commit.${{ strategy.job-index }}
          enableCrossOsArchive: true
