        timeout-minutes: 1
        env:
          REF: ${{ inputs.ref }}
          TESTS: ${{ inputs.tests }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          # The ref must be a BRANCH at exactly what was checked out, or the
          # commit job would push onto something other than what was tested.
          remote="$(git ls-remote --heads origin "refs/heads/$REF" | cut -f1)"
          head="$(git rev-parse HEAD)"
          if [ -z "$remote" ] || [ "$remote" != "$head" ]; then
            echo "::error title=Refused::'$REF' is not a branch on origin at the checked-out commit ($head; origin has '${remote:-nothing}')."
            exit 1
          fi
          read -r -a tests <<< "$TESTS"
