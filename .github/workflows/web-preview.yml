      - name: Stage the static bytes the preview serves
        id: stage
        env:
          UNIT: ${{ matrix.unit }}
        run: node tooling/ci/web-preview.mjs --stage "$UNIT" --from .nikatru-pr-tree --out build/web-preview/site >> "$GITHUB_OUTPUT"
      - name: Read the project's production branch, and refuse to upload onto it
        id: target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UNIT: ${{ matrix.unit }}
        run: node tooling/ci/web-preview.mjs --target "$UNIT" >> "$GITHUB_OUTPUT"
      - name: Upload the staged bytes to the pr-<n> alias, never to production
        if: steps.target.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.147.0'
          PR_NUMBER: ${{ github.event.client_payload.pr }}
          HEAD_SHA: ${{ (github.event.client_payload.event == 'pull_request' && github.event.client_payload.sha || '') }}
          PROJECT: ${{ steps.target.outputs.project }}
          BRANCH: ${{ steps.target.outputs.branch }}
          PRODUCTION_BRANCH: ${{ steps.target.outputs.production_branch }}
        run: |
          set -uo pipefail
          if [ "$BRANCH" != "pr-${PR_NUMBER}" ] || [ "$BRANCH" = "$PRODUCTION_BRANCH" ]; then
