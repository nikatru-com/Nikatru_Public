          wrangler="$(pwd)/tooling/wrangler/node_modules/.bin/wrangler"
          mkdir -p "$RUNNER_TEMP/wrangler-cwd"
          cd "$RUNNER_TEMP/wrangler-cwd"
          "$wrangler" pages deploy "$site" --project-name "$PROJECT" --branch "$BRANCH" --commit-hash "$HEAD_SHA" --commit-dirty=true >> "$log" 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then echo "::error title=web preview::wrangler pages deploy exited ${code}"; tail -n 20 "$log"; exit 1; fi
          echo "uploaded to the ${BRANCH} alias of ${PROJECT}"
